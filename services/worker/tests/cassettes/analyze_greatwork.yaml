      string: '{"model":"claude-haiku-5-5","id":"msg_011Cgv3iSU7NwqngQTADgoNG","type":"message","role":"assistant","content":[{"type":"text","text":"{\"summary\":{\"gist\":\"Paul
        Graham''s guide to doing great work: pick something you have aptitude for
        and deep interest in, learn enough to reach a field''s frontier, notice gaps
        others ignore, and explore them. Interest and boldness matter more than planning,
        and the main danger is procrastinating on ambitious projects while staying
        busy.\",\"key_ideas\":[{\"timestamp\":null,\"idea\":\"Great work sits where
        natural aptitude, deep interest, and scope intersect; in practice, aptitude
        plus interest is what to look for, since ambitious people already aim too
        conservatively on scope.\"},{\"timestamp\":null,\"idea\":\"Figure out what
        to work on by working: guess, start, and adjust, because you often can''t
        know what a field is like until you do it.\"},{\"timestamp\":null,\"idea\":\"Knowledge
        expands fractally: from afar its edges look smooth, but close up they are
        full of gaps. Noticing gaps that others take for granted is where discoveries
        come from.\"},{\"timestamp\":null,\"idea\":\"Four steps: choose a field, learn
        enough to reach the frontier, notice gaps, explore promising ones. Steps two
        and four demand hard work, and interest is what sustains it.\"},{\"timestamp\":null,\"idea\":\"Follow
        what you find interesting rather than fashion, money, or others'' wishes;
        make what you yourself want, since imagined audiences lead you astray.\"},{\"timestamp\":null,\"idea\":\"Plan
        less and stay upwind: at each stage do whatever seems most interesting and
        keeps the best future options open, since planning only works for goals you
        can describe in advance.\"},{\"timestamp\":null,\"idea\":\"Working hard has
        diminishing returns; hard work is often limited to four or five hours a day,
        ideally in contiguous blocks free of interruptions.\"},{\"timestamp\":null,\"idea\":\"Starting
        has activation energy, so it is fine to trick yourself into starting, for
        example by saying you''ll just reread what you have.\"},{\"timestamp\":null,\"idea\":\"Per-project
        procrastination is the more dangerous kind: it hides behind being busy with
        other work, so ask whether you''re working on what you most want to work on.\"}],\"numbers\":[{\"timestamp\":null,\"fact\":\"Some
        of the hardest types of work can only be done for about four or five hours
        a day.\"}]},\"domain\":\"Other\",\"topic\":\"Doing great work\",\"tags\":[\"productivity\",\"career\",\"curiosity\",\"research\",\"ambition\",\"essay\"],\"concepts\":[\"Aptitude
        and interest intersection\",\"Fractal knowledge frontier\",\"Noticing gaps\",\"Staying
        upwind\",\"Activation energy in work\",\"Per-project procrastination\",\"Diminishing
        returns of work\",\"Excitingness rule\"],\"is_educational\":true,\"cards\":[{\"kind\":\"concept\",\"question\":\"What
        three qualities should the work you choose have?\",\"answer\":\"Aptitude,
        deep interest, and scope for greatness\",\"detail\":[\"Scope matters less
        in practice, since ambitious people already aim too conservatively\"]},{\"kind\":\"concept\",\"question\":\"What
        is the four-step recipe for doing great work?\",\"answer\":\"Choose a field,
        reach frontier, notice gaps, explore\",\"detail\":[\"Steps two and four demand
        hard work, which interest sustains\"]},{\"kind\":\"mechanism\",\"question\":\"Why
        do discoveries come from noticing gaps at a field''s frontier?\",\"answer\":\"Frontier
        edges look smooth from afar but are full of gaps\",\"detail\":[\"Your brain
        wants to ignore gaps to keep a simpler model of the world\"]},{\"kind\":\"mechanism\",\"question\":\"Why
        is per-project procrastination more dangerous than per-day procrastination?\",\"answer\":\"It
        disguises itself as productive work on other things\",\"detail\":[\"It doesn''t
        trigger the alarm that idle procrastination does\"]},{\"kind\":\"number\",\"question\":\"How
        many hours a day can the hardest kinds of work sustain?\",\"answer\":\"About
        four or five hours a day\",\"detail\":[]}]}"}],"container":null,"stop_reason":"end_turn","stop_sequence":null,"stop_details":null,"usage":{"input_tokens":6672,"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":0},"output_tokens":1268,"output_tokens_details":{"thinking_tokens":0},"service_tier":"standard","inference_geo":"global","speed":"standard"},"diagnostics":null}'
