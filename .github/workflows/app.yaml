name: App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    # jest runs the sync engine against a real SQLite database (better-sqlite3).
    - name: Run tests
      run: npm test
