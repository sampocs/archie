        icon-container view-image buttonBase-GK1x3M\\\">\\u003csvg xmlns=\\\"http://www.w3.org/2000/svg\\\"
        width=\\\"20\\\" height=\\\"20\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\"
        stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\"
        stroke-linejoin=\\\"round\\\" class=\\\"lucide lucide-maximize2 lucide-maximize-2
        icon-noB79L\\\">\\u003cpolyline points=\\\"15 3 21 3 21 9\\\">\\u003c/polyline>\\u003cpolyline
        points=\\\"9 21 3 21 3 15\\\">\\u003c/polyline>\\u003cline x1=\\\"21\\\" x2=\\\"14\\\"
        y1=\\\"3\\\" y2=\\\"10\\\">\\u003c/line>\\u003cline x1=\\\"3\\\" x2=\\\"10\\\"
        y1=\\\"21\\\" y2=\\\"14\\\">\\u003c/line>\\u003c/svg>\\u003c/button>\\u003c/div>\\u003c/div>\\u003c/div>\\u003c/a>\\u003c/figure>\\u003c/div>\\u003cp>Different
        languages have different profilers. But they use a shared language and store
        the same core information. For example, JVM\u2019s async-profiler or Java
        Flight Recorder operates at 100 Hz sampling to capture execution traces, memory
        allocation rates, and thread lock contention. Python\u2019s py-spy provides
        low-overhead, async stack sampling of live production processes. Go has pprof,
        which generates goroutine profiles, heap snapshots, and block contention data.\\u003c/p>\\u003cp>Each
        one of these profilers breaks down execution into call stacks. They track
        two main metrics. First, you have the inclusive time. This is the total time
        spent executing a function. It includes every child function and the subroutines
        called by this function. Second, you have the Self (CPU) Time. It\u2019s the
        time spent running code purely inside the function itself. No external calls
        are involved.\\u003c/p>\\u003cp>With this exercise, the Netflix engineering
        team came to the conclusion that a single analytical pipeline could understand
        data from almost any programming runtime.\\u003c/p>\\u003cp>Another advantage
        of LLMs is that they don\u2019t have to guess how an algorithm works from
        scratch. Since LLMs have been broadly trained on many software repositories,
        they are mostly familiar with classic programming anti-patterns. For example,
        they know that quadratic loops where a hot method is called again and again
        for each item in a collection aren\u2019t a good idea. Also, loop invariants
        where you compute a calculation for every iteration of the loop instead of
        making the calculation once at the beginning. Other patterns include excessive
        object allocation on hot execution paths and \u201CN+1\u201D query patterns.\\u003c/p>\\u003cp>Due
        to this knowledge base of LLMs, you don\u2019t need to ask an AI model to
        guess why an application might be performing poorly. You can build a workflow
        that asks the model to pattern-match known performance bugs against actual
        call stacks.\\u003c/p>\\u003ch2>The Agentic Profiling Pipeline\\u003c/h2>\\u003cp>Netflix
        built an automated performance system that wraps the LLM inside a well-defined
        pipeline.\\u003c/p>\\u003cdiv class=\\\"captioned-image-container\\\">\\u003cfigure>\\u003ca
