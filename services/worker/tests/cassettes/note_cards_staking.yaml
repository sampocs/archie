      stake\n\n<notes>\n# Proof of stake\n\n- validators lock up coins instead of
      burning power\n- cheating gets the stake slashed\n- Ethereum needs 32 ETH per
      validator\n- energy use fell about 99.95% after the merge\n\n</notes>\n\n<explanation>\nProof
      of stake secures a blockchain with locked-up coins instead of computing work.\n\nKey
      ideas:\n- Validators lock coins as a stake, and are chosen to propose blocks.\n-
      A validator who signs conflicting blocks has part of its stake slashed.\n- Attacking
      the chain means buying a large share of the coins, which is costly.\n- Without
      mining hardware, energy use is a tiny fraction of proof of work.\n\nNumbers:\n-
      Ethereum requires 32 ETH per validator.\n- Energy use fell about 99.95% after
