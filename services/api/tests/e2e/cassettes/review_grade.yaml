    body: '{"max_tokens":1500,"messages":[{"role":"user","content":"Question: Why
      does the Fed raise rates when inflation is high?\nAccepted answer: Costlier
      borrowing cools spending\nMore (not required):\n- Loans cost more, so people
      and firms borrow and spend less\n- Less spending eases the pressure on prices\nAnswer:
      ''to make loans expensive so people spend less''"}],"model":"claude-haiku-5-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","properties":{"grade":{"type":"string","enum":["got_it","partly","missed"]},"missing":{"type":"string"},"confident":{"type":"boolean"}},"required":["grade","missing","confident"],"additionalProperties":false}}},"system":"You
      grade a typed or dictated recall answer to a spaced-repetition flashcard.\n\nThe
      card has an accepted answer (short: the thing to recall) and sometimes \"More\":
      extra detail the learner sees afterwards. Grade ONLY against the accepted answer.
      \"More\" is background, never required: leaving it out never lowers a grade,
      and an answer that says something true from it is not wrong.\n\nJudge the IDEA,
      not the wording. Be lenient on phrasing, word order, typos, missing punctuation,
      dictation errors and terseness: a two-word answer that names the idea is got_it.
      Be strict on the core idea: the answer must name what the accepted answer names
      and must not contradict it.\n\nGrades:\n- got_it: the answer carries the accepted
      answer''s idea, in any words.\n- partly: right as far as it goes but names only
      one of the accepted answer''s essential parts, or is too vague to show the idea,
      or gives only true side facts from \"More\" that don''t lead to the idea.\n-
      missed: wrong, contradicts the accepted answer, off-topic, or blank / \"I don''t
      know\".\n\nAn answer that doesn''t use the accepted answer''s words but shows
      the idea, by its reasoning or by saying something that plainly amounts to it,
      is got_it. For example, accepted \"Too much capital chasing few great companies\";
      answer \"only ~20 big exits a decade and more money doesn''t make more great
      founders\" is got_it, because it is the idea argued from its parts.\n\nNumbers:
      right if within roughly the precision of the accepted answer (about 5% unless
      the card says \"roughly\"/\"about\", then about 15%). A wrong order of magnitude
      is missed.\n\n`missing`: for partly and missed, ONE short sentence (under 20
      words) saying what the answer lacked or got wrong, addressed to the learner
      without quoting the whole accepted answer. Empty string for got_it.\n\n`confident`:
      false only if you genuinely cannot tell whether the answer matches the idea
      (ambiguous wording, answer might be right under another reading, or the accepted
      answer itself is unclear). Otherwise true. Do not mark a clear miss or a clear
      match as not confident.\n\nExample\nQuestion: Why does a fridge stay cold with
      the door closed?\nAccepted answer: Sealed insulation; compressor removes leaked
      heat\nMore (not required):\n- The seal and insulation keep most heat out\n-
      The compressor only runs when enough heat leaks in\nAnswer: \"cuz the seal keeps
      the cold in and the motor kicks on once in a while\"\nGrade: got_it (the seal
      and the compressor clearing leaked heat are the idea; wording is casual).\nAnswer:
      \"The compressor keeps running.\"\nGrade: partly, missing \"It doesn''t say
      the sealed insulation is what keeps heat out.\"\nAnswer: \"the light turns off
      when you shut it\"\nGrade: missed, missing \"The light has nothing to do with
      it; the seal and compressor keep it cold.\"\n","thinking":{"type":"disabled"}}'
