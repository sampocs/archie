appId: com.sampocs.archie
---
# Needs real keys: the worker transcribes the episode (Groq) and calls Anthropic, a few cents per run. Run it only
# against `make start-local` with the keys in .env; there is no replay mode for the local backend yet (see maestro/README.md).
# The URL is archie_testing.media.SPOTIFY_EPISODE_URL ("Alligator in a bagel shop, ...", UPI Odd News Minute).
- runFlow: login.yaml
# Sign in again as the owner's user, so the worker pays with the owner's keys.
- openLink: archie://dev/login?whitelisted=1
- extendedWaitUntil:
    visible: "Open"
    timeout: 5000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- tapOn:
    id: "library-add"
# The first tap right after login is sometimes swallowed while the screen settles.
- runFlow:
    when:
      notVisible:
        id: "add-url"
    commands:
      - tapOn:
          id: "library-add"
- extendedWaitUntil:
    visible:
      id: "add-url"
    timeout: 5000
- tapOn:
    id: "add-url"
- inputText: "https://open.spotify.com/episode/4G2R6Ii1bIj7uLShXTqpCS"
- tapOn:
    id: "intent-queue"
- tapOn:
    id: "add-save"
# Saving lands on Library; open the source (its card shows the URL until the worker's title replaces it).
- tapOn: ".*(open.spotify.com|Alligator).*"
# One wait only (Maestro shares the timeout across consecutive waits): the header's "Processing…" goes away once
# both the summary and the primer have synced.
- extendedWaitUntil:
    notVisible: "Processing…"
    timeout: 300000
- assertVisible:
    id: "source-gist"
# A transcribed episode carries timestamps on its key ideas.
- assertVisible:
    id: "timestamp"
# Queued: "Mark as done" beside the primer button, which shows the primer's reading time.
- assertVisible:
    id: "item-finish"
- assertVisible: "◆ Primer · .* min"
