# Local Postgres (with pgvector, for later search) for development (database `archie`) and tests
# (database `archie_test`). Port 5434 keeps it clear of other local projects' Postgres.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: archie
      POSTGRES_PASSWORD: archie
      POSTGRES_DB: archie
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archie"]
      interval: 2s
      timeout: 5s
      retries: 30
