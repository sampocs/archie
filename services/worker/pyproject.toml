[project]
name = "archie-worker"
version = "0.1.0"
description = "Background worker that runs queued Archie jobs."
requires-python = ">=3.13"
dependencies = [
  "archie-shared",
  "archie-db",
]

[tool.uv.sources]
archie-shared = { workspace = true }
archie-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archie_worker"]
