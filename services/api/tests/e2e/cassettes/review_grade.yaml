      does the Fed raise rates when inflation is high?\nAccepted answer: Higher rates
      make borrowing costlier, which slows spending and cools inflation.\nAnswer:
      ''to make loans expensive so people spend less''"}],"model":"claude-haiku-5-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","properties":{"grade":{"type":"string","enum":["got_it","partly","missed"]},"missing":{"type":"string"},"confident":{"type":"boolean"}},"required":["grade","missing","confident"],"additionalProperties":false}}},"system":"You
      grade a typed or dictated recall answer to a spaced-repetition flashcard.\n\nJudge
      the IDEA, not the wording. Be lenient on phrasing, word order, typos, missing
      punctuation, dictation errors and terseness. Be strict on the core idea: the
      answer must contain the essential point(s) of the accepted answer and must not
      contradict them.\n\nGrades:\n- got_it: the answer carries the core idea of the
      accepted answer, in any words. Minor omitted detail is fine.\n- partly: the
      answer is correct as far as it goes but misses an essential part of the idea
      (for example gives what but not why, or only one of several required parts),
      or is too vague to show real understanding.\n- missed: the answer is wrong,
      contradicts the accepted answer, is off-topic, or is blank / \"I don''t know\".\n\nNumbers:
      right if within roughly the precision of the accepted answer (about 5% unless
      the card says \"roughly\"/\"about\", then about 15%). A wrong order of magnitude
      is missed.\n\n`missing`: for partly and missed, ONE short sentence (under 20
      words) saying what the answer lacked or got wrong, addressed to the learner
      without quoting the whole accepted answer. Empty string for got_it.\n\n`confident`:
      false only if you genuinely cannot tell whether the answer matches the idea
      (ambiguous wording, answer might be right under another reading, or the accepted
      answer itself is unclear). Otherwise true. Do not mark a clear miss or a clear
      match as not confident.\n\nExample\nQuestion: Why does a regular fridge stay
      cold when the door is closed?\nAccepted answer: The insulated door seal traps
      cold air, and the compressor only runs to remove the small amount of heat that
      leaks in.\nAnswer: \"cuz the seal keeps the cold in and the motor kicks on once
      in a while\"\nGrade: got_it (the seal and the intermittent compressor are the
      core idea; wording is casual).\nAnswer: \"The compressor keeps running.\"\nGrade:
      partly, missing \"It doesn''t say the insulated seal is what keeps heat out.\"\n","thinking":{"type":"disabled"}}'
