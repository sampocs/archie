        lucide-maximize2 lucide-maximize-2 icon-noB79L\"><polyline points=\"15 3 21
        3 21 9\"></polyline><polyline points=\"9 21 3 21 3 15\"></polyline><line x1=\"21\"
        x2=\"14\" y1=\"3\" y2=\"10\"></line><line x1=\"3\" x2=\"10\" y1=\"21\" y2=\"14\"></line></svg></button></div></div></div></a></figure></div><p>First,
        you trigger profiling for an application. A developer tries to detect high
        latency or increased resource usage by triggering a profiler on a live production
        server.</p><p>In the second step, the profiler outputs raw trace data or flame
        graphs. The developer downloads these details to their local machine.</p><p>Third,
        the developer spends time looking at complex, color-coded flame graphs. They
        try to spot wide stack frames that might show signs of higher-than-normal
        CPU or memory consumption.</p><p>Next, the developer goes through the codebase
        looking for cryptic method names found in the flame graph. They try to make
        sense of the surrounding application logic to figure things out.</p><p>Fifth,
        the developer traces the execution path and identifies the inefficient operation.
        They write a proposed patch to fix the operation.</p><p>Moving further, the
        developers deploy the patch to an environment where any change in performance
        levels can be measured.</p><p>At the end, when new code paths are deployed
        in production, the developer starts the manual process once again.</p><p>As
        you may have noticed, this workflow doesn\u2019t scale. Everything depends
        on a few domain experts who have a deep sense of understanding about low-level
        execution stacks. Since human attention is a scarce resource, you can investigate
        performance issues only for major incidents or obvious system slowdowns. Smaller
        but steady resource drains go unnoticed.</p><div><hr/></div><h2 class=\"header-anchor-post\"><a
