      1\\nHeadline: US midterms decide control of Congress today\\nWhat happened:
      It is Election Day. Voters will decide which party controls Congress for the
      end of President Trump's second term. Republicans hold narrow majorities now,
      and polls suggest Democrats could flip the House.\\nWhy it matters: Control
      of Congress shapes what Trump can pass and how much oversight he faces for his
      last two years.\\nDetail: Republicans currently hold the House 218\u2013214
      and the Senate 53\u201347. The president's party usually loses seats in midterms,
      and recent polls point to Democrats possibly taking the House. The Senate, with
      35 seats up, looks more like a tossup. Rising consumer prices are top of mind
      for many voters. There are also 36 governorships on the ballot. Results may
      not come tonight, since counting could be slow in close races. Courts have so
      far rejected the Trump administration's arguments about two candidates named
      Dan Sullivan in Alaska's Senate race, and its bid to set aside 20,000 California
      mail-in ballots it says were sent by noncitizens.\\n\\nStory 2\\nHeadline: Marvell
      to buy Lumentum for $115B\\nWhat happened: Chipmaker Marvell agreed to buy Lumentum,
      which makes lasers and optical hardware that move data between chips and servers.
      Marvell fell 13% and Lumentum 19% after the announcement.\\nWhy it matters:
      It shows how much money is chasing AI data center infrastructure, and how nervous
      some investors are about a bubble.\\nDetail: The deal is valued at $115 billion
      including debt. That makes it the second-most expensive tech deal ever, behind
      the SpaceX\u2013xAI merger. It is more than half of Marvell's market value.
      The purchase gives Marvell another foothold in AI infrastructure. Investors
      worry about the size of the bet and about a possible AI spending bubble.\\n\\nStory
      3\\nHeadline: Apple revenue rises, but margins shrink\\nWhat happened: In John
      Ternus's first earnings report as CEO, Apple's revenue grew 12% to $114.5 billion,
      beating expectations. The stock slipped after hours because margins are narrowing.\\nWhy
      it matters: Investors had treated Apple as a safe haven from AI turbulence in
      Big Tech.\\nDetail: Apple expects 7% to 10% revenue growth over the holiday
      season. Ternus told analysts margins are shrinking because of high memory costs
      and expenses tied to Siri AI. Apple also said it is hard to predict when iPhone
      Duo supply will catch up with demand.\\n\\nStory 4\\nHeadline: Palantir's business
      sales pass government sales for first time\\nWhat happened: Palantir reported
      Q3 revenue of $2.31 billion, nearly double last year, and beat estimates. Its
      US commercial revenue rose 148% to $984 million, passing US government revenue
      of $953 million.\\nWhy it matters: It suggests companies are adopting AI tools
      fast enough to rival government demand.\\nDetail: US government revenue, from
      clients like the Army, ICE and the IRS, rose 96%. Palantir raised its full-year
      guidance and now expects $8.53 billion in 2026 revenue. The growth came as companies
      adopted more of its AI tools.\\n\\nStory 5\\nHeadline: Hackers defrost fridges
      at European supermarkets\\nWhat happened: Hackers attacked fridges and freezers
      at dozens of supermarkets across seven European countries. Some units reached
      122\xB0F after the attackers switched them to defrost mode.\\nWhy it matters:
      It raises fears that AI-enabled hackers could hit critical infrastructure run
      on digital systems.\\nDetail: Affected countries include Belgium, Estonia, Finland,
      Ireland, Luxembourg, the Netherlands and Sweden. Belgian firm Sabcobel said
      hackers hit a digital system that remotely controls the devices. Some fridges
      need physical changes, not just software patches. Danfoss, a Danish supplier,
      said its tech was hit here and in a similar French attack last month. The Pentagon
      is investigating August hacks on military commissary fridges. Forescout counts
      over 20 attacks on refrigeration systems this year, some linked to Russia-aligned
      hackers.\"}],\"model\":\"claude-haiku-5-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"cards\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"story_index\":{\"type\":\"integer\"},\"question\":{\"type\":\"string\"},\"answer\":{\"type\":\"string\"}},\"required\":[\"story_index\",\"question\",\"answer\"],\"additionalProperties\":false}}},\"required\":[\"cards\"],\"additionalProperties\":false}}},\"system\":\"You
      write a weekly news quiz for a personal learning app: short open-recall cards
      on the week's most important news stories, so the user remembers what happened
      and why it matters.\\n\\nYou get numbered stories (headline, what happened,
      why it matters, detail). Write exactly one card per story, in the order given:
      one focused question about the core of the story (what happened, or why it matters),
      never trivia like exact dates or a minor name, and an answer of 1-2 sentences.
      Give each card the story's number as story_index.\\n\\nWrite in plain, conversational
      English for a smart reader who is new to the subject. Short sentences. Define
      any jargon the first time it appears. Prefer concrete examples and rough numbers
      (\\\"~1 GW\\\", not \\\"1.07 GW\\\").\"}"
