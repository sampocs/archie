        points=\\\"9 21 3 21 3 15\\\">\\u003c/polyline>\\u003cline x1=\\\"21\\\" x2=\\\"14\\\"
        y1=\\\"3\\\" y2=\\\"10\\\">\\u003c/line>\\u003cline x1=\\\"3\\\" x2=\\\"10\\\"
        y1=\\\"21\\\" y2=\\\"14\\\">\\u003c/line>\\u003c/svg>\\u003c/button>\\u003c/div>\\u003c/div>\\u003c/div>\\u003c/a>\\u003c/figure>\\u003c/div>\\u003cp>In
        the reactive path, your system profiles production services on a recurring
        schedule or on demand. When the agent finds a new bottleneck, it tests the
        fix on a canary instance. If everything goes fine, the patch is merged, and
        the agent documents the new finding in the Pattern Catalog.\\u003c/p>\\u003cp>In
        the proactive path, the process starts when a developer creates a new PR.
        CI tooling performs a fast regex or symbol match against the Pattern Catalog
        index. If the code in the PR matches known anti-patterns, the CI bot calls
        an LLM and provides it with the pull request diff. The LLM checks the context
        and leaves an inline comment that explains the inefficiency. It shows the
        resource impact and suggests a fix. All this happens before the code ever
        merges to the main branch.\\u003c/p>\\u003ch2>Conclusion\\u003c/h2>\\u003cp>The
        key learning from the Netflix engineering experience is that automating performance
        engineering work is not an all-or-nothing game. You can have organizations
        adopt workflows along a four-level maturity spectrum.\\u003c/p>\\u003cp>Level
        0 is the manual situation. This is the level where machine learning is not
        used. Human developers manually capture traces, interpret flame graphs, and
        trace code paths.\\u003c/p>\\u003cp>Level 1 is the assist approach. This is
        the entry point for AI adoption. The LLM acts as an analytical copilot. A
        developer initiates the profiling process. But they don\u2019t spend time
        studying flame graphs. Instead, they feed the stack dump to the model. The
        model finds the hot execution path.\\u003c/p>\\u003cp>Level 2 is the orchestration
        level. This is the current state at Netflix. A lot of proactive scanning happens.
        Also, they use the Pattern Catalog.\\u003c/p>\\u003cp>Level 3 is the fully
        autonomous level. This is the long-term vision at Netflix for performance
        agents. At Level 3, the agents will create their own optimization strategies.
        They will explore multiple alternative implementations. Or run automated benchmarks.\\u003c/p>\\u003cp>\\u003cstrong>References:\\u003c/strong>\\u003c/p>\\u003cul>\\u003cli>\\u003cp>\\u003ca
        href=\\\"https://p99conf.io/session/the-autonomous-performance-agent-a-netflix-production-story/\\\">A
        Netflix Production Story - P99 Conference\\u003c/a>\\u003c/p>\\u003c/li>\\u003c/ul>\",\"has_dynamic_content\":false,\"truncated_body_text\":\"The
