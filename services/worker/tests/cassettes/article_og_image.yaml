        lucide-maximize2 lucide-maximize-2 icon-noB79L\"><polyline points=\"15 3 21
        3 21 9\"></polyline><polyline points=\"9 21 3 21 3 15\"></polyline><line x1=\"21\"
        x2=\"14\" y1=\"3\" y2=\"10\"></line><line x1=\"3\" x2=\"10\" y1=\"21\" y2=\"14\"></line></svg></button></div></div></div></a></figure></div><p>Different
        languages have different profilers. But they use a shared language and store
        the same core information. For example, JVM\u2019s async-profiler or Java
        Flight Recorder operates at 100 Hz sampling to capture execution traces, memory
        allocation rates, and thread lock contention. Python\u2019s py-spy provides
        low-overhead, async stack sampling of live production processes. Go has pprof,
        which generates goroutine profiles, heap snapshots, and block contention data.</p><p>Each
        one of these profilers breaks down execution into call stacks. They track
        two main metrics. First, you have the inclusive time. This is the total time
        spent executing a function. It includes every child function and the subroutines
        called by this function. Second, you have the Self (CPU) Time. It\u2019s the
        time spent running code purely inside the function itself. No external calls
        are involved.</p><p>With this exercise, the Netflix engineering team came
        to the conclusion that a single analytical pipeline could understand data
        from almost any programming runtime.</p><p>Another advantage of LLMs is that
        they don\u2019t have to guess how an algorithm works from scratch. Since LLMs
        have been broadly trained on many software repositories, they are mostly familiar
        with classic programming anti-patterns. For example, they know that quadratic
        loops where a hot method is called again and again for each item in a collection
        aren\u2019t a good idea. Also, loop invariants where you compute a calculation
        for every iteration of the loop instead of making the calculation once at
        the beginning. Other patterns include excessive object allocation on hot execution
        paths and \u201CN+1\u201D query patterns.</p><p>Due to this knowledge base
        of LLMs, you don\u2019t need to ask an AI model to guess why an application
        might be performing poorly. You can build a workflow that asks the model to
        pattern-match known performance bugs against actual call stacks.</p><h2 class=\"header-anchor-post\">The
        Agentic Profiling Pipeline<div class=\"pencraft pc-display-flex pc-alignItems-center
        pc-position-absolute pc-reset header-anchor-parent\"><div class=\"pencraft
        pc-display-contents pc-reset pubTheme-yiXxQA\"><div class=\"pencraft pc-reset
        header-anchor offset-top\" id=\"\xA7the-agentic-profiling-pipeline\"></div><button
