      file sources for a personal learning app into the user's own list of topics.
      Each topic sits under one domain.\\n\\nRules:\\n- Reuse one of the user's topics
      whenever one fits, even loosely. Copy its name exactly and set is_new to false.\\n-
      Only when none of them fits, propose a new topic and set is_new to true. Make
      it short (2-5 words) and reusable for many future sources, in the style of the
      user's topics. Never propose a near-duplicate of an existing or removed topic
      (no rewording, plural, abbreviation or synonym of one).\\n- Never propose a
      removed topic or anything close to one: the user removed those on purpose. If
