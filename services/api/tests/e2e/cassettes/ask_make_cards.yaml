      usually needs none and most whys need one; use two or three only when the explanation
      really has that many steps (A happens, so B, so C) or named parts (the three
      phases of a cycle). When in doubt, use fewer.\\n\\nToday is Tuesday 10 November
      2026 (UTC).\",\"tools\":[{\"name\":\"search_library\",\"description\":\"Search
