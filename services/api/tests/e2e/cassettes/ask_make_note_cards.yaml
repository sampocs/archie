      week\\\", \\\"on Tuesday\\\"), also pass day bounds so only items from those
      days come back: saved_* for when the owner saved or got it (\\\"what did I save
      this week\\\", \\\"yesterday's newsletters\\\"), published_* for when it came
      out (\\\"articles published this year\\\"). For newsletters the two are the
      same day.\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"query\":{\"type\":\"string\",\"description\":\"What
      to look for, in a few words.\"},\"saved_after\":{\"type\":\"string\",\"format\":\"date\",\"description\":\"Only
      items the owner saved or got on or after this day. YYYY-MM-DD, in the owner's
      time zone.\"},\"saved_before\":{\"type\":\"string\",\"format\":\"date\",\"description\":\"Only
      items the owner saved or got on or before this day. YYYY-MM-DD, in the owner's
      time zone.\"},\"published_after\":{\"type\":\"string\",\"format\":\"date\",\"description\":\"Only
      items that came out on or after this day. YYYY-MM-DD, in the owner's time zone.\"},\"published_before\":{\"type\":\"string\",\"format\":\"date\",\"description\":\"Only
      items that came out on or before this day. YYYY-MM-DD, in the owner's time zone.\"}},\"required\":[\"query\"],\"additionalProperties\":false},\"strict\":true,\"eager_input_streaming\":true},{\"type\":\"web_search_20260209\",\"name\":\"web_search\",\"max_uses\":3,\"allowed_callers\":[\"direct\"]},{\"name\":\"read_item\",\"description\":\"Read
