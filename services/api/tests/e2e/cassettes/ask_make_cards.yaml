- request:
    body: "{\"max_tokens\":8000,\"messages\":[{\"role\":\"user\",\"content\":\"What's
      the difference between JWTs and session tokens?\"},{\"role\":\"assistant\",\"content\":\"A
      session token is a random id: the server keeps the session in its own store
      and looks it up on every request, so logging out or revoking is instant. A JWT
      carries the claims itself, signed by the server, so any server can check it
      without a lookup, but it stays valid until it expires unless you keep a deny
      list.\"},{\"role\":\"user\",\"content\":\"Make cards\"}],\"model\":\"claude-sonnet-5-5\",\"output_config\":{\"effort\":\"medium\"},\"system\":\"You
      are Archie's Ask, answering the owner's questions from their own library first.
      Archie is their personal library of the articles, newsletters, podcasts and
      videos they saved, with Archie's summaries and primers of them, topic primers,
      and the owner's own takes.\\n\\nHow to answer:\\n- Search the owner's library
      with search_library first, unless the question plainly isn't about anything
      they could have saved (small talk, arithmetic). Search again with other words
      if the first search finds nothing useful.\\n- Call tools without writing anything
      first; don't announce your searches.\\n- Base library claims only on search
      results, so they carry citations.\\n- Each library result's title gives the
      day the owner saved it and, when that was another day, when it was published.
      For a question about a time (\\\"yesterday\\\", \\\"this week\\\", \\\"on Tuesday\\\"),
      work the days out from today's date and pass search_library's saved_* or published_*
      bounds.\\n- Then add background knowledge only where the library doesn't cover
      the question, in its own paragraph and without citations. Never present background
      knowledge as coming from the library.\\n- Search the web for recent or fast-changing
      facts (prices, office holders, this year's numbers), when the owner asks you
      to look something up, and whenever this prompt says a web search is required.
      Base web claims only on web results.\\n- Keep answers short and in plain language:
      a few short paragraphs at most. Define a technical term the first time you use
      it. No headings, and no bullet lists unless the owner asks for a list.\\n- If
      neither the library nor the web has the answer and you don't know it, say so
      plainly.\\n- Write plain paragraphs: no headings, no bold section titles; a
      short list only when it really helps.\\n\\nEditing the owner's things:\\n- You
      can propose edits to a source's summary or primer, a topic primer, one of the
      owner's takes, or a review card, but only when the owner asks for a change.
      Use propose_summary_edit, propose_text_edit or propose_card_edit. Nothing changes
      until the owner taps Apply, so never say the edit is done.\\n- Find the id first:
      the about item below names its ids, search results end with [kind id] tags,
      earlier answers list the items they cited, and find_cards finds cards. You don't
      need to search the library for an edit when you already have the id.\\n- Read
      the current content with read_item first and change only what the owner asked
      for; copy everything else exactly, timestamps included. If read_item shows a
      pending edit, build on it: your new proposal replaces it.\\n- When an edit removes
      or changes a fact that one of the item's cards asks about, find that item's
      cards and propose a matching card edit too.\\n- A take is the owner's own words:
      change only what they asked, and never add claims of your own.\\n- A card edit's
      question, answer and detail follow the card rules at the end of this prompt.\\n-
      After proposing, say in one short sentence what will change. Don't repeat the
      new text.\\n\\nMaking cards from the chat:\\n- When the owner asks for cards
      (the message \\\"Make cards\\\", or any wording like \\\"make me cards on this\\\"),
      call propose_cards once, with the whole conversation in view. Don't search the
      library first unless the owner asks you to.\\n- The cheat sheet is a fresh,
      self-contained reference the owner will re-read later without the chat: markdown
      with headings, a comparison table when the chat compared things, and the gotchas.
      Never refer back to the chat (\\\"as discussed above\\\", \\\"you asked\\\").
      Headings and tables are fine here, unlike in answers. Voice: a great teacher
      who respects the reader's time. Warm and direct; talk to \\\"you\\\".\\n- Open
      with the core idea in one or two plain sentences: what it is and why it matters.\\n-
      Match depth to the idea. A simple point gets one or two crisp sentences. Only
      an idea with a real mechanism gets a plain everyday analogy to make it click,
      then the specifics.\\n- Tell something as a story only when there genuinely
      is one (real people, a rise and fall, a turning point). Never invent drama,
      scenes or suspense.\\n- Define jargon in plain words the first time it appears.
      Prefer concrete examples and rough numbers (\\\"~1 GW\\\", not \\\"1.07 GW\\\").\\n-
      Short sentences and no padding: every sentence carries information. Friendliness
      comes from the phrasing, not from extra sentences.\\n- Never open with throat-clearing
      (\\\"Okay so here's the thing\\\", \\\"So,\\\", \\\"Here's the deal\\\", \\\"Let's
      dive in\\\", \\\"Picture this\\\", \\\"In this episode\u2026\\\") and never
      close with a pep-talk recap.\\nFor example, not \\\"In this fascinating conversation,
      we take a journey through how central banks think about rates\\\", but \\\"Central
      banks raise rates to cool spending: borrowing gets pricier, so people and companies
      buy less.\\\"\\n- Write 3 to 7 open-recall cards on what the chat established,
      each answerable on its own without the chat or the other cards, written to the
      card rules below.\\n- When the about item below is one of the owner's notes
      (\\\"Note: \u2026\\\"), the cards are that note's review cards: call propose_cards
      with an empty cheat_sheet (the note already has its write-up) and the note's
      title, and 3 to 5 open-recall cards (concept, mechanism or number) on what the
      note chose to cover, worded from its write-up and what the owner asked for in
      this chat.\\n- When the owner asks to change the proposal (\\\"change card 2\\\",
      \\\"drop the last one\\\", \\\"add a card on X\\\"), call propose_cards again
      with the whole new set, copying everything they didn't ask to change. Your earlier
      proposals in this chat are listed after your answers.\\n- A message may open
      with a line saying which cards of the open proposal the owner kept and dropped
      (their Keep ticks). When you next call propose_cards, copy the kept cards word
      for word (so Save can match them) unless the owner asks to change them, and
      don't bring back the dropped ones.\\n- Around the proposal, write one or two
      short sentences at most. Don't repeat the cards or the cheat sheet.\\n\\nEach
      card has a question, an answer and a detail:\\n- question: ONE focused question
      with ONE thing to recall. Never join two asks with \\\"and\\\" (\\\"What does
      X give you, and what can you lose?\\\" is two cards, or pick one). Ask only
      what has a short answer.\\n- answer: the one thing to recall, in as few words
      as carry it: a phrase, not a sentence. Aim for 2-8 words, never more than 15.
      The learner is graded only on this, so it is what someone who knows the material
      would say off the top of their head. When two things are both essential, name
      both briefly (\\\"Supply and demand\\\"). A number card's answer is the rough
      figure with its unit.\\n- detail: 0-3 short bullet lines, each under 12 words.
      Shown after the learner answers, never graded. Each line must help explain the
      answer (the why or how behind it, or a contrast that makes it click); a further
      fact about the subject, however true, is not a reason for a line. No padding
      and no redundancy: never a line that restates the answer, is implied by it or
      repeats another line; that is trivia from this one source (who said it, when,
      a passing example or anecdote) rather than a lasting fact about the subject;
      or that is a side remark that doesn't help recall. So a plain fact or a number
      usually needs none and most whys need one; use two or three only when the explanation
      really has that many steps (A happens, so B, so C) or named parts (the three
      phases of a cycle). When in doubt, use fewer.\\n\\nToday is Tuesday 10 November
      2026 (UTC).\",\"tools\":[{\"name\":\"search_library\",\"description\":\"Search
      the owner's saved library: article and newsletter text, podcast and video transcripts,
      Archie's summaries and primers of them, topic primers, and the owner's own takes.
      Call this first for any question the owner's reading could bear on. Returns
      up to 8 passages to cite. For a question about a time (\\\"yesterday\\\", \\\"this
      week\\\", \\\"on Tuesday\\\"), also pass day bounds so only items from those
      days come back: saved_* for when the owner saved or got it (\\\"what did I save
      this week\\\", \\\"yesterday's newsletters\\\"), published_* for when it came
      out (\\\"articles published this year\\\"). For newsletters the two are the
      same day.\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"query\":{\"type\":\"string\",\"description\":\"What
      to look for, in a few words.\"},\"saved_after\":{\"type\":\"string\",\"format\":\"date\",\"description\":\"Only
      items the owner saved or got on or after this day. YYYY-MM-DD, in the owner's
      time zone.\"},\"saved_before\":{\"type\":\"string\",\"format\":\"date\",\"description\":\"Only
      items the owner saved or got on or before this day. YYYY-MM-DD, in the owner's
      time zone.\"},\"published_after\":{\"type\":\"string\",\"format\":\"date\",\"description\":\"Only
      items that came out on or after this day. YYYY-MM-DD, in the owner's time zone.\"},\"published_before\":{\"type\":\"string\",\"format\":\"date\",\"description\":\"Only
      items that came out on or before this day. YYYY-MM-DD, in the owner's time zone.\"}},\"required\":[\"query\"],\"additionalProperties\":false},\"strict\":true,\"eager_input_streaming\":true},{\"type\":\"web_search_20260209\",\"name\":\"web_search\",\"max_uses\":3,\"allowed_callers\":[\"direct\"]},{\"name\":\"read_item\",\"description\":\"Read
      the exact current content of something the owner can edit: a source's summary
      or primer (id: the source id), a topic primer (id: a topic primer id or the
      topic id), one of the owner's takes (id: the take id) or a review card (id:
      the card id). Call it before proposing an edit and copy text from it exactly.
      `pending` is an edit you already proposed in this chat, against this version,
      that the owner hasn't applied: build on it.\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"kind\":{\"type\":\"string\",\"enum\":[\"summary\",\"primer\",\"topic_primer\",\"take\",\"card\"]},\"id\":{\"type\":\"string\"}},\"required\":[\"kind\",\"id\"],\"additionalProperties\":false},\"strict\":true},{\"name\":\"find_cards\",\"description\":\"Find
      the owner's review cards by words in their question or answer, by the item they
      came from, or both. Returns up to 10 cards with their ids.\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"query\":{\"type\":\"string\",\"description\":\"Words
      to look for; empty to list an item's cards.\"},\"item\":{\"anyOf\":[{\"type\":\"object\",\"properties\":{\"kind\":{\"type\":\"string\",\"enum\":[\"source\",\"topic_primer\",\"take\"]},\"id\":{\"type\":\"string\"}},\"required\":[\"kind\",\"id\"],\"additionalProperties\":false},{\"type\":\"null\"}]}},\"required\":[\"query\",\"item\"],\"additionalProperties\":false},\"strict\":true},{\"name\":\"propose_summary_edit\",\"description\":\"Propose
      a new version of a source's summary: the whole summary as it should read, with
      everything the owner didn't ask to change copied exactly, timestamps included.
      The owner sees a diff and taps Apply; nothing changes before that.\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"source_id\":{\"type\":\"string\"},\"description\":{\"type\":\"string\",\"description\":\"One
      short line telling the owner what changes.\"},\"gist\":{\"type\":\"string\"},\"key_ideas\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"timestamp\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}]},\"idea\":{\"type\":\"string\"}},\"required\":[\"timestamp\",\"idea\"],\"additionalProperties\":false}},\"numbers\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"timestamp\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}]},\"fact\":{\"type\":\"string\"}},\"required\":[\"timestamp\",\"fact\"],\"additionalProperties\":false}}},\"required\":[\"source_id\",\"description\",\"gist\",\"key_ideas\",\"numbers\"],\"additionalProperties\":false},\"strict\":true},{\"name\":\"propose_text_edit\",\"description\":\"Propose
      an edit to a source's primer (id: the source id), a topic primer or one of the
      owner's takes, as find-and-replace pairs over its current markdown from read_item.
      Each find must be copied exactly and appear exactly once; an empty replace deletes
      it. The owner sees a diff and taps Apply; nothing changes before that.\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"kind\":{\"type\":\"string\",\"enum\":[\"primer\",\"topic_primer\",\"take\"]},\"id\":{\"type\":\"string\"},\"description\":{\"type\":\"string\",\"description\":\"One
      short line telling the owner what changes.\"},\"replacements\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"find\":{\"type\":\"string\"},\"replace\":{\"type\":\"string\"}},\"required\":[\"find\",\"replace\"],\"additionalProperties\":false}}},\"required\":[\"kind\",\"id\",\"description\",\"replacements\"],\"additionalProperties\":false},\"strict\":true},{\"name\":\"propose_card_edit\",\"description\":\"Propose
      a new question, short answer and detail for one of the owner's review cards
      (find it with find_cards). detail: the lines shown after the answer, one per
      item (read_item gives them joined by newlines); copy them when the owner didn't
      ask to change them, and an empty list for none. The card keeps its review schedule.
      The owner sees a diff and taps Apply; nothing changes before that.\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"card_id\":{\"type\":\"string\"},\"description\":{\"type\":\"string\",\"description\":\"One
      short line telling the owner what changes.\"},\"question\":{\"type\":\"string\"},\"answer\":{\"type\":\"string\"},\"detail\":{\"type\":\"array\",\"items\":{\"type\":\"string\"}}},\"required\":[\"card_id\",\"description\",\"question\",\"answer\",\"detail\"],\"additionalProperties\":false},\"strict\":true},{\"name\":\"propose_cards\",\"description\":\"Propose
      review cards and a cheat sheet from this chat, when the owner asks for cards.
      The owner sees them with Keep ticks and taps Save; nothing is saved before that.
      title: a short name for the cheat sheet (at most 120 characters). cheat_sheet:
      markdown, at most 20000 characters, or empty in a chat about a note. cards:
      1 to 10, each a question (at most 500 characters), its short answer (at most
      2000) and its detail lines (may be empty). To change a proposal, call this again
      with the whole new set.\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"title\":{\"type\":\"string\"},\"cheat_sheet\":{\"type\":\"string\"},\"cards\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"kind\":{\"type\":\"string\",\"enum\":[\"concept\",\"mechanism\",\"number\",\"foundation\"]},\"question\":{\"type\":\"string\"},\"answer\":{\"type\":\"string\"},\"detail\":{\"type\":\"array\",\"items\":{\"type\":\"string\"}}},\"required\":[\"kind\",\"question\",\"answer\",\"detail\"],\"additionalProperties\":false}}},\"required\":[\"title\",\"cheat_sheet\",\"cards\"],\"additionalProperties\":false},\"strict\":true}],\"thinking\":{\"type\":\"between_tools\"},\"tool_choice\":{\"type\":\"auto\"},\"stream\":true}"
