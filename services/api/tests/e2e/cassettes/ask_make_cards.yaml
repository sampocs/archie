      cards"},{"role":"assistant","content":[{"id":"toolu_01JjysTki9Lpu1SBNrzcfmg1","caller":{"type":"direct"},"input":{"title":"JWTs
      vs session tokens","cheat_sheet":"# JWTs vs session tokens\n\n## The core difference\n-
      **Session token**: a random, meaningless id. The server stores the session data
      (user, permissions, expiry) and looks it up on every request. This is called
      *stateful* auth.\n- **JWT (JSON Web Token)**: a signed bundle of claims (user
      id, roles, expiry) that the client holds. The server checks the signature instead
      of looking anything up. This is called *stateless* auth.\n\n## Comparison\n\n|
      | Session token | JWT |\n|---|---|---|\n| Where data lives | Server-side store
      (database, Redis) | Inside the token itself |\n| Per-request check | Lookup
      in the store | Verify the signature |\n| Revoking / logging out | Instant: delete
      the session | Hard: valid until it expires unless you keep a deny list |\n|
      Scaling across servers | Needs a shared session store | Any server with the
      key can verify |\n| Token size | Small | Larger (carries claims) |\n\n## Gotchas\n-
      A JWT is signed, not encrypted by default. Anyone can read its contents, so
      don''t put secrets in it.\n- Because JWTs can''t be easily revoked, they are
      usually given short lifetimes (minutes) and paired with a refresh token.\n-
      Adding a deny list to a JWT system brings back a server-side lookup, which erodes
      the \"stateless\" benefit.\n- Session tokens trade a lookup on every request
      for easy control over who is logged in.\n","cards":[{"kind":"concept","question":"What
