        WarpBuild free&quot;,&quot;action&quot;:null,&quot;class&quot;:null}\" data-component-name=\"ButtonCreateButton\"><a
        class=\"button primary\" href=\"https://go.bytebytego.com/warpbuild_110326\"><span>Try
        WarpBuild free</span></a></p><div><hr/></div><h2 class=\"header-anchor-post\">The
        Problem with AI Code<div class=\"pencraft pc-display-flex pc-alignItems-center
        pc-position-absolute pc-reset header-anchor-parent\"><div class=\"pencraft
        pc-display-contents pc-reset pubTheme-yiXxQA\"><div class=\"pencraft pc-reset
        header-anchor offset-top\" id=\"\xA7the-problem-with-ai-code\"></div><button
        class=\"pencraft pc-reset pencraft iconButton-mq_Et5 iconButtonBase-dJGHgN
        buttonBase-GK1x3M buttonStyle-r7yGCK size_sm-G3LciD priority_secondary-S63h9o\"
        tabindex=\"0\" type=\"button\" data-href=\"https://blog.bytebytego.com/i/222755655/the-problem-with-ai-code\"><svg
        xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0
        0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"
        stroke-linejoin=\"round\" class=\"lucide lucide-link\"><path d=\"M10 13a5
        5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"></path><path d=\"M14
        11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"></path></svg></button></div></div></h2><p>The
        use of AI coding assistants has increased performance problems. There are
        two main reasons for this. The speed trap and the context gap.</p><p>Developers
        who are using AI tools can generate and ship code up to 10 times faster than
        before. No matter their skill level or knowledge of the system. But you cannot
        guarantee that code that is fast to generate also performs well. While your
        average developer might be able to write 10K lines of code in a few minutes,
        the team might have to spend years debugging regressions. Or dealing with
        code bloat. Or handling other architecture-related problems.</p><p>Also, if
        you\u2019ve noticed, LLMs are great at syntax and local-level logic. If you
        ask an LLM to write a function or an API endpoint, it writes code that compiles
        successfully and runs without any obvious errors. It might also pass standard
        unit tests. However, the LLM has no idea about the host platform\u2019s runtime
        environment.</p><p>For example, you can\u2019t expect the LLM to know that
        a particular utility function being used in your code might run 10 million
        times per second on a critical request path. It cannot see the overall call
        stack. Neither can it understand memory allocation challenges that might exist
        inside a container running at peak load within your platform. Therefore, the
        code you write might appear good enough in isolation. But it can still waste
        a huge amount of resources when you run it at scale.</p><h2 class=\"header-anchor-post\">Can
        LLMs Handle Profile Data<div class=\"pencraft pc-display-flex pc-alignItems-center
        pc-position-absolute pc-reset header-anchor-parent\"><div class=\"pencraft
        pc-display-contents pc-reset pubTheme-yiXxQA\"><div class=\"pencraft pc-reset
        header-anchor offset-top\" id=\"\xA7can-llms-handle-profile-data\"></div><button
        class=\"pencraft pc-reset pencraft iconButton-mq_Et5 iconButtonBase-dJGHgN
        buttonBase-GK1x3M buttonStyle-r7yGCK size_sm-G3LciD priority_secondary-S63h9o\"
        tabindex=\"0\" type=\"button\" data-href=\"https://blog.bytebytego.com/i/222755655/can-llms-handle-profile-data\"><svg
        xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0
        0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"
        stroke-linejoin=\"round\" class=\"lucide lucide-link\"><path d=\"M10 13a5
        5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"></path><path d=\"M14
        11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"></path></svg></button></div></div></h2><p>Netflix
        wanted to test whether automation could remove these issues. They set up an
        experiment to find out if an LLM can read and make sense of raw profiling
        data directly.</p><div class=\"captioned-image-container\"><figure><a class=\"image-link
        image2 is-viewable-img can-restack\" target=\"_blank\" href=\"https://substackcdn.com/image/fetch/$s_!Jm17!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe791ea9f-247d-4cc5-bc29-5f800a035695_3292x2012.png\"
