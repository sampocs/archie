[project]
name = "archie-api"
version = "0.1.0"
description = "The HTTP API the Archie phone app syncs with."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "archie-shared",
  "archie-db",
  "archie-llm",
  "pyjwt[crypto]>=2.15.1",
  "trafilatura>=2.3.1",
  "lxml>=6.0",
  "python-multipart>=0.0.20",
  "anyio>=4",
  # zoneinfo's data on images without /usr/share/zoneinfo (Ask reads the phone's time zone).
  "tzdata>=2025.1",
]

[project.scripts]
archie-launch = "archie_api.launch:main"

[tool.uv.sources]
archie-shared = { workspace = true }
archie-db = { workspace = true }
archie-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archie_api"]
