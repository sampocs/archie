      kind: article\\nTitle: How to Do Great Work\\nAnalysis hints: domain Other,
      topic Doing great work, tags careers, ambition, curiosity, creativity\\n\\nGist:
      Paul Graham distills what people who did great work in many fields have in common:
      pick work you have both aptitude for and deep interest in, follow your curiosity
      to the frontier of a field, notice the gaps others overlook, and keep working
      on it steadily for years.\\nKey ideas:\\n- Choose work you have a natural aptitude
      for and a deep interest in; if unsure, guess and start.\\n- Learn enough to
      reach the frontier of a field, then look for gaps: things that seem odd, missing
      or wrong to you but that others take for granted.\\n- Consistent effort compounds:
      working a few hours a day on something you care about beats occasional heroic
      bursts, and curiosity is the engine that keeps it going.\\n\\nThe user's topics
      (domain \u203A name):\\n- Sports \u203A NFL play schemes\\n- Sports \u203A Quarterbacks\\n\\nRemoved
      topics (never propose these or anything close):\\n- Careers & doing great work\\n-
      Founder lessons\"}],\"model\":\"claude-haiku-5-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"domain\":{\"type\":\"string\",\"enum\":[\"Macro\",\"Finance\",\"Trading\",\"Crypto\",\"Startups\",\"AI\",\"Politics\",\"Geopolitics\",\"Sports\",\"Geography\",\"History\",\"Software
