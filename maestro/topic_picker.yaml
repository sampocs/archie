# The topic picker: a fresh user (no seeded topics) picks starter topics, adds their own, and lands in the app.
appId: com.sampocs.archie
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: apple-sign-in
    timeout: 30000
- openLink: archie://dev/login?picker=1&sub=picker-user
# iOS asks to confirm opening a custom-scheme link.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: pick-macro-inflation
    timeout: 30000
- assertVisible: "Continue · 0"
- tapOn:
    id: pick-macro-inflation
- scrollUntilVisible:
    element:
      id: pick-crypto-bitcoin
- tapOn:
    id: pick-crypto-bitcoin
- scrollUntilVisible:
    element:
      id: pick-add-ai
- tapOn:
    id: pick-add-ai
- tapOn:
    id: pick-add-ai-input
- inputText: "Robotics"
- tapOn:
    id: pick-add-ai-save
- tapOn:
    id: picker-continue
- extendedWaitUntil:
    visible:
      id: tab-library
    timeout: 15000
- tapOn:
    id: tab-library
- tapOn:
    id: library-mode-domains
- assertVisible:
    id: topic-chip-robotics
