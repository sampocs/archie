      Make cards\nAbout: Derivatives\nCard sets proposed:\n- Perps vs options\n\n<answer>\nA
      perpetual future (a perp) is a futures contract with no expiry: traders keep
      a leveraged long or short position open as long as they like, and a funding
      rate paid between longs and shorts every few hours keeps its price close to
      the spot price. An option instead gives its buyer the right, but not the obligation,
      to buy (a call) or sell (a put) at a strike price before it expires; the buyer
      pays a premium up front and can lose no more than that, while the seller takes
      on the risk. Here is a card set on how perps and options differ.\n</answer>"}],"model":"claude-haiku-5-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","properties":{"name":{"type":"string"}},"required":["name"],"additionalProperties":false}}},"system":"You
