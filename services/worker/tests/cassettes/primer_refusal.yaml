      string: "{\"model\":\"claude-opus-5-5\",\"id\":\"msg_011CggtXd99yZFHWQ7eag5Yu\",\"type\":\"message\",\"role\":\"assistant\",\"content\":[{\"type\":\"thinking\",\"thinking\":\"\",\"signature\":\"\"\
        },{\"type\":\"text\",\"text\":\"# Before You Read: A Primer on \\\"How to Do Great Work\\\"\\n\\n## Who's writing this?\\n\\nPaul Graham is a programmer, essayist, and investor. He's best known for co-founding **Y Combinator** (often just \\\"YC\\\") in 2005. YC is a *startup accelerator*: a program that gives very young companies a small amount of money (historically tens of thousands of dollars to start, more now) plus a few months of intense advice. In exchange, it takes a small ownership stake. Companies like Airbnb, Dropbox, Stripe, and Reddit went through it.\\n\\nBefore YC, Graham co-founded an early web-store company called Viaweb in the mid-1990s. Yahoo bought it in 1998 for roughly $50 million. He also has a PhD in computer science from Harvard and studied painting. That mix of art, programming, and business shows up all over his writing. He'll compare a painter to a physicist to a startup founder without blinking.\\n\\nSo when he talks about \\\"great work,\\\" he isn't\
        \ writing as a career coach. He's someone who has spent decades watching thousands of ambitious young people try to build things, and who reads a lot of biographies of scientists and artists.\\n\\n## The \\\"Paul Graham essay\\\" format\\n\\nGraham has published 200+ essays on his personal website since around 2001. They have a recognizable style:\\n\\n- **Plain, short sentences.** He avoids academic language on purpose.\\n- **Bold, general claims**, often stated flatly, then explored.\\n- **Numbered footnotes** like `[1]`, `[2]`. These point to notes at the bottom of the original page. There he adds caveats, examples, or side thoughts. In the excerpt you'll see the markers but not the notes themselves.\\n- **A tech-world audience.** His core readers are programmers, founders, and students who want to be founders. Many are in their teens or twenties.\\n\\nThis essay, from July 2023, is unusually long for him. It's closer to a small book than a typical blog post.\\n\\n## A few ideas\
        \ he borrows from math and science\\n\\nGraham likes to lift precise terms from technical fields and use them as metaphors. Knowing the original meaning helps.\\n\\n### Intersection\\n\\nIn math, the **intersection** of two or more sets is the stuff they all have in common. If one list has {apples, bananas, cherries} and another has {bananas, cherries, dates}, the intersection is {bananas, cherries}. When Graham talks about \\\"the intersection\\\" of advice from many fields, he means the advice that shows up *everywhere*, not just in one field.\\n\\n### Fractals\\n\\nA **fractal** is a shape that keeps showing new detail the closer you zoom in. A coastline is the classic example. From a plane it looks like a smooth curve. Up close it's full of coves, which are full of rocks, which have their own jagged edges. A fern leaf is made of little fern-shaped leaflets, which are made of smaller ones. Keep this picture in mind when he talks about \\\"edges\\\" of knowledge and \\\"buds.\\\
        \"\\n\\n### The frontier of knowledge\\n\\nThis is a common phrase in research. Picture everything humanity knows about a subject as a filled-in region. The **frontier** is its outer edge: the point where known answers stop and open questions begin. Getting to the frontier usually takes years of study. A PhD student, for instance, spends their first few years just catching up to it.\\n\\n### Activation energy\\n\\nThis comes from chemistry. Many reactions won't happen on their own even if they'd release energy once going. A match won't light by itself. You have to strike it first. That initial push is the **activation energy**. It's often bigger than the energy needed to keep the reaction running.\\n\\n### Invariants\\n\\nIn math and programming, an **invariant** is a condition that stays true no matter what else changes. For example, a program might guarantee that \\\"this list is always sorted,\\\" even as items are added and removed. Programmers often think about which invariants\
        \ to protect rather than scripting every step.\\n\\n### Diminishing returns\\n\\nAn economics idea. The first few units of effort give you a lot. Each extra unit gives you less. Your first hour of studying for an exam helps a ton. Your fourteenth straight hour, much less.\\n\\n## Sailing: \\\"upwind\\\" and other terms\\n\\nGraham uses some sailing language. A sailboat can't sail directly into the wind, but it can zigzag toward it. Being **upwind** means being on the side the wind is coming from. From upwind, you can easily sail downwind to almost anywhere. From downwind, getting back upwind is slow and hard. So \\\"upwind\\\" positions are valuable because they keep your future options open.\\n\\nA **headwind** blows against you. **Shoals** are shallow spots hidden under the water that can ground a boat.\\n\\n## Natural selection as an example\\n\\nGraham mentions \\\"discovering natural selection.\\\" This refers to Charles Darwin (and, independently, Alfred Russel Wallace), who\
        \ in the mid-1800s worked out how species change over time. Living things vary. Those whose traits suit their environment survive and reproduce more. Over many generations, populations change.\\n\\nDarwin didn't set out as a boy to discover this. He was a somewhat aimless student, then took a five-year voyage on the ship HMS *Beagle* (1831\u20131836) as a naturalist. He spent the next two decades collecting evidence before publishing *On the Origin of Species* in 1859. Keep that winding path in mind when Graham contrasts it with goals like an Olympic gold medal, which you can name and train for from childhood.\\n\\n## School systems that make you choose early\\n\\nGraham criticizes education for forcing early choices. Some context:\\n\\n- In the **UK**, students typically narrow to about three subjects (A-levels) around age 16. Then they apply to university for one specific subject.\\n- In many European and Asian countries, students are sorted into tracks (academic, technical, vocational)\
        \ as young as 10\u201315.\\n- In the **US**, students usually declare a college \\\"major\\\" around age 19\u201320. That's later, but the path to fields like medicine or engineering still requires committing to prerequisite courses early.\\n\\nThe idea of a \\\"track\\\" is literal. It's like a train rail laid down ahead of you, and switching can be costly.\\n\\n## The kind of reader he's imagining\\n\\nGraham states his assumption up front: the reader is **very ambitious**. He means someone who wants to make a real discovery, create a major work of art, or build something important. He isn't aiming at someone who wants a stable, decent career.\\n\\nHe also mostly writes for the **young**: teenagers and people in their twenties who haven't picked their life's work yet. The examples reflect this: Lego at 7, teaching yourself calculus at 14, physics at 21.\\n\\n## A few loaded phrases\\n\\n- **\\\"Outlier ideas\\\"**: ideas far from the mainstream. In statistics an *outlier* is a\
        \ data point far from the rest.\\n- **\\\"Eminent frauds\\\"**: famous, respected people whose reputations outrun their actual substance.\\n- **\\\"Pretentiousness\\\"** and **\\\"fashion\\\"**: chasing what seems impressive or trendy rather than what's actually good.\\n- **\\\"Procrastination\\\"**: putting things off. Graham will split this into two kinds, so read that part closely.\\n- **\\\"Taste\\\"**: Graham uses this a lot, in the art-world sense. It means your instinctive sense of what's good, interesting, or worth doing.\\n\\n## How to read it\\n\\nThe essay is built as a \\\"recipe.\\\" It moves roughly from choosing what to work on, to how to actually do the work day to day. It's dense with short claims, each of which could be its own essay. Don't rush. Many lines are compressed versions of ideas Graham has written about at length elsewhere.\\n\\nA good question to carry with you: does each piece of advice really apply equally to a painter, a mathematician, and a startup\
        \ founder? That's the bet the whole essay is making.\"}],\"container\":null,\"stop_reason\":\"end_turn\",\"stop_sequence\":null,\"stop_details\":null,\"usage\":{\"input_tokens\":4446,\"cache_creation_input_tokens\":0,\"cache_read_input_tokens\":0,\"cache_creation\":{\"ephemeral_5m_input_tokens\":0,\"ephemeral_1h_input_tokens\":0},\"output_tokens\":2758,\"output_tokens_details\":{\"thinking_tokens\":269},\"service_tier\":\"standard\",\"inference_geo\":\"global\",\"speed\":\"standard\"},\"diagnostics\":null}"
