appId: com.sampocs.archie
---
# Run after run_notes.sh has imported the two fixture notes and seeded their write-ups. Spends nothing on models: the chat
# with its card set is seeded by the script.
# Relaunch (keeping the login) so the app syncs on start and pulls what the runner just seeded.
- launchApp
- tapOn:
    id: "tab-today"
# The refresher arrives with the next sync, which can take a few seconds.
- extendedWaitUntil:
    visible:
      id: "today-refresher"
    timeout: 30000
- assertVisible:
    id: "today-refresher-detail"
    text: "(?i)1 of 2 today"
- assertVisible: ".*Liquid Staking.*"
- tapOn:
    id: "today-refresher-note"
- assertVisible: "Notes · Crypto"
- assertVisible: ".*Liquid staking lets you stake.*"
# The original note opens in a sheet showing the rendered markdown, not its source.
- tapOn:
    id: "item-original-note"
- assertVisible:
    id: "original-note-sheet"
- assertVisible: "Your original note"
- assertVisible: "Overview"
- assertNotVisible: "## Overview"
# Drag the sheet down to close it.
- swipe:
    start: "50%, 30%"
    end: "50%, 90%"
- assertNotVisible:
    id: "original-note-sheet"
# Both footer buttons show. Make cards is asserted, not tapped, while online: it would open a chat that asks a model.
- assertVisible:
    id: "note-done"
    text: "Done"
- assertVisible:
    id: "note-make-cards"
    text: "Make cards"
- assertNotVisible:
    id: "note-offline"
# The seeded chat about the note shows its card set without a cheat sheet; Save puts the cards on the note.
- tapOn:
    id: "screen-back"
- tapOn:
    id: "tab-ask"
- tapOn:
    id: "ask-history"
- extendedWaitUntil:
    visible:
      id: "ask-row-.*"
    timeout: 30000
- tapOn:
    id: "ask-row-.*"
- scrollUntilVisible:
    element:
      id: "card-set-save"
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertNotVisible:
    id: "card-set-cheat-sheet"
# The About chip opens the note beside the chat, and Done closes it.
- tapOn:
    id: "chat-about"
- assertVisible:
    id: "item-sheet"
- tapOn:
    id: "item-sheet-done"
- assertNotVisible:
    id: "item-sheet"
- tapOn:
    id: "card-set-save"
- extendedWaitUntil:
    visible: "Added to review"
    timeout: 10000
- assertVisible: ".*Saved · \\d+ cards? in review.*"
# Open goes to the note, which holds the kept cards.
- tapOn:
    id: "card-set-open"
- extendedWaitUntil:
    visible:
      id: "item-title"
      text: "Liquid Staking"
    timeout: 15000
# Offline (the dev link forces it; the simulator never is), Make cards waits: its label changes and a note says why.
- openLink: archie://dev/offline?on=1
- extendedWaitUntil:
    visible: "Open"
    timeout: 5000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "note-offline"
      text: "Offline · cards will wait on Today until you're back"
    timeout: 10000
- assertVisible:
    id: "note-make-cards"
    text: "Make cards later"
- tapOn:
    id: "note-make-cards"
- extendedWaitUntil:
    visible:
      id: "toast"
      text: "Cards saved for later"
    timeout: 10000
# Back online (the override also resets on a relaunch), Today's banner offers to finish the waiting note.
- openLink: archie://dev/offline?on=0
- extendedWaitUntil:
    visible: "Open"
    timeout: 5000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- launchApp
- tapOn:
    id: "tab-today"
- extendedWaitUntil:
    visible:
      id: "today-cards-waiting"
      text: "Cards waiting for Liquid Staking.*"
    timeout: 15000
- tapOn:
    id: "today-cards-waiting"
# The chat about the note opened, with Make cards as its first message. Its model answer isn't awaited.
- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 15000
- assertVisible: "Make cards"
# Tapping the banner took the note off the waiting list at once, so it doesn't come back.
- launchApp
- tapOn:
    id: "tab-today"
- extendedWaitUntil:
    visible:
      id: "today-refresher"
    timeout: 15000
- assertNotVisible:
    id: "today-cards-waiting"
# Plain Done on the second note makes no cards and says so.
- tapOn:
    id: "today-refresher-note"
- tapOn:
    id: "note-done"
- extendedWaitUntil:
    visible:
      id: "toast"
      text: "Note done"
    timeout: 10000
