[project]
name = "archie-shared"
version = "0.1.0"
description = "Config, logging, money, URL, domain/topic and podcast-feed helpers shared by every Archie service."
requires-python = ">=3.13"
dependencies = [
  "defusedxml>=0.7.1",
  "httpx>=0.28.1",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archie_shared"]
