appId: com.sampocs.archie
---
# Free to run: the dev test user isn't whitelisted, so the source fails at analyze but keeps its fetched title.
# Local search finds it by title and shows the empty state for a query nothing matches.
- runFlow: login.yaml
- tapOn:
    id: "library-add"
# The first tap right after login is sometimes swallowed while the screen settles.
- runFlow:
    when:
      notVisible:
        id: "add-url"
    commands:
      - tapOn:
          id: "library-add"
- extendedWaitUntil:
    visible:
      id: "add-url"
    timeout: 5000
- tapOn:
    id: "add-url"
- inputText: "https://paulgraham.com/hwh.html"
- tapOn:
    id: "intent-queue"
- tapOn:
    id: "add-save"
# Saving lands on Library; the worker's title replaces the URL. (example.com no longer yields readable text, so its title never arrives.)
- extendedWaitUntil:
    visible: ".*How to Work Hard.*"
    timeout: 60000
- tapOn:
    id: "library-search"
- inputText: "work hard"
- assertVisible: ".*How to Work Hard.*"
- eraseText
- inputText: "zzqx nothing"
- assertVisible:
    id: "library-search-empty"
