      \u2615 Putting it to a vote\\n\\n<email>\\n[1] November 03, 2026 \xB7 View Online
      | Sign Up | Shop\\n\\n[2] **Good morning and welcome home to Karl Bushby.**
      The UK native finally made it back to his mother\u2019s house in England yesterday,
      after completing a 28-year, 31,000-mile walk home from Punta Arenas, Chile.
      Bushby\u2019s long walk, which started on Nov. 1, 1998, spanned four continents
      and 30 countries and included swimming across the English Channel. Upon arrival,
      his mother asked him, \u201CWhere have you been?\u201D This is a good story
      to tell your own mom when she asks why you haven\u2019t bought your ticket home
      for the holidays yet.\\n\\n[3] *\u2014Abby Rubenstein, Sam Klebanov, Dave Lozo,
      Molly Liebergall, Matty Merritt, Neal Freyman*\\n\\n[4] **In today\u2019s newsletter,**
      we\u2019ll get into:\\n\\n[5] Markets\\n\\n[6] Nasdaq \xB7 25,164.32 \xB7 -1.07%\\n\\n[7]
      S&P \xB7 7,541.4 \xB7 -0.51%\\n\\n[8] Dow \xB7 51,983.98 \xB7 +0.41%\\n\\n[9]
      10-Year \xB7 4.894% \xB7 -4.0 bps\\n\\n[10] Bitcoin \xB7 $76,829.45 \xB7 -1.13%\\n\\n[11]
      Sherwin-Williams \xB7 $352.37 \xB7 +5.94%\\n\\n[12] \\\\*Stock data as of market
      close, cryptocurrency data as of 5:30pm ET. Here's what these numbers mean.\\n\\n[13]
      Don\u2019t forget to vote\\n\\n[14] What you need to know about the midterms\\n\\n[15]
      *Brandon Bell/Getty Images*\\n\\n[16] Today is the day you get to do something
      even more American than dipping your pizza into ranch dressing: vote. It\u2019s
      Election Day, and today\u2019s midterm contests will determine which party controls
      Congress, shaping the end of President Trump\u2019s second term.\\n\\n[17] **Mission
      control:** Currently, Republicans control both chambers of Congress\u2014but
      only by narrow margins, with a 218\u2013214 majority in the House and a 53\u201347
      advantage in the Senate. Typically, the president\u2019s party loses seats in
      the midterms, and recent polls suggest Democrats might flip the House. The Senate,
      where 35 seats are up for election, appears to be more of a tossup.\\n\\n[18]
      **It\u2019s the economy, stupid.** That adage, which emerged from Bill Clinton\u2019s
      presidential campaign, is looking especially true today, with rising consumer
      prices top of mind for many voters.\\n\\n[19] Control of Congress may inspire
      the most shouting from pundits, but there are also 36 governorships up for grabs.
      Plus, local issues including:\\n\\n[20] **Looking ahead\u2026**while political
      ad season has mercifully come to a close, we may not get all the answers tonight.
      Vote counting could take longer in some close races. There could also be legal
      challenges: Courts have so far rejected the Trump administration\u2019s arguments
      over there being two candidates named Dan Sullivan in Alaska\u2019s Senate race
      and its efforts to set aside 20,000 California mail-in ballots it claims were
      sent by noncitizens.*\u2014AR*\\n\\n[21] *Need to know where to go? You can
      find your polling place here.*\\n\\n[22] Sponsored By SmarterAuto\\n\\n[23]
      **Is your car insurance getting\u2026expensive?**\\n\\n[24] When was the last
      time you reviewed your auto insurance coverage? Auto insurance needs change
      over time, as do vehicle values, driving habits, and carrier policy options.\\n\\n[25]
      If you\u2019ve had the same policy for a while, taking a few minutes to explore
      what else is available in your area could reveal significant opportunities to
      adjust your monthly budget. In fact, drivers who take the time to compare top
      options could save up to $600 per year when they switch to a policy that better
      fits their current situation.\\n\\n[26] You don\u2019t need to spend hours navigating
      complicated paperwork to check your options. Using a quick online tool, you
      can easily compare top insurance choices side by side. Simply enter your zip
      code and basic vehicle information to start shopping for a policy that suits
      your budget.\\n\\n[27] Try it out.\\n\\n[28] World\\n\\n[29] Tour de headlines\\n\\n[30]
      *Wu Xiaoling/Getty Images*\\n\\n[31] **\U0001F4F1Apple\u2019s revenue is up,
      but its profit margins are narrowing.** In his first bite at the earnings report
      apple as CEO, John Ternus delivered a mixed bag. Revenue was better-than-expected,
      growing 12% year over year to $114.5 billion, and the iPhone maker expects solid
      revenue growth of between 7% and 10% over the holiday season. But investors
      sent its stock down in after-hours trading anyway, after Ternus revealed on
      a call with analysts that margins are shrinking due to the high cost of memory
      and expenses related to Siri AI. With expectations sky-high for Apple as a haven
      from Big Tech\u2019s AI turmoil, that news made investors wary. Meanwhile, if
      you\u2019re waiting for an iPhone Duo, it might be a while: Apple said it\u2019s
      \u201Chard to predict\u201D when supply might catch up to demand.*\u2014AR*\\n\\n[32]
      **\U0001F4B0 Marvell bets $115 billion on lasers for ~~sharks~~ data centers.**
      In an effort to squeeze the data center boom for all its juice, chipmaker Marvell
      has agreed to buy Lumentum, which builds lasers and other optical hardware that
      transmit information between chips and servers. At a value of $115 billion including
      debt, this is the second-most expensive tech transaction in history, behind
      the SpaceX\u2013xAI merger. Though the acquisition will give Marvell another
      foothold in AI infrastructure, the size of the deal\u2014which represents more
      than half of Marvell\u2019s market cap\u2014and broader concerns about a potential
      AI spending bubble have some investors on edge. Marvell and Lumentum\u2019s
      stocks fell 13% and 19%, respectively, following yesterday\u2019s announcement.*\u2014ML*\\n\\n[33]
      \U0001F4C8 **Palantir\u2019s commercial revenue outpaced government revenue
      for the first time.** The data software company reported third-quarter earnings
      yesterday that beat Wall Street estimates and revealed that its private-sector
      business has caught up with its public-sector business. Palantir reported $2.31
      billion in revenue, nearly double from the same period last year. Within that,
      its US commercial revenue spiked 148% to $984 million as companies adopted more
      of its AI tools, while revenue from contracts with US government entities like
      the Army, ICE, and the IRS jumped 96% to $953 million. Palantir also lifted
      its full-year guidance, saying it now expects $8.53 billion in 2026 revenue.*\u2014ML*\\n\\n[34]
      THINGS GOT HEATED\\n\\n[35] Hackers attacked European supermarket fridges\\n\\n[36]
      *Fred Tanneau/Getty Images*\\n\\n[37] Boiled gelato was the plat du jour after
      hackers targeted fridges and freezers at dozens of European supermarkets early
      yesterday morning. The defrosting cyberattacks had temperatures reaching 122
      Fahrenheit in some grocery store refrigerators across Belgium, Estonia, Finland,
      Ireland, Luxembourg, the Netherlands, and Sweden.\\n\\n[38] A similar cyberattack
      in France last month left dozens of supermarkets dealing with fires (on top
      of preemptively steamed broccoli), forcing them to toss millions of euros worth
      of products.\\n\\n[39] **How can this happen?** The Belgian company Sabcobel,
      which operates some of the fridges involved, said that hackers attacked a digital
      system that remotely controls the devices, putting them into defrost mode. Sabcobel
      said it had been patching software vulnerabilities over the past few weeks but
      explained that some fridges require physical modifications. Danfoss, a Danish
      refrigeration temperature-control systems supplier, said its tech was targeted
      both in yesterday\u2019s hack and in the earlier French cyberattack, affecting
      customers with non-updated software.\\n\\n[40] **The US might have endured a
      similar incident.** The Pentagon is investigating August hacks on several military
      base commissary fridges that led to the mass melting of frozen foods.\\n\\n[41]
      **Big picture:** These fridge-to-sauna transformations are heightening concerns
      about AI-enabled hackers attacking critical infrastructure that relies on digital
      systems. More than 20 cyberattacks on refrigeration systems have taken place
      this year, with some linked to Russia-aligned hackers, according to cybersecurity
      firm Forescout.*\u2014SK*\\n\\n[42] Sponsored By GLOBAL X ETFS\\n\\n[43] **An
      essential but overlooked AI layer.** AI servers can\u2019t run reliably without
      one specific piece of hardware. Suppliers for it are few and most are based
      in Asia, out of reach for many US investors. Thankfully, a Global X ETF changes
      that.\\n\\n[44] DUCK, DUCK, GOOSE\\n\\n[45] DC voters are being served a foie
      gras referendum\\n\\n[46] *Niv Bavarsky*\\n\\n[47] If the people of Washington,
      DC are tired of having this issue forced down their throats, imagine how the
      ducks feel\u2014a referendum is on the ballot in the nation\u2019s capital today
      that would ban the sale of foie gras along with the practice of overfeeding
      ducks through a metal tube that creates the pricey dish.\\n\\n[48] The measure
      made it to the ballot due to the work of Pro-Animal Future, a lobbying group
      that spent nearly $400,000 and sent a cute duck to DC to sway voters (the group
      also got a similar measure onto the ballot in Denver). The group estimates that
      26 DC-area restaurants serve foie gras, which is made from fattened duck or
      goose liver.\\n\\n[49] **The measure is expected to pass, but** businesses are
      pushing back on the notion that stuffing ducks right before they die is cruel
      and raising concerns that banning foods is a slippery slope. Critics also say
      the ban could unfairly affect suppliers. Hudson Valley Foie Gras, one of the
      two major US distributors, told Axios it\u2019s already planning a legal challenge.\\n\\n[50]
      **Wrap it up:** Even if voters say \u201Cget the duck out of here,\u201D the
      ban wouldn\u2019t take effect until July 2027. And it could be even longer:
      New York City voted in favor of a similar foie gras ban in 2019, but it remains
      unenforced amid litigation.*\u2014DL*\\n\\n[51] Reader Poll\\n\\n[52] Matty\u2019s
      work-life balance\\n\\n[53] Do people care about their jobs anymore?\\n\\n[54]
      *Getty Images*\\n\\n[55] *On Tuesdays, the Brew\u2019s Matty Merritt brings
      you the news you need to make life a little easier during your 9*\u2013*5, 5*\u2013*9,
      or OOO.*\\n\\n[56] You\u2019re not the only one falling down a Wikipedia rabbit
      hole on your second monitor; employee engagement at work fell two percentage
      points last quarter compared with the previous one. Engagement dropped to 29%,
      its lowest level in 15 years, a recent Gallup poll found.\\n\\n[57] **Confusion
      could be a factor.** Workers reported less clarity in their roles, with just
      46% of respondents saying they knew what higher-ups expect from them. This was
      a three percentage point drop compared with the previous quarter and down from
      the high of 61% in 2015.\u2014*MM*\\n\\n[58] Sponsored By Nuun\\n\\n[59] **Sip
      happens.** Your hydration routine shouldn\u2019t take more effort than your
      workout. Nuun turns a plain bottle of water into something worth sipping: electrolytes,
      great flavor, one tablet. No mixing, no measuring, no mess. Toss a tube in your
      bag and stay ahead of the afternoon slump. Give your bottle a boost.\\n\\n[60]
      News\\n\\n[61] What else is brewing\\n\\n[62] recs\\n\\n[63] *\\\\*A message
      from our sponsor. \\\\*\\\\*This is a product recommendation from our writers.
      When you buy through this link, Morning Brew may earn a commission.*\\n\\n[64]
      Play\\n\\n[65] **Brew Mini:** Jack\u2019s puzzle for today is titled \u201CProtractor,\u201D
      which we think makes sense because it\u2019s\u2026a cute one. Play the Mini
      here.\\n\\n[66] On National Sandwich Day, here\u2019s a relevant \u201CFinal
      Jeopardy\u201D clue from a few years back:\\n\\n[67] This sandwich was first
      sold in 1962 as an attempt to give the many Catholics of Cincinnati something
      to eat on Fridays during Lent. (You must phrase your answer in the form of a
      question for full credit.)\\n\\n[68] Share the Brew\\n\\n[69] Share the Brew,
      watch your referral count climb, and unlock brag-worthy swag.\\n\\n[70] Your
      friends get smarter. You get rewarded. Win-win.\\n\\n[71] **Your referral count:**
      0\\n\\n[72] Or copy & paste your referral link to others:\\n\\n[73] morningbrew.com/r/\\n\\n[74]
      Answer\\n\\n[75] What is the Filet-o-Fish?\\n\\n[76] Word of the Day\\n\\n[77]
      Today\u2019s Word of the Day is: adage, meaning \u201Ca short, memorable saying
      that expresses a general truth.\u201D Thanks to Heather from Milwaukee for a
      suggestion universally acknowledged to be good. Submit another Word of the Day
      here.\\n\\n[78] **\u2724 A Note From Citi**\\n\\n[79] Citibank, N.A., Member
      FDIC\\n\\n[80] Written by Abigail Rubenstein, Sam Klebanov, Dave Lozo, Molly
      Liebergall, Matty Merritt, and Neal Freyman\\n\\n[81] Was this email forwarded
      to you? Sign up here.\\n\\n[82] **Get smarter in just 5 minutes**\\n\\n[83]
