      token is a random id; the server keeps the session data in its own store and
      looks it up on each request (stateful). A JWT carries the claims itself, signed
      by the server, so it can be verified without a lookup (stateless)."},{"kind":"mechanism","question":"Why
      is revoking a session token easy but revoking a JWT hard?","answer":"A session
      lives in the server''s store, so deleting it ends it instantly. A JWT is self-contained
      and valid until it expires, so revoking it early needs extra machinery like
      a deny list."},{"kind":"mechanism","question":"How does a server check a session
      token versus a JWT on each request?","answer":"Session token: look the id up
      in the session store. JWT: verify the cryptographic signature (and expiry) using
      the key, with no store lookup."},{"kind":"concept","question":"What is the scaling
      advantage of JWTs, and what is the trade-off of adding a deny list?","answer":"Any
      server holding the verification key can check a JWT without a shared session
      store. Adding a deny list reintroduces a server-side lookup, which erodes that
      stateless benefit."},{"kind":"foundation","question":"Is a JWT encrypted by
