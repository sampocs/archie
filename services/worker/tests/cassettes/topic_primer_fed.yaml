        rates\",\n    \"detail\": [\"Markets expect the Fed to cut later as growth
        weakens.\", \"It has preceded most US recessions since the 1960s.\"]\n  }\n]\n</foundation_cards>"}],"container":null,"stop_reason":"end_turn","stop_sequence":null,"stop_details":null,"usage":{"input_tokens":1275,"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":0},"output_tokens":3289,"output_tokens_details":{"thinking_tokens":846},"service_tier":"standard","inference_geo":"global","speed":"standard"},"diagnostics":null}'
