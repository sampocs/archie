[project]
name = "archie-llm"
version = "0.1.0"
description = "Model and speech-to-text calls with cost records, shared by the worker and the API."
requires-python = ">=3.13"
dependencies = [
  "archie-shared",
  "archie-db",
  "anthropic>=2.4",
  "httpx>=0.28.1",
]

[tool.uv.sources]
archie-shared = { workspace = true }
archie-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archie_llm"]
