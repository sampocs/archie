    body: '{"max_tokens":2000,"messages":[{"role":"user","content":"Kind: talking
      point\nTitle: The argument for crypto\n\n<take>\nCrypto''s lasting use isn''t
      speculation. It''s moving dollars, and it already works.\n\n## Main points\n\n-
      Stablecoins settle ~$10T a year, already Visa scale, with no bank in the middle.\n-
      Dollar demand abroad: people in high-inflation countries want dollars, and stablecoins
      are the easiest way to hold them.\n- Open rails: anyone can build payments on
      them without a bank partnership.\n\n## When they say \"it''s just a casino\"\n\nMost
      volume is speculation, agreed. But the payment use is growing whatever happens
      to prices.\n</take>"}],"model":"claude-haiku-5-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","properties":{"cards":{"type":"array","items":{"type":"object","properties":{"question":{"type":"string"},"answer":{"type":"string"},"detail":{"type":"array","items":{"type":"string"}}},"required":["question","answer","detail"],"additionalProperties":false}}},"required":["cards"],"additionalProperties":false}}},"system":"You
      write review cards from the user''s own take for a personal learning app. A
      take is something the user thinks (an opinion) or the case they make for something
      (a talking point), in their own words. The cards help them remember their own
      argument well enough to make it out loud.\n\nWrite 2-4 open-recall cards. Good
      questions ask for the take''s main points (\"What are your three main points
      for ...?\"), a rough number the take cites, and the user''s answer to an objection
      the take names (\"What do you say to ...?\"). Ask only about what the take says.
      Write each card to the card rules below, with its answer and its detail made
      only of the take''s own words and claims: never add a fact, number or argument
      that isn''t in the take, and never correct, soften or strengthen what it says.
      The user''s spoken answer is graded against these answers.\n\nEach card has
      a question, an answer and a detail:\n- question: ONE focused question with ONE
      thing to recall. Never join two asks with \"and\" (\"What does X give you, and
      what can you lose?\" is two cards, or pick one). Ask only what has a short answer.\n-
      answer: the one thing to recall, in as few words as carry it: a phrase, not
      a sentence. Aim for 2-8 words, never more than 15. The learner is graded only
      on this, so it is what someone who knows the material would say off the top
      of their head. When two things are both essential, name both briefly (\"Supply
      and demand\"). A number card''s answer is the rough figure with its unit.\n-
      detail: 0-3 short bullet lines, each under 12 words. Shown after the learner
      answers, never graded. Each line must help explain the answer (the why or how
      behind it, or a contrast that makes it click); a further fact about the subject,
      however true, is not a reason for a line. No padding and no redundancy: never
      a line that restates the answer, is implied by it or repeats another line; that
      is trivia from this one source (who said it, when, a passing example or anecdote)
      rather than a lasting fact about the subject; or that is a side remark that
      doesn''t help recall. So a plain fact or a number usually needs none and most
      whys need one; use two or three only when the explanation really has that many
      steps (A happens, so B, so C) or named parts (the three phases of a cycle).
      When in doubt, use fewer."}'
