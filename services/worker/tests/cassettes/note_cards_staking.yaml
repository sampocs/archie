    body: '{"max_tokens":2000,"messages":[{"role":"user","content":"Title: Proof of
      stake\n\n<notes>\n# Proof of stake\n\n- validators lock up coins instead of
      burning power\n- cheating gets the stake slashed\n- Ethereum needs 32 ETH per
      validator\n- energy use fell about 99.95% after the merge\n\n</notes>\n\n<explanation>\nProof
      of stake secures a blockchain with locked-up coins instead of computing work.\n\nKey
      ideas:\n- Validators lock coins as a stake, and are chosen to propose blocks.\n-
      A validator who signs conflicting blocks has part of its stake slashed.\n- Attacking
      the chain means buying a large share of the coins, which is costly.\n- Without
      mining hardware, energy use is a tiny fraction of proof of work.\n\nNumbers:\n-
      Ethereum requires 32 ETH per validator.\n- Energy use fell about 99.95% after
      the switch to proof of stake.\n</explanation>"}],"model":"claude-haiku-5-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","properties":{"cards":{"type":"array","items":{"type":"object","properties":{"kind":{"type":"string","enum":["concept","mechanism","number"]},"question":{"type":"string"},"answer":{"type":"string"},"detail":{"type":"array","items":{"type":"string"}}},"required":["kind","question","answer","detail"],"additionalProperties":false}}},"required":["cards"],"additionalProperties":false}}},"system":"You
      write review cards for a personal learning app from an explanation of a subject
      the user chose to study, so they remember it. The user''s own notes on it show
      what they chose to cover; ask about that.\n\nWrite 3-5 open-recall cards of
      kind concept, mechanism (\"why does X cause Y\") or number (a rough figure worth
      knowing), written to the card rules below and worded from the explanation. Avoid
      trivia. When nothing in it is worth remembering (personal admin, a list of errands),
      cards is an empty list. Never mention the notes or the explanation in a card.\n\nEach
      card has a question, an answer and a detail:\n- question: ONE focused question
      with ONE thing to recall. Never join two asks with \"and\" (\"What does X give
      you, and what can you lose?\" is two cards, or pick one). Ask only what has
      a short answer.\n- answer: the one thing to recall, in as few words as carry
      it: a phrase, not a sentence. Aim for 2-8 words, never more than 15. The learner
      is graded only on this, so it is what someone who knows the material would say
      off the top of their head. When two things are both essential, name both briefly
      (\"Supply and demand\"). A number card''s answer is the rough figure with its
      unit.\n- detail: 0-3 short bullet lines, each under 12 words. Shown after the
      learner answers, never graded. Each line must help explain the answer (the why
      or how behind it, or a contrast that makes it click); a further fact about the
      subject, however true, is not a reason for a line. No padding and no redundancy:
      never a line that restates the answer, is implied by it or repeats another line;
      that is trivia from this one source (who said it, when, a passing example or
      anecdote) rather than a lasting fact about the subject; or that is a side remark
      that doesn''t help recall. So a plain fact or a number usually needs none and
      most whys need one; use two or three only when the explanation really has that
      many steps (A happens, so B, so C) or named parts (the three phases of a cycle).
      When in doubt, use fewer."}'
