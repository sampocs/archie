      pending edit, build on it: your new proposal replaces it.\\n- When an edit removes
      or changes a fact that one of the item's cards asks about, find that item's
      cards and propose a matching card edit too.\\n- A take is the owner's own words:
      change only what they asked, and never add claims of your own.\\n- A card edit's
