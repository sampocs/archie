      to this knowledge base of LLMs, you don\u2019t need to ask an AI model to guess
      why an application might be performing poorly. You can build a workflow that
      asks the model to pattern-match known performance bugs against actual call stacks.\\n\\nNetflix
      built an automated performance system that wraps the LLM inside a well-defined
      pipeline.\\n\\nA key lesson Netflix engineers learnt during this implementation
      was about scoping. If you feed an LLM a complete, raw stack trace without boundaries,
      it can get distracted. Often, the model spends a lot of reasoning tokens analyzing
      internal JVM garbage collection pauses, low-level Linux kernel syscalls, or
      even 3rd party open-source framework overhead.\\n\\nApplication developers don\u2019t
      have any control over such internal library concerns or OS routines. Therefore,
      you need to provide the agent with strict package prefix rules. This way, the
      model can ignore generic platform noise and focus on tracing only the specific
      application code.\\n\\nWhen the Netflix engineering team deployed the profiling
      pipeline against its production service, the agent found 4 major categories
      of performance bugs.\\n\\nFirst was an algorithmic bottleneck that wasted 8.8%
      of CPU resources. The agent found an aggregation method using Java Streams where
      an immutable map was updated inside a reduction step.\\n\\n```\\n// Anti-pattern:
      O(N^2) accumulation inside stream reduction\\nstream().reduce(ImmutableMap.of(),
      (acc, val) -> {\\nreturn ImmutableMap.builder()\\n.putAll(acc) // Copies every
      existing entry on every single step\\n.put(val)\\n.build();\\n});\\n```\\nSince
      putAll(acc) copies every existing key-value pair on every step, you need to
      copy elements again and again to build a map of size N. This results in quadratic
      complexity.\\n\\nThe agent modified the quadratic builder reduction with a linear
      collection approach.\\n\\n```\\n// Optimized: O(N) single-pass collection\\nstream()\\n.flatMap(e
      -> e.entrySet().stream())\\n.collect(toMap(Entry::getKey, Entry::getValue));\\n```\\nThe
      second category was about regular expressions on the hot path. In a service,
      the developer had to sanitize incoming request strings by modifying characters
      that weren\u2019t allowed. The earlier implementation ran a raw regular expression
      substitution on every request.\\n\\n```\\n// Anti-pattern: Dynamic regex evaluation
      per request\\nString sanitized = input.replaceAll(\u201D[^a-zA-Z0-9.-]\u201D,
      \u201C_\u201D);\\n```\\nAs you might know, evaluating regular expressions involves
      parsing and state-machine transitions. This logic on high-volume traffic used
      46% of the service\u2019s CPU time.\\n\\nThe agent replaced the regex evaluation
      with a pre-computed lookup table that checked characters by index. The execution
      got 22 times faster.\\n\\nThe next category was related to unnecessary object
      allocation that caused OOM crashes. A service frequently checked whether incoming
      data payloads contained specific metadata fields. To perform the check, the
      code was creating a new, heavy HashSet on every incoming call.\\n\\nHowever,
      the underlying data object already had an internal lookup method available.
      Also, instantiating millions of such objects consumed 47% of the service\u2019s
      total heap collections.\\n\\nThe agent fixed this issue by removing the redundant
      object instantiations and modified the code to reuse the cached method.\\n\\nThe
      next category was around library misuse. For example, the discovery involved
      metric telemetry instrumentation. One of the services tracked operations by
      looking up a counter from a metric registry on every single call.\\n\\n```\\n//
      Anti-pattern: Looking up metric instances on every function execution\\nMetrics.counter(\u201Drequest.count\u201D).increment();\\n```\\nWhen
      the query was sent to the registry, it needed dictionary lookups and internal
      synchronization locks. The profiler showed that the work consumed 66% of the
      CPU, whereas the actual business logic used only 0.3%.\\n\\nThe agent fixed
      it by caching the metric counter reference at the time of class initialization.
      Also, it found that the same issue was happening across three independent services.\\n\\nIf
      you have an AI agent that can optimize code, it\u2019s quite dangerous if the
      changes are applied without automatic verification. If the agent makes a change
      that breaks business logic, it\u2019s worse than inefficient code.\\n\\nTo prevent
      regressions, the agentic pipeline uses the standard SDLC.\\n\\nIn stage 1, you
      verify the logic. Before you move any code, the agent\u2019s branch must pass
      all existing unit, integration, and contract tests. This is to make sure that
      the changes made by the change don\u2019t alter basic inputs, outputs, or handling
      of edge cases.\\n\\nIn stage 2, you have the canary deployment. If the tests
      pass, the pipeline spins up a canary deployment in production. The canary instance
      gets a portion of the traffic. It runs side-by-side with an identical baseline
      instance that runs the original code.\\n\\nStage 3 is about generating the observability
      report. The platform collects hard telemetry metrics over a big enough window.
      Some metrics are relative CPU utilization, median latency, P99 latency, and
      memory allocation rates. They also don\u2019t use any AI model to check the
      canary results.\\n\\nIn stage 4, you have the final engineering decision. When
      the canary version shows a good level of performance improvement with zero increase
      in error rates, the system opens a PR. This PR goes for human review. It includes
      the code change, the original flame graph, and the canary report. The final
      decision on deploying the change to production is taken by the human developer.\\n\\nAutomated
      production profiling is quite effective. But if you just rely on it, you end
      up exposing several limitations.\\n\\nBy the time an agent finds an anti-pattern
      in production, you\u2019ve already paid for days or weeks of wasted compute
      capacity.\\n\\nSecond, developers are anyway cautious about changing a running
      service. If you have a service that handles production traffic without crashing,
      the developers hesitate to just make changes for the sake of optimization.\\n\\nLastly,
      multiple teams often make the exact same mistakes when it comes to patterns.
      If you run a super-expensive agent on 10 different services just to find the
      same problem, it\u2019s not very efficient.\\n\\nThese limitations led to Netflix
      making the decision to shift performance checks left into the early development
      cycle. Also, they wanted the agents to share their findings across the entire
      engineering organization.\\n\\nHowever, as you might know, language models are
      stateless. Every time you send a prompt to an LLM, it starts with a clean slate.
      It might no retain any memory of the bug it found some time back in another
      service. The Netflix engineering team built a Pattern Catalog to make the models
      achieve persistence. This was done by pairing a stateless LLM with a stateful
      catalog. Or a shared memory across the fleet.\\n\\nThe Pattern Catalog was built
      around 4 key principles.\\n\\nFirst, it has to be centralized and serve as the
      single source of truth for all engineering teams. This way, no two teams end
      up debugging the same issues.\\n\\nThe second principle is that the same catalog
      entries should work across distinct environments. For example, offline profiling,
      CI/CD pull request checks, and local development tools.\\n\\nThird, you need
      to format entries so that an automation script can easily inject them into an
      LLM\u2019s system prompt.\\n\\nLastly, the contents of the catalog should be
      reviewable by human developers.\\n\\nTo implement the Pattern Catalog, the Netflix
      engineering team used a simple Git repository filled with plain Markdown files.
      They didn\u2019t use vector databases or complex knowledge stores. The idea
      was borrowed from the \u201CLLM-wiki\u201D concept popularized by Andrej Karpathy.\\n\\nBy
      using a standard Git repository, the developers got several advantages. For
      one, developers can diff changes, open pull requests, and use git features to
      find out why an entry was created. It also scales well to 100s of detailed performance
      rules without the need for complex search infrastructure. Lastly, plain Markdown
      is easy for both humans and language models to read without translation layers.\\n\\nWith
      the Pattern Catalog in place, Netflix can handle performance engineering via
      two paths. Reactive and Proactive.\\n\\nIn the reactive path, your system profiles
      production services on a recurring schedule or on demand. When the agent finds
      a new bottleneck, it tests the fix on a canary instance. If everything goes
      fine, the patch is merged, and the agent documents the new finding in the Pattern
      Catalog.\\n\\nIn the proactive path, the process starts when a developer creates
      a new PR. CI tooling performs a fast regex or symbol match against the Pattern
      Catalog index. If the code in the PR matches known anti-patterns, the CI bot
      calls an LLM and provides it with the pull request diff. The LLM checks the
      context and leaves an inline comment that explains the inefficiency. It shows
      the resource impact and suggests a fix. All this happens before the code ever
      merges to the main branch.\\n\\nThe key learning from the Netflix engineering
      experience is that automating performance engineering work is not an all-or-nothing
      game. You can have organizations adopt workflows along a four-level maturity
      spectrum.\\n\\nLevel 0 is the manual situation. This is the level where machine
      learning is not used. Human developers manually capture traces, interpret flame
      graphs, and trace code paths.\\n\\nLevel 1 is the assist approach. This is the
      entry point for AI adoption. The LLM acts as an analytical copilot. A developer
      initiates the profiling process. But they don\u2019t spend time studying flame
      graphs. Instead, they feed the stack dump to the model. The model finds the
      hot execution path.\\n\\nLevel 2 is the orchestration level. This is the current
      state at Netflix. A lot of proactive scanning happens. Also, they use the Pattern
      Catalog.\\n\\nLevel 3 is the fully autonomous level. This is the long-term vision
      at Netflix for performance agents. At Level 3, the agents will create their
      own optimization strategies. They will explore multiple alternative implementations.
      Or run automated benchmarks.\\n\\n**References:**\\n</text>\"}],\"model\":\"claude-haiku-5-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"summary\":{\"type\":\"object\",\"properties\":{\"gist\":{\"type\":\"string\"},\"key_ideas\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"timestamp\":{\"type\":[\"string\",\"null\"]},\"idea\":{\"type\":\"string\"}},\"required\":[\"timestamp\",\"idea\"],\"additionalProperties\":false}},\"numbers\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"timestamp\":{\"type\":[\"string\",\"null\"]},\"fact\":{\"type\":\"string\"}},\"required\":[\"timestamp\",\"fact\"],\"additionalProperties\":false}}},\"required\":[\"gist\",\"key_ideas\",\"numbers\"],\"additionalProperties\":false},\"domain\":{\"type\":\"string\",\"enum\":[\"AI\",\"Macro\",\"Crypto\",\"Startups\",\"Finance\",\"Tech\",\"History\",\"Security\",\"Sports\",\"Other\"]},\"topic\":{\"type\":\"string\"},\"tags\":{\"type\":\"array\",\"items\":{\"type\":\"string\"}},\"concepts\":{\"type\":\"array\",\"items\":{\"type\":\"string\"}},\"is_educational\":{\"type\":\"boolean\"},\"cards\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"kind\":{\"type\":\"string\",\"enum\":[\"concept\",\"mechanism\",\"number\"]},\"question\":{\"type\":\"string\"},\"answer\":{\"type\":\"string\"}},\"required\":[\"kind\",\"question\",\"answer\"],\"additionalProperties\":false}}},\"required\":[\"summary\",\"domain\",\"topic\",\"tags\",\"concepts\",\"is_educational\",\"cards\"],\"additionalProperties\":false}}},\"system\":\"You
      process sources for a personal learning app. A source is an article, an X post
      or thread, or an episode (podcast or video) that the user consumed or plans
      to. A newsletter is an email digest; summarize its main stories. The user wants
      \\\"level 2\\\" knowledge of its subject: enough to hold a real conversation
      about it, including the vocabulary, how things work, the key players, rough
      numbers, and the current debates.\\n\\nFrom the text, produce:\\n- summary:
      the gist in 2-3 sentences, the key ideas, and the numbers worth remembering.
      The text of an episode may carry markers like [12:14] or [1:02:03] at roughly
      one-minute intervals; give each key idea and number the time of the marker nearest
      before where it comes up, copied exactly but without the brackets (12:14, 1:02:03),
      and null when the text has no markers. Skip ads and sponsor reads.\\n- domain:
      the one broad domain the source belongs to.\\n- topic: a short, reusable topic
      name under that domain (e.g. \\\"Stablecoins\\\", \\\"Fed policy\\\", \\\"NFL
      quarterbacks\\\").\\n- tags: 3-8 short tags.\\n- concepts: the key concepts
      the source relies on or teaches, as short noun phrases.\\n- is_educational:
      true when the source teaches something worth remembering (how things work, history,
      ideas, numbers). false for pure entertainment such as banter, sports chat, jokes
      or gossip. A mostly entertaining source with real teaching in it (e.g. how a
      contract works, why a play scheme succeeds) is still true.\\n- cards: when is_educational
      is true, 3-5 open-recall review cards of kind concept, mechanism (\\\"why does
      X cause Y\\\") or number (a rough figure worth knowing). Each card asks ONE
      focused question, never a compound one with several parts. Each answer is what
      a good response would cover in 1-3 sentences. Avoid trivia that only matters
      to this one source. Cards come only from the educational stretches of a source:
      a mostly entertaining show with one educational segment gets cards for that
      segment; still 3-5. When is_educational is false, cards is an empty list.\\n\\nWrite
      in plain, conversational English for a smart reader who is new to the subject.
      Short sentences. Define any jargon the first time it appears. Prefer concrete
      examples and rough numbers (\\\"~1 GW\\\", not \\\"1.07 GW\\\").\"}"
