      string: '{"model":"claude-sonnet-5-5","id":"msg_011CgvSkraRrmvHifeWicGpe","type":"message","role":"assistant","content":[{"type":"text","text":"{\"summary\":{\"gist\":\"Kahneman
        describes the mind as two cooperating systems: System 1, which is fast, automatic
        and intuitive, and System 2, which is slow, effortful and deliberate. System
        1 runs most of your life well, but it relies on shortcuts that produce predictable
        biases, and it feels certain even when it is wrong. Knowing where these errors
        come from helps you spot them and design better decisions, though Kahneman
        admits that awareness alone rarely fixes them.\",\"key_ideas\":[{\"timestamp\":null,\"idea\":\"**Two
        systems.** System 1 works automatically and effortlessly: it reads faces,
        completes familiar phrases and forms impressions. System 2 handles effortful
        tasks like checking a calculation or following rules. System 2 is lazy, so
        it often accepts what System 1 suggests without checking.\"},{\"timestamp\":null,\"idea\":\"**Anchoring.**
        When you consider a number before estimating something, your estimate stays
        pulled toward that number, even if the number is random or obviously irrelevant.
        Kahneman explains it two ways: System 2 adjusts from the anchor but stops
        too early, and System 1 primes related ideas that make the anchor seem plausible.
        Negotiators, sellers and judges are all affected, and even experts are not
        immune.\"},{\"timestamp\":null,\"idea\":\"**Confidence is not accuracy.**
        System 1 builds the most coherent story from the information at hand and ignores
        what it does not have. Kahneman calls this WYSIATI, \\\"what you see is all
        there is\\\". Because the story is coherent, it feels certain. Feeling sure
        tells you the story is neat, not that it is true. This is why overconfidence
        is so persistent, from the illusion of validity in expert predictions to planning
        that ignores unknowns.\"},{\"timestamp\":null,\"idea\":\"**Heuristics and
        biases.** When a question is hard, System 1 quietly answers an easier one.
        With availability, you judge how common something is by how easily examples
        come to mind. With representativeness, you judge by resemblance to a stereotype
        and ignore base rates, the underlying statistics. The Linda problem shows
        this: people rate \\\"bank teller and feminist\\\" as more likely than \\\"bank
        teller\\\", which is logically impossible.\"},{\"timestamp\":null,\"idea\":\"**Prospect
        theory.** People judge outcomes as gains or losses relative to a reference
        point, not as final wealth. Losses hurt roughly twice as much as equal gains
        please, which is loss aversion. People also overweight small probabilities
        and are risk-averse for likely gains but risk-seeking to avoid likely losses.
        This explains behavior standard economics treats as irrational.\"},{\"timestamp\":null,\"idea\":\"**Framing.**
        The same facts described differently lead to different choices, such as \\\"90%
        survive\\\" versus \\\"10% die\\\". This shows that preferences are often
        constructed on the spot, not stored and consistent.\"},{\"timestamp\":null,\"idea\":\"**Planning
        fallacy and the outside view.** People forecast from their own plan, which
        is the inside view, and are too optimistic. The fix is to look at how similar
        projects actually turned out, the outside view or reference class forecasting.
        Kahneman tells how his own textbook team misjudged its timeline.\"},{\"timestamp\":null,\"idea\":\"**Two
        selves.** The experiencing self lives moment to moment, while the remembering
        self keeps the story. Memory is shaped by the peak and the ending and ignores
        duration (the peak-end rule and duration neglect), and the remembering self
        makes the decisions. So people may choose a worse experience because it was
        remembered better.\"},{\"timestamp\":null,\"idea\":\"**Defenses.** Biases
        are hard to catch from the inside, so Kahneman recommends slowing down on
        high-stakes decisions, using checklists and algorithms, and learning to recognize
        situations where errors are likely. It is easier to spot them in other people
        and organizations than in yourself.\"}],\"numbers\":[{\"timestamp\":null,\"fact\":\"Losses
        loom about 1.5 to 2.5 times larger than equivalent gains (often summarized
        as roughly 2x).\"},{\"timestamp\":null,\"fact\":\"In the Linda problem, most
        people, including statistically trained ones, rank the conjunction \\\"bank
        teller and feminist\\\" above \\\"bank teller\\\".\"},{\"timestamp\":null,\"fact\":\"Anchoring
        study: a rigged wheel of fortune stopping at 10 or 65 shifted estimates of
        African UN member countries to about 25% vs. 45%.\"},{\"timestamp\":null,\"fact\":\"Planning
        fallacy example: Kahneman''s textbook team guessed about 2 years, and the
        project took about 8 years.\"},{\"timestamp\":null,\"fact\":\"Anchoring in
        sentencing: judges who rolled a loaded die and got a high number gave longer
        sentences to a shoplifter than those who rolled low.\"},{\"timestamp\":null,\"fact\":\"The
        book draws on roughly 40+ years of research, much of it with Amos Tversky;
        Kahneman won the 2002 Nobel Prize in Economics.\"}]},\"domain\":\"Other\",\"topic\":\"Behavioral
