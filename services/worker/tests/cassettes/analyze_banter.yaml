      Sunday Reaction Show\nURL: https://www.paulgraham.com/greatwork.html\n\n<text>\nAlright,
      welcome back to the show, I''m Dave, and with me as always is Marcus, who is
      still not over Sunday.\n\nI am not over Sunday. I will never be over Sunday.
      We were up fourteen going into the fourth quarter and I had a sandwich in my
      hand, a victory sandwich, and I put it down. I put the sandwich down, Dave.
      That''s on me.\n\nYou cannot blame the sandwich. The sandwich did nothing wrong.\n\nThe
      sandwich knew. The sandwich always knows. Okay, but seriously, that last drive,
      the coach calls a pass on third and one. Third and one! My nephew is nine years
      old and even he yelled run the ball at the television.\n\nYour nephew also thinks
      the team should play two quarterbacks at the same time.\n\nAnd honestly, he
      might be onto something, because what we''re doing now clearly isn''t working.
      Look, I''m not saying fire anybody. I''m saying that if I''m the owner, I''m
      at least sending a very stern email.\n\nA stern email. All caps?\n\nSubject
      line, all caps. Body of the email, just the word \"no\" repeated forty times.\n\nThat
      would get results. Okay, let''s do the hot takes. Marcus, give me your hottest
      take of the week.\n\nMy hottest take is that the mascot is the best player on
      the roster. Did you see him on Sunday? Rode a four wheeler through a wall of
      fake fire at halftime and didn''t even flinch. Meanwhile our kicker flinches
      at a gentle breeze.\n\nThe kicker is a sensitive man. We should respect that.\n\nWe
      respect him. We do not rely on him. Different things.\n\nFair. My hot take is
      that the tailgate was better than the game, and I say that as someone who got
      there at seven in the morning for a four o''clock kickoff. A guy in the lot
      was making breakfast burritos for strangers. No reason. Just a man and a griddle
      and a dream.\n\nThat''s the real sport right there. Okay, quick lightning round,
      who''s winning the league this year? Not who should win, who will win.\n\nI
      say the team in the purple jerseys, purely because I like how they look on television.\n\nThat
      is a terrible reason and also the same reason you picked last year''s champion.\n\nAnd
      I was right last year, so the system works. I''m calling it a system now.\n\nFine,
      it''s a system. I''m going with the defending champs, because they have the
      deepest roster and, more importantly, their fans are insufferable, and I need
      to be able to say I told you so to a specific person. His name is Gary.\n\nPoor
      Gary.\n\nGary knows what he did. Alright, that''s the show, thanks for listening,
