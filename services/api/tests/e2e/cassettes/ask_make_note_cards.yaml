      the token (e.g. stETH) in return.\"},{\"kind\":\"number\",\"question\":\"In
      what ratio do you receive stETH when staking ETH with Lido?\",\"answer\":\"One
      for one: 1 ETH staked gives you 1 stETH.\"},{\"kind\":\"mechanism\",\"question\":\"How
      can an LST earn rewards and be useful at the same time?\",\"answer\":\"The LST
      keeps earning staking rewards while you use it elsewhere, for example as collateral
      in other apps. Your stake works in two places at once.\"},{\"kind\":\"mechanism\",\"question\":\"How
      does withdrawing differ between direct staking and holding an LST?\",\"answer\":\"Direct
      stake has to wait in the exit queue before you can withdraw. An LST can be sold
      at once on the market, so you get liquidity without waiting.\"},{\"kind\":\"concept\",\"question\":\"What
