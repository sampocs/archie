        class=\"external text\" data-mw-original-href=\"//en.wikipedia.org/w/index.php?title=Proof_of_stake&amp;action=edit\">improve
        it</a> by adding information on neglected viewpoints. Relevant discussion
        may be found on the <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Talk:Proof_of_stake\"
        title=\"Talk:Proof of stake\">talk page</a>.</span>  <span class=\"date-container\"><i>(<span
        class=\"date\">December 2021</span>)</i></span></div></td></tr></tbody></table><span
        class=\"mw-empty-elt\" about=\"#mwt6\"><link rel=\"mw:PageProp/Category\"
        href=\"./Category:Articles_needing_more_viewpoints_from_December_2021\"/></span>\n\n<p
        id=\"mwCg\"><b id=\"mwCw\">Proof-of-stake</b> (<b id=\"mwDA\">PoS</b>) protocols
        are a class of <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Consensus_(computer_science)\"
        title=\"Consensus (computer science)\" id=\"mwDQ\">consensus mechanisms</a>
        for <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Blockchain\"
        title=\"Blockchain\" id=\"mwDg\">blockchains</a> that work by selecting validators
        in proportion to their quantity of holdings in the associated <a rel=\"mw:WikiLink\"
        href=\"https://en.wikipedia.org/wiki/Cryptocurrency\" title=\"Cryptocurrency\"
        id=\"mwDw\">cryptocurrency</a>. This is done to avoid the computational cost
        of <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Proof_of_work\"
        title=\"Proof of work\" id=\"mwEA\">proof-of-work</a> (PoW) schemes. The first
        functioning use of PoS for cryptocurrency was <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Peercoin\"
        title=\"Peercoin\" id=\"mwEQ\">Peercoin</a> in 2012, although its scheme,
        on the surface, still resembled a PoW.<sup about=\"#mwt10\" class=\"mw-ref
        reference\" id=\"cite_ref-ZhaoYangLuo2021_1-0\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"ZhaoYangLuo2021\"},\"body\":{\"id\":\"mw-reference-text-cite_note-ZhaoYangLuo2021-1\"}}'><a
        href=\"#cite_note-ZhaoYangLuo2021-1\" id=\"mwEg\"><span class=\"mw-reflink-text\"
        id=\"mwEw\"><span class=\"cite-bracket\" id=\"mwFA\">[</span>1<span class=\"cite-bracket\"
        id=\"mwFQ\">]</span></span></a></sup></p>\n\n<meta property=\"mw:PageProp/toc\"
        id=\"mwFg\" data-mw='{\"autoGenerated\":true}'/></section><section data-mw-section-id=\"1\"
        id=\"mwFw\" aria-labelledby=\"Description\"><div class=\"mw-heading mw-heading2\"><h2
        id=\"Description\">Description</h2></div>\n\n<p id=\"mwGA\">For a blockchain
        transaction to be recognized, it must be appended to the blockchain. In a
        proof-of-stake blockchain, the appending entities are named <i id=\"mwGQ\">minters</i>
        or <style data-mw-deduplicate=\"TemplateStyles:r1349394836\" typeof=\"mw:Extension/templatestyles
        mw:Transclusion\" about=\"#mwt11\" id=\"mwGg\" data-mw='{\"name\":\"templatestyles\",\"attrs\":{\"src\":\"Template:Visible
        anchor/styles.css\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"vanchor\",\"href\":\"./Template:Vanchor\"},\"params\":{\"1\":{\"wt\":\"Validator\"},\"text\":{\"wt\":\"&apos;&apos;&apos;validators&apos;&apos;&apos;\"}},\"i\":0}}]}'>.mw-parser-output
        .vanchor>:target~.vanchor-text{background-color:#ebf4ff}@media screen{html.skin-theme-clientpref-night
        .mw-parser-output .vanchor>:target~.vanchor-text{background-color:#0f4dc9}}@media
        screen and (prefers-color-scheme:dark){html.skin-theme-clientpref-os .mw-parser-output
        .vanchor>:target~.vanchor-text{background-color:#0f4dc9}}</style><span class=\"vanchor\"
        about=\"#mwt11\" id=\"mwGw\"><span id=\"Validator\"></span><span class=\"vanchor-text\"><b>validators</b></span></span>
        (in <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Proof_of_work\"
        title=\"Proof of work\" id=\"mwHA\">proof-of-work</a> blockchains, this task
        is carried out by the <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Bitcoin_mining\"
        title=\"Bitcoin mining\" class=\"mw-redirect\" id=\"mwHQ\">miners</a>);<sup
        about=\"#mwt13\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928714_2-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928714\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928714-2\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Deirmentzoglou\"},\"2\":{\"wt\":\"Papakyriakopoulos\"},\"3\":{\"wt\":\"Patsakis\"},\"4\":{\"wt\":\"2019\"},\"p\":{\"wt\":\"28714\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928714-2\"
        id=\"mwHg\"><span class=\"mw-reflink-text\" id=\"mwHw\"><span class=\"cite-bracket\"
        id=\"mwIA\">[</span>2<span class=\"cite-bracket\" id=\"mwIQ\">]</span></span></a></sup>
        in most protocols, the validators receive a reward for doing so.<sup about=\"#mwt18\"
        class=\"mw-ref reference\" id=\"cite_ref-Saleh_3-0\" rel=\"dc:references\"
        typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Saleh\"},\"body\":{\"id\":\"mw-reference-text-cite_note-Saleh-3\"}}'><a
        href=\"#cite_note-Saleh-3\" id=\"mwIg\"><span class=\"mw-reflink-text\" id=\"mwIw\"><span
        class=\"cite-bracket\" id=\"mwJA\">[</span>3<span class=\"cite-bracket\" id=\"mwJQ\">]</span></span></a></sup>
        For the blockchain to remain secure, it must have a mechanism to prevent a
        malicious user or group from taking over a majority of validation. PoS accomplishes
        this by requiring that validators have some quantity of blockchain tokens,
        requiring potential attackers to acquire a large fraction of the tokens on
        the blockchain to mount an attack.<sup about=\"#mwt21\" class=\"mw-ref reference\"
        id=\"cite_ref-Ledger_4-0\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Ledger\"},\"body\":{\"id\":\"mw-reference-text-cite_note-Ledger-4\"}}'><a
        href=\"#cite_note-Ledger-4\" id=\"mwJg\"><span class=\"mw-reflink-text\" id=\"mwJw\"><span
        class=\"cite-bracket\" id=\"mwKA\">[</span>4<span class=\"cite-bracket\" id=\"mwKQ\">]</span></span></a></sup></p>\n\n<p
        id=\"mwKg\">Proof-of-work (PoW), another commonly used consensus mechanism,
        uses a validation of computational prowess to verify transactions, requiring
        a potential attacker to acquire a large fraction of the computational power
        of the validator network.<sup about=\"#mwt22\" class=\"mw-ref reference\"
        id=\"cite_ref-Ledger_4-1\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Ledger\"}}'><a href=\"#cite_note-Ledger-4\"
        id=\"mwKw\"><span class=\"mw-reflink-text\" id=\"mwLA\"><span class=\"cite-bracket\"
        id=\"mwLQ\">[</span>4<span class=\"cite-bracket\" id=\"mwLg\">]</span></span></a></sup>
        This incentivizes consuming huge quantities of energy. PoS is more energy-efficient.<sup
        about=\"#mwt25\" class=\"mw-ref reference\" id=\"cite_ref-Physics_5-0\" rel=\"dc:references\"
        typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Physics\"},\"body\":{\"id\":\"mw-reference-text-cite_note-Physics-5\"}}'><a
        href=\"#cite_note-Physics-5\" id=\"mwLw\"><span class=\"mw-reflink-text\"
        id=\"mwMA\"><span class=\"cite-bracket\" id=\"mwMQ\">[</span>5<span class=\"cite-bracket\"
        id=\"mwMg\">]</span></span></a></sup></p>\n\n<p id=\"mwMw\">Riposo and Gupta<sup
        about=\"#mwt28\" class=\"mw-ref reference\" id=\"cite_ref-Riposo_6-0\" rel=\"dc:references\"
        typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Riposo\"},\"body\":{\"id\":\"mw-reference-text-cite_note-Riposo-6\"}}'><a
        href=\"#cite_note-Riposo-6\" id=\"mwNA\"><span class=\"mw-reflink-text\" id=\"mwNQ\"><span
        class=\"cite-bracket\" id=\"mwNg\">[</span>6<span class=\"cite-bracket\" id=\"mwNw\">]</span></span></a></sup>
        showed that a formal PoS mathematical model can derive a metric for the expected
        gain of a staker. They introduced a forward-method model that computes staking
        rewards as the staking return per block-validation period and proved that
        the resulting interest equals the ratio of the average staking gain to the
        total staked coins. The model incorporates PoS-specific factors such as slashing
        (penalties for misbehavior) and Maximal Extractable Value (MEV), showing that
        slashing reduces expected rewards and that MEV links transaction-fee extraction
        to the average staking gain. In addition, the authors illustrated the model
        using <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Ethereum\"
        title=\"Ethereum\" id=\"mwOA\">Ethereum 2.0</a>, and presented an analogous
        derivation for PoW consensus.</p>\n\n<p id=\"mwOQ\">Early PoS implementations
        were plagued by a number of new attacks that exploited the unique vulnerabilities
        of the PoS protocols. Eventually, two dominant designs emerged: <i id=\"mwOg\"><a
        rel=\"mw:WikiLink\" href=\"#BFT-based_PoS\" class=\"mw-selflink-fragment\"
        id=\"mwOw\">Byzantine-fault-tolerance-based</a></i> and <i id=\"mwPA\"><a
        rel=\"mw:WikiLink\" href=\"#Chain-based_PoS\" class=\"mw-selflink-fragment\"
        id=\"mwPQ\">chain-based</a></i> approaches.<sup about=\"#mwt29\" class=\"mw-ref
        reference\" id=\"cite_ref-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928715_7-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928715\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928715-7\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Deirmentzoglou\"},\"2\":{\"wt\":\"Papakyriakopoulos\"},\"3\":{\"wt\":\"Patsakis\"},\"4\":{\"wt\":\"2019\"},\"p\":{\"wt\":\"28715\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928715-7\"
        id=\"mwPg\"><span class=\"mw-reflink-text\" id=\"mwPw\"><span class=\"cite-bracket\"
        id=\"mwQA\">[</span>7<span class=\"cite-bracket\" id=\"mwQQ\">]</span></span></a></sup>
        \ Bashir identifies three more <a rel=\"mw:WikiLink\" href=\"#Variants\" class=\"mw-selflink-fragment\"
        id=\"mwQg\">types of PoS</a>:<sup about=\"#mwt32\" class=\"mw-ref reference\"
        id=\"cite_ref-FOOTNOTEBashir2022334_8-0\" rel=\"dc:references\" typeof=\"mw:Transclusion
        mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEBashir2022334\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEBashir2022334-8\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Bashir\"},\"2\":{\"wt\":\"2022\"},\"p\":{\"wt\":\"334\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEBashir2022334-8\" id=\"mwQw\"><span class=\"mw-reflink-text\"
        id=\"mwRA\"><span class=\"cite-bracket\" id=\"mwRQ\">[</span>8<span class=\"cite-bracket\"
        id=\"mwRg\">]</span></span></a></sup></p>\n<ul id=\"mwRw\"><li id=\"mwSA\">committee-based
        PoS (a.k.a. <a rel=\"mw:WikiLink\" href=\"#Nominated_PoS_(NPoS)\" class=\"mw-selflink-fragment\"
        id=\"mwSQ\">nominated PoS</a>, NPoS);</li>\n<li id=\"mwSg\"><a rel=\"mw:WikiLink\"
        href=\"#Delegated_proof_of_stake_(DPoS)\" class=\"mw-selflink-fragment\" id=\"mwSw\">delegated
        proof of stake</a> (DPoS);</li>\n<li id=\"mwTA\"><a rel=\"mw:WikiLink\" href=\"#Liquid_proof_of_stake_(LPoS)\"
        class=\"mw-selflink-fragment\" id=\"mwTQ\">liquid proof of stake</a> (LPoS).</li></ul>\n\n</section><section
        data-mw-section-id=\"2\" id=\"mwTg\" aria-labelledby=\"Attacks\"><div class=\"mw-heading
        mw-heading2\"><h2 id=\"Attacks\">Attacks</h2></div>\n<p id=\"mwTw\">The additional
        vulnerabilities of PoS schemes are directly related to their advantage: a
        relatively low amount of calculations required when constructing a blockchain.<sup
        about=\"#mwt35\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928716_9-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928716\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928716-9\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Deirmentzoglou\"},\"2\":{\"wt\":\"Papakyriakopoulos\"},\"3\":{\"wt\":\"Patsakis\"},\"4\":{\"wt\":\"2019\"},\"p\":{\"wt\":\"28716\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928716-9\"
        id=\"mwUA\"><span class=\"mw-reflink-text\" id=\"mwUQ\"><span class=\"cite-bracket\"
        id=\"mwUg\">[</span>9<span class=\"cite-bracket\" id=\"mwUw\">]</span></span></a></sup></p>\n\n<section
        data-mw-section-id=\"3\" id=\"mwVA\" aria-labelledby=\"Long-range_attacks\"><div
        class=\"mw-heading mw-heading3\"><h3 id=\"Long-range_attacks\">Long-range
        attacks</h3></div>\n<p id=\"mwVQ\">The low amount of computing power involved
        allows a class of attacks that replace a non-negligible portion of the main
        blockchain with a hijacked version. These attacks are called in literature
        by different names, including <i id=\"mwVg\">Long-Range</i>, <i id=\"mwVw\">Alternative
        History</i>, <i id=\"mwWA\">Alternate History</i>, and <i id=\"mwWQ\">History
        Revision</i>, and are unfeasible in the PoW schemes due to the sheer volume
        of calculations required.<sup about=\"#mwt38\" class=\"mw-ref reference\"
        id=\"cite_ref-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928713_10-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928713\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928713-10\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Deirmentzoglou\"},\"2\":{\"wt\":\"Papakyriakopoulos\"},\"3\":{\"wt\":\"Patsakis\"},\"4\":{\"wt\":\"2019\"},\"p\":{\"wt\":\"28713\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928713-10\"
        id=\"mwWg\"><span class=\"mw-reflink-text\" id=\"mwWw\"><span class=\"cite-bracket\"
        id=\"mwXA\">[</span>10<span class=\"cite-bracket\" id=\"mwXQ\">]</span></span></a></sup>
        The early stages of a blockchain are much more malleable for rewriting, as
        they likely have much smaller group of stakeholders involved, simplifying
        the collusion. If the per-block and per-transaction rewards are offered, then
        the malicious group can, for example, redo the entire history and collect
        these rewards.<sup about=\"#mwt41\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEXiaoZhangLouHou202022_11-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEXiaoZhangLouHou202022\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEXiaoZhangLouHou202022-11\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Xiao\"},\"2\":{\"wt\":\"Zhang\"},\"3\":{\"wt\":\"Lou\"},\"4\":{\"wt\":\"Hou\"},\"5\":{\"wt\":\"2020\"},\"p\":{\"wt\":\"22\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEXiaoZhangLouHou202022-11\" id=\"mwXg\"><span class=\"mw-reflink-text\"
        id=\"mwXw\"><span class=\"cite-bracket\" id=\"mwYA\">[</span>11<span class=\"cite-bracket\"
        id=\"mwYQ\">]</span></span></a></sup></p>\n\n<p id=\"mwYg\">The classic \"Short-Range\"
        attack (<a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Bribery_attack?action=edit&amp;redlink=1\"
        title=\"Bribery attack (page does not exist)\" class=\"new\" typeof=\"mw:LocalizedAttrs\"
        id=\"mwYw\" data-mw-i18n='{\"title\":{\"lang\":\"x-page\",\"key\":\"red-link-title\",\"params\":[\"Bribery
        attack\"]}}'>bribery attack</a>) that rewrites just a small tail portion of
        the chain is also possible.<sup about=\"#mwt44\" class=\"mw-ref reference\"
        id=\"cite_ref-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928713_10-1\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928713\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928713-10\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Deirmentzoglou\"},\"2\":{\"wt\":\"Papakyriakopoulos\"},\"3\":{\"wt\":\"Patsakis\"},\"4\":{\"wt\":\"2019\"},\"p\":{\"wt\":\"28713\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928713-10\"
        id=\"mwZA\"><span class=\"mw-reflink-text\" id=\"mwZQ\"><span class=\"cite-bracket\"
        id=\"mwZg\">[</span>10<span class=\"cite-bracket\" id=\"mwZw\">]</span></span></a></sup></p>\n\n</section><section
        data-mw-section-id=\"4\" id=\"mwaA\" aria-labelledby=\"Nothing_at_stake\"><div
        class=\"mw-heading mw-heading3\"><h3 id=\"Nothing_at_stake\">Nothing at stake</h3></div>\n<p
        id=\"mwaQ\">Since validators do not need to spend a considerable amount of
        computing power (and thus money) on the process, they are prone to the <i
        id=\"mwag\">Nothing-at-Stake</i> attack: the participation in a successful
        validation increases the validator's earnings, so there is a built-in incentive
        for the validators to accept all chain forks submitted to them, thus increasing
        the chances of earning the validation fee. The PoS schemes enable low-cost
        creation of blockchain alternatives starting at any point in history (<i id=\"mwaw\">costless
        simulation</i>); submitting these forks to eager validators endangers the
        stability of the system.<sup about=\"#mwt47\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928716_9-1\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928716\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928716-9\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Deirmentzoglou\"},\"2\":{\"wt\":\"Papakyriakopoulos\"},\"3\":{\"wt\":\"Patsakis\"},\"4\":{\"wt\":\"2019\"},\"p\":{\"wt\":\"28716\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928716-9\"
        id=\"mwbA\"><span class=\"mw-reflink-text\" id=\"mwbQ\"><span class=\"cite-bracket\"
        id=\"mwbg\">[</span>9<span class=\"cite-bracket\" id=\"mwbw\">]</span></span></a></sup>
        If this situation persists, it can allow <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Double-spending\"
        title=\"Double-spending\" id=\"mwcA\">double-spending</a>, where a digital
        token can be spent more than once.<sup about=\"#mwt50\" class=\"mw-ref reference\"
        id=\"cite_ref-FOOTNOTEXiaoZhangLouHou202022_11-1\" rel=\"dc:references\" typeof=\"mw:Transclusion
        mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEXiaoZhangLouHou202022\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEXiaoZhangLouHou202022-11\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Xiao\"},\"2\":{\"wt\":\"Zhang\"},\"3\":{\"wt\":\"Lou\"},\"4\":{\"wt\":\"Hou\"},\"5\":{\"wt\":\"2020\"},\"p\":{\"wt\":\"22\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEXiaoZhangLouHou202022-11\" id=\"mwcQ\"><span class=\"mw-reflink-text\"
        id=\"mwcg\"><span class=\"cite-bracket\" id=\"mwcw\">[</span>11<span class=\"cite-bracket\"
        id=\"mwdA\">]</span></span></a></sup> This can be mitigated through penalizing
        validators who validate conflicting chains<sup about=\"#mwt53\" class=\"mw-ref
        reference\" id=\"cite_ref-FOOTNOTEXiaoZhangLouHou202022_11-2\" rel=\"dc:references\"
        typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEXiaoZhangLouHou202022\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEXiaoZhangLouHou202022-11\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Xiao\"},\"2\":{\"wt\":\"Zhang\"},\"3\":{\"wt\":\"Lou\"},\"4\":{\"wt\":\"Hou\"},\"5\":{\"wt\":\"2020\"},\"p\":{\"wt\":\"22\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEXiaoZhangLouHou202022-11\" id=\"mwdQ\"><span class=\"mw-reflink-text\"
        id=\"mwdg\"><span class=\"cite-bracket\" id=\"mwdw\">[</span>11<span class=\"cite-bracket\"
        id=\"mweA\">]</span></span></a></sup> (\"<a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Finality_(blockchain)\"
        title=\"Finality (blockchain)\" class=\"mw-redirect\" id=\"mweQ\">economic
        finality</a>\"<sup about=\"#mwt56\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928723_12-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928723\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928723-12\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Deirmentzoglou\"},\"2\":{\"wt\":\"Papakyriakopoulos\"},\"3\":{\"wt\":\"Patsakis\"},\"4\":{\"wt\":\"2019\"},\"p\":{\"wt\":\"28723\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928723-12\"
        id=\"mweg\"><span class=\"mw-reflink-text\" id=\"mwew\"><span class=\"cite-bracket\"
        id=\"mwfA\">[</span>12<span class=\"cite-bracket\" id=\"mwfQ\">]</span></span></a></sup>)
        or by structuring the rewards so that there is no economic incentive to create
        conflicts.<sup about=\"#mwt62\" class=\"mw-ref reference\" id=\"cite_ref-Saleh_3-1\"
        rel=\"dc:references\" typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Saleh\"}}'><a
        href=\"#cite_note-Saleh-3\" id=\"mwfg\"><span class=\"mw-reflink-text\" id=\"mwfw\"><span
        class=\"cite-bracket\" id=\"mwgA\">[</span>3<span class=\"cite-bracket\" id=\"mwgQ\">]</span></span></a></sup>
        <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Byzantine_Fault_Tolerance\"
        title=\"Byzantine Fault Tolerance\" class=\"mw-redirect\" id=\"mwgg\">Byzantine-fault-tolerance</a>-based
        PoS are generally considered robust against this threat (<a rel=\"mw:WikiLink\"
        href=\"#BFT-based_PoS\" class=\"mw-selflink-fragment\" id=\"mwgw\">see below</a>).<sup
        about=\"#mwt59\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928717_13-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928717\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928717-13\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Deirmentzoglou\"},\"2\":{\"wt\":\"Papakyriakopoulos\"},\"3\":{\"wt\":\"Patsakis\"},\"4\":{\"wt\":\"2019\"},\"p\":{\"wt\":\"28717\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEDeirmentzoglouPapakyriakopoulosPatsakis201928717-13\"
        id=\"mwhA\"><span class=\"mw-reflink-text\" id=\"mwhQ\"><span class=\"cite-bracket\"
        id=\"mwhg\">[</span>13<span class=\"cite-bracket\" id=\"mwhw\">]</span></span></a></sup></p>\n\n</section><section
        data-mw-section-id=\"5\" id=\"mwiA\" aria-labelledby=\"Bribery_attack\"><div
        class=\"mw-heading mw-heading3\"><h3 id=\"Bribery_attack\">Bribery attack</h3></div>\n<p
        id=\"mwiQ\">Bribery attack, where the attackers financially induce some validators
        to approve their fork of blockchain, is enhanced in PoS, as rewriting a large
        portion of history might enable the collusion of once-rich stakeholders that
        no longer hold significant amounts at stake to claim a necessary majority
        at some point back in time, and grow the alternative blockchain from there,
        an operation made possible by the low computing cost of adding blocks in the
        PoS scheme.<sup about=\"#mwt63\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEXiaoZhangLouHou202022_11-3\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEXiaoZhangLouHou202022\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEXiaoZhangLouHou202022-11\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Xiao\"},\"2\":{\"wt\":\"Zhang\"},\"3\":{\"wt\":\"Lou\"},\"4\":{\"wt\":\"Hou\"},\"5\":{\"wt\":\"2020\"},\"p\":{\"wt\":\"22\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEXiaoZhangLouHou202022-11\" id=\"mwig\"><span class=\"mw-reflink-text\"
        id=\"mwiw\"><span class=\"cite-bracket\" id=\"mwjA\">[</span>11<span class=\"cite-bracket\"
        id=\"mwjQ\">]</span></span></a></sup></p>\n\n</section></section><section
        data-mw-section-id=\"6\" id=\"mwjg\" aria-labelledby=\"Variants\"><div class=\"mw-heading
        mw-heading2\"><h2 id=\"Variants\">Variants</h2></div>\n\n<section data-mw-section-id=\"7\"
        id=\"mwjw\" aria-labelledby=\"Chain-based_PoS\"><div class=\"mw-heading mw-heading3\"><h3
        id=\"Chain-based_PoS\">Chain-based PoS</h3></div>\n<p id=\"mwkA\">This is
        essentially a modification of the PoW scheme, where the competition is based
        not on applying brute force to solving the identical puzzle in the smallest
        amount of time, but instead on varying the difficulty of the puzzle depending
        on the stake of the participant; the puzzle is solved if on a tick of the
        clock (|| is concatenation):</p>\n<dl id=\"mwkQ\"><dd id=\"mwkg\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"
        class=\"mwe-math-element mwe-math-element-inline\" typeof=\"mw:Extension/math\"
        about=\"#mwt66\" id=\"mwkw\" data-mw='{\"name\":\"math\",\"attrs\":{},\"body\":{\"extsrc\":\"\\\\text{Hash}(\\\\text{ProposedNewBlock}
        \\\\mathbin{||} \\\\text{ClockTime}) &lt; \\\\text{target} \\\\times \\\\text{StakeValue}\"}}'><mrow
        data-mjx-texclass=\"ORD\"><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mrow
        data-mjx-texclass=\"ORD\"><mtext>Hash</mtext></mrow><mo stretchy=\"false\">(</mo><mrow
        data-mjx-texclass=\"ORD\"><mtext>ProposedNewBlock</mtext></mrow><mrow data-mjx-texclass=\"BIN\"><mrow
        data-mjx-texclass=\"ORD\"><mo stretchy=\"false\">|</mo><mo stretchy=\"false\">|</mo></mrow></mrow><mrow
        data-mjx-texclass=\"ORD\"><mtext>ClockTime</mtext></mrow><mo stretchy=\"false\">)</mo><mo>&lt;</mo><mrow
        data-mjx-texclass=\"ORD\"><mtext>target</mtext></mrow><mo stretchy=\"false\">\xD7</mo><mrow
        data-mjx-texclass=\"ORD\"><mtext>StakeValue</mtext></mrow></mstyle></mrow></math></dd></dl>\n<p
        id=\"mwlA\">The smaller amount of calculations required for solving the puzzle
        for high-value stakeholders helps to avoid excessive hardware.<sup about=\"#mwt67\"
        class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEBashir2022335_14-0\" rel=\"dc:references\"
        typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEBashir2022335\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEBashir2022335-14\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Bashir\"},\"2\":{\"wt\":\"2022\"},\"p\":{\"wt\":\"335\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEBashir2022335-14\" id=\"mwlQ\"><span class=\"mw-reflink-text\"
        id=\"mwlg\"><span class=\"cite-bracket\" id=\"mwlw\">[</span>14<span class=\"cite-bracket\"
        id=\"mwmA\">]</span></span></a></sup></p>\n\n</section><section data-mw-section-id=\"8\"
        id=\"mwmQ\" aria-labelledby=\"Nominated_PoS_(NPoS)\"><div class=\"mw-heading
        mw-heading3\"><h3 id=\"Nominated_PoS_(NPoS)\"><span id=\"Nominated_PoS_.28NPoS.29\"
        typeof=\"mw:FallbackId\"></span>Nominated PoS (NPoS) <span class=\"anchor\"
        id=\"npos\" about=\"#mwt70\" typeof=\"mw:Transclusion\" data-mw='{\"parts\":[{\"template\":{\"target\":{\"wt\":\"anchor\",\"href\":\"./Template:Anchor\"},\"params\":{\"1\":{\"wt\":\"npos\"}},\"i\":0}}]}'></span></h3></div>\n<p
        id=\"mwmg\">Also known as \"committee-based\", this scheme involves an election
        of a committee of validators using a <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Verifiable_random_function\"
        title=\"Verifiable random function\" id=\"mwmw\">verifiable random function</a>
        with probabilities of being elected higher with higher stake. Validators then
        randomly take turns producing blocks. NPoS is utilized by <a rel=\"mw:WikiLink\"
        href=\"https://en.wikipedia.org/wiki/Ouroboros_(protocol)\" title=\"Ouroboros
        (protocol)\" id=\"mwnA\">Ouroboros Praos</a> and <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Polkadot_(cryptocurrency)\"
        title=\"Polkadot (cryptocurrency)\" class=\"mw-redirect\" id=\"mwnQ\">BABE</a><sup
        about=\"#mwt71\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEBashir2022335\u2013336_15-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEBashir2022335\u2013336\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEBashir2022335\u2013336-15\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Bashir\"},\"2\":{\"wt\":\"2022\"},\"pp\":{\"wt\":\"335-336\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEBashir2022335\u2013336-15\" id=\"mwng\"><span class=\"mw-reflink-text\"
        id=\"mwnw\"><span class=\"cite-bracket\" id=\"mwoA\">[</span>15<span class=\"cite-bracket\"
        id=\"mwoQ\">]</span></span></a></sup>. </p>\n\n<p id=\"mwog\">In addition,
        <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Polkadot_(blockchain_platform)\"
        title=\"Polkadot (blockchain platform)\" id=\"mwow\">Polkadot</a> uses a deterministic
        variant of NPoS, where the validators are elected using a variant of <a rel=\"mw:WikiLink\"
        href=\"https://en.wikipedia.org/wiki/Phragmen's_voting_rules\" title=\"Phragmen's
        voting rules\" class=\"mw-redirect\" id=\"mwpA\">Phragmen's voting rule</a>.<sup
        about=\"#mwt77\" class=\"mw-ref reference\" id=\"cite_ref-16\" rel=\"dc:references\"
        typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-16\"}}'><a
        href=\"#cite_note-16\" id=\"mwpQ\"><span class=\"mw-reflink-text\" id=\"mwpg\"><span
        class=\"cite-bracket\" id=\"mwpw\">[</span>16<span class=\"cite-bracket\"
        id=\"mwqA\">]</span></span></a></sup></p>\n\n</section><section data-mw-section-id=\"9\"
        id=\"mwqQ\" aria-labelledby=\"BFT-based_PoS\"><div class=\"mw-heading mw-heading3\"><h3
        id=\"BFT-based_PoS\">BFT-based PoS</h3></div>\n<span class=\"mw-empty-elt\"
        about=\"#mwt78\" typeof=\"mw:Transclusion\" id=\"mwqg\" data-mw='{\"parts\":[{\"template\":{\"target\":{\"wt\":\"main\",\"href\":\"./Template:Main\"},\"params\":{\"1\":{\"wt\":\"Byzantine
        fault tolerance\"}},\"i\":0}}]}'><link rel=\"mw-deduplicated-inline-style\"
        href=\"mw-data:TemplateStyles:r1368532237\" about=\"#mwt79\" typeof=\"mw:Extension/templatestyles\"
        data-mw='{\"name\":\"templatestyles\",\"attrs\":{\"src\":\"Module:Hatnote/styles.css\"},\"body\":{\"extsrc\":\"\"}}'/></span><div
        role=\"note\" class=\"hatnote navigation-not-searchable\" about=\"#mwt78\"
        id=\"mwqw\">Main article: <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Byzantine_fault_tolerance\"
        title=\"Byzantine fault tolerance\" class=\"mw-redirect\">Byzantine fault
        tolerance</a></div>\n<p id=\"mwrA\">The outline of the BFT PoS \"epoch\" (adding
        a block to the chain) is as follows:<sup about=\"#mwt80\" class=\"mw-ref reference\"
        id=\"cite_ref-FOOTNOTEBashir2022336_17-0\" rel=\"dc:references\" typeof=\"mw:Transclusion
        mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEBashir2022336\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEBashir2022336-17\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Bashir\"},\"2\":{\"wt\":\"2022\"},\"p\":{\"wt\":\"336\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEBashir2022336-17\" id=\"mwrQ\"><span class=\"mw-reflink-text\"
        id=\"mwrg\"><span class=\"cite-bracket\" id=\"mwrw\">[</span>17<span class=\"cite-bracket\"
        id=\"mwsA\">]</span></span></a></sup></p>\n<ol id=\"mwsQ\"><li id=\"mwsg\">A
        \"proposer\" with a \"proposed block\" is randomly selected by adding it to
        the temporary pool used to select just one consensual block;</li>\n<li id=\"mwsw\">The
        other participants, validators, obtain the pool, validate, and vote for one;</li>\n<li
        id=\"mwtA\">The BFT consensus is used to finalize the most-voted block.</li></ol>\n<p
        id=\"mwtQ\">The scheme works as long as no more than a third of validators
        are dishonest. BFT schemes are used in Tendermint and Casper FFG.<sup about=\"#mwt83\"
        class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEBashir2022336_17-1\" rel=\"dc:references\"
        typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEBashir2022336\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEBashir2022336-17\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Bashir\"},\"2\":{\"wt\":\"2022\"},\"p\":{\"wt\":\"336\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEBashir2022336-17\" id=\"mwtg\"><span class=\"mw-reflink-text\"
        id=\"mwtw\"><span class=\"cite-bracket\" id=\"mwuA\">[</span>17<span class=\"cite-bracket\"
        id=\"mwuQ\">]</span></span></a></sup></p>\n\n</section><section data-mw-section-id=\"10\"
        id=\"mwug\" aria-labelledby=\"Delegated_proof_of_stake_(DPoS)\"><div class=\"mw-heading
        mw-heading3\"><h3 id=\"Delegated_proof_of_stake_(DPoS)\"><span id=\"Delegated_proof_of_stake_.28DPoS.29\"
        typeof=\"mw:FallbackId\"></span>Delegated proof of stake (DPoS)</h3></div>\n<p
        id=\"mwuw\">Proof of stake delegated systems use a two-stage process: first,<sup
        about=\"#mwt86\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEBashir2022337_18-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEBashir2022337\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEBashir2022337-18\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Bashir\"},\"2\":{\"wt\":\"2022\"},\"p\":{\"wt\":\"337\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEBashir2022337-18\" id=\"mwvA\"><span class=\"mw-reflink-text\"
        id=\"mwvQ\"><span class=\"cite-bracket\" id=\"mwvg\">[</span>18<span class=\"cite-bracket\"
        id=\"mwvw\">]</span></span></a></sup> the stakeholders elect a validation
        committee,<sup about=\"#mwt89\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEXiaoZhangLouHou202021_19-0\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEXiaoZhangLouHou202021\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEXiaoZhangLouHou202021-19\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Xiao\"},\"2\":{\"wt\":\"Zhang\"},\"3\":{\"wt\":\"Lou\"},\"4\":{\"wt\":\"Hou\"},\"5\":{\"wt\":\"2020\"},\"p\":{\"wt\":\"21\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEXiaoZhangLouHou202021-19\" id=\"mwwA\"><span class=\"mw-reflink-text\"
        id=\"mwwQ\"><span class=\"cite-bracket\" id=\"mwwg\">[</span>19<span class=\"cite-bracket\"
        id=\"mwww\">]</span></span></a></sup> a.k.a. <i id=\"mwxA\">witnesses</i>,
        by voting proportionally to their stakes, then the witnesses take turns in
        a round-robin fashion to propose new blocks that are then voted upon by the
        witnesses, usually in the BFT-like fashion. Since there are fewer validators
        in the DPoS than in many other PoS schemes, the consensus can be established
        faster. The scheme is used in many chains, including EOS, Lisk, Tron.<sup
        about=\"#mwt92\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEBashir2022337_18-1\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEBashir2022337\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEBashir2022337-18\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Bashir\"},\"2\":{\"wt\":\"2022\"},\"p\":{\"wt\":\"337\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEBashir2022337-18\" id=\"mwxQ\"><span class=\"mw-reflink-text\"
        id=\"mwxg\"><span class=\"cite-bracket\" id=\"mwxw\">[</span>18<span class=\"cite-bracket\"
        id=\"mwyA\">]</span></span></a></sup></p>\n\n</section><section data-mw-section-id=\"11\"
        id=\"mwyQ\" aria-labelledby=\"Liquid_proof_of_stake_(LPoS)\"><div class=\"mw-heading
        mw-heading3\"><h3 id=\"Liquid_proof_of_stake_(LPoS)\"><span id=\"Liquid_proof_of_stake_.28LPoS.29\"
        typeof=\"mw:FallbackId\"></span>Liquid proof of stake (LPoS)</h3></div>\n<p
        id=\"mwyg\">In the liquid PoS anyone with a stake can declare themselves a
        validator, but for the small holders it makes sense to delegate their voting
        rights instead to larger players in exchange for some benefits (like periodic
        payouts). A market is established where the validators compete on the fees,
        reputation, and other factors. Token holders are free to switch their support
        to another validator at any time. LPoS is used in <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Tezos\"
        title=\"Tezos\" id=\"mwyw\">Tezos</a>.<sup about=\"#mwt95\" class=\"mw-ref
        reference\" id=\"cite_ref-FOOTNOTEBashir2022337-338_20-0\" rel=\"dc:references\"
        typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEBashir2022337-338\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEBashir2022337-338-20\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Bashir\"},\"2\":{\"wt\":\"2022\"},\"p\":{\"wt\":\"337-338\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEBashir2022337-338-20\" id=\"mwzA\"><span class=\"mw-reflink-text\"
        id=\"mwzQ\"><span class=\"cite-bracket\" id=\"mwzg\">[</span>20<span class=\"cite-bracket\"
        id=\"mwzw\">]</span></span></a></sup></p>\n\n</section><section data-mw-section-id=\"12\"
        id=\"mw0A\" aria-labelledby=\"'Stake'_definition\"><div class=\"mw-heading
        mw-heading3\"><h3 id=\"'Stake'_definition\"><span id=\".27Stake.27_definition\"
        typeof=\"mw:FallbackId\"></span>'Stake' definition</h3></div>\n<p id=\"mw0Q\">The
        exact definition of \"stake\" varies from implementation to implementation.
        For instance, some cryptocurrencies use the concept of \"coin age\", the product
        of the number of tokens with the amount of time that a single user has held
        them, rather than merely the number of tokens, to define a validator's stake.<sup
        about=\"#mwt101\" class=\"mw-ref reference\" id=\"cite_ref-Ledger_4-2\" rel=\"dc:references\"
        typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Ledger\"}}'><a
        href=\"#cite_note-Ledger-4\" id=\"mw0g\"><span class=\"mw-reflink-text\" id=\"mw0w\"><span
        class=\"cite-bracket\" id=\"mw1A\">[</span>4<span class=\"cite-bracket\" id=\"mw1Q\">]</span></span></a></sup><sup
        about=\"#mwt98\" class=\"mw-ref reference\" id=\"cite_ref-FOOTNOTEBashir2022335_14-1\"
        rel=\"dc:references\" typeof=\"mw:Transclusion mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"group\":\"\",\"name\":\"FOOTNOTEBashir2022335\"},\"body\":{\"id\":\"mw-reference-text-cite_note-FOOTNOTEBashir2022335-14\"},\"parts\":[{\"template\":{\"target\":{\"wt\":\"sfn\",\"href\":\"./Template:Sfn\"},\"params\":{\"1\":{\"wt\":\"Bashir\"},\"2\":{\"wt\":\"2022\"},\"p\":{\"wt\":\"335\"}},\"i\":0}}]}'><a
        href=\"#cite_note-FOOTNOTEBashir2022335-14\" id=\"mw1g\"><span class=\"mw-reflink-text\"
        id=\"mw1w\"><span class=\"cite-bracket\" id=\"mw2A\">[</span>14<span class=\"cite-bracket\"
        id=\"mw2Q\">]</span></span></a></sup></p>\n\n</section></section><section
        data-mw-section-id=\"13\" id=\"mw2g\" aria-labelledby=\"Implementations\"><div
        class=\"mw-heading mw-heading2\"><h2 id=\"Implementations\">Implementations</h2></div>\n\n<p
        id=\"mw2w\">The first functioning implementation of a proof-of-stake cryptocurrency
        was <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Peercoin\"
        title=\"Peercoin\" id=\"mw3A\">Peercoin</a>, introduced in 2012.<sup about=\"#mwt103\"
        class=\"mw-ref reference\" id=\"cite_ref-Saleh_3-2\" rel=\"dc:references\"
        typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Saleh\"}}'><a
        href=\"#cite_note-Saleh-3\" id=\"mw3Q\"><span class=\"mw-reflink-text\" id=\"mw3g\"><span
        class=\"cite-bracket\" id=\"mw3w\">[</span>3<span class=\"cite-bracket\" id=\"mw4A\">]</span></span></a></sup>
        Other cryptocurrencies, such as Blackcoin, <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Nxt\"
        title=\"Nxt\" id=\"mw4Q\">Nxt</a>, <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Cardano_(cryptocurrency_platform)\"
        title=\"Cardano (cryptocurrency platform)\" class=\"mw-redirect\" id=\"mw4g\">Cardano</a>,
        and <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Algorand\"
        title=\"Algorand\" id=\"mw4w\">Algorand</a> followed.<sup about=\"#mwt104\"
        class=\"mw-ref reference\" id=\"cite_ref-Saleh_3-3\" rel=\"dc:references\"
        typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Saleh\"}}'><a
        href=\"#cite_note-Saleh-3\" id=\"mw5A\"><span class=\"mw-reflink-text\" id=\"mw5Q\"><span
        class=\"cite-bracket\" id=\"mw5g\">[</span>3<span class=\"cite-bracket\" id=\"mw5w\">]</span></span></a></sup>
        However, <span about=\"#mwt102\" typeof=\"mw:Transclusion\" id=\"mw6A\" data-mw='{\"parts\":[{\"template\":{\"target\":{\"wt\":\"As
        of\",\"href\":\"./Template:As_of\"},\"params\":{\"1\":{\"wt\":\"2017\"},\"lc\":{\"wt\":\"on\"}},\"i\":0}}]}'>as
        of 2017</span><sup class=\"plainlinks noexcerpt noprint asof-tag update\"
        style=\"display:none;\" about=\"#mwt102\"><a rel=\"mw:ExtLink\" href=\"https://en.wikipedia.org/w/index.php?title=Proof_of_stake&amp;action=edit\"
        class=\"external text\" data-mw-original-href=\"//en.wikipedia.org/w/index.php?title=Proof_of_stake&amp;action=edit\"><span
        typeof=\"mw:Entity\">[</span>update<span typeof=\"mw:Entity\">]</span></a></sup><span
        typeof=\"mw:Nowiki\" about=\"#mwt102\"></span><link rel=\"mw:PageProp/Category\"
        href=\"./Category:Articles_containing_potentially_dated_statements_from_2017\"
        about=\"#mwt102\"/><link rel=\"mw:PageProp/Category\" href=\"./Category:All_articles_containing_potentially_dated_statements\"
        about=\"#mwt102\" id=\"mw6Q\"/>, PoS cryptocurrencies were still not as widely
        used as proof-of-work cryptocurrencies.<sup about=\"#mwt107\" class=\"mw-ref
        reference\" id=\"cite_ref-LNCS-Securing_21-0\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"LNCS-Securing\"},\"body\":{\"id\":\"mw-reference-text-cite_note-LNCS-Securing-21\"}}'><a
        href=\"#cite_note-LNCS-Securing-21\" id=\"mw6g\"><span class=\"mw-reflink-text\"
        id=\"mw6w\"><span class=\"cite-bracket\" id=\"mw7A\">[</span>21<span class=\"cite-bracket\"
        id=\"mw7Q\">]</span></span></a></sup><sup about=\"#mwt110\" class=\"mw-ref
        reference\" id=\"cite_ref-22\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-22\"}}'><a
        href=\"#cite_note-22\" id=\"mw7g\"><span class=\"mw-reflink-text\" id=\"mw7w\"><span
        class=\"cite-bracket\" id=\"mw8A\">[</span>22<span class=\"cite-bracket\"
        id=\"mw8Q\">]</span></span></a></sup><sup about=\"#mwt113\" class=\"mw-ref
        reference\" id=\"cite_ref-23\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-23\"}}'><a
        href=\"#cite_note-23\" id=\"mw8g\"><span class=\"mw-reflink-text\" id=\"mw8w\"><span
        class=\"cite-bracket\" id=\"mw9A\">[</span>23<span class=\"cite-bracket\"
        id=\"mw9Q\">]</span></span></a></sup></p>\n\n<p id=\"mw9g\">In September 2022,
        <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Ethereum\" title=\"Ethereum\"
        id=\"mw9w\">Ethereum</a>, the second-largest cryptocurrency, switched from
        PoW to a PoS consensus mechanism,<sup about=\"#mwt116\" class=\"mw-ref reference\"
        id=\"cite_ref-24\" rel=\"dc:references\" typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-24\"}}'><a
        href=\"#cite_note-24\" id=\"mw-A\"><span class=\"mw-reflink-text\" id=\"mw-Q\"><span
        class=\"cite-bracket\" id=\"mw-g\">[</span>24<span class=\"cite-bracket\"
        id=\"mw-w\">]</span></span></a></sup> after several proposals<sup about=\"#mwt119\"
        class=\"mw-ref reference\" id=\"cite_ref-NewScientist_25-0\" rel=\"dc:references\"
        typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"NewScientist\"},\"body\":{\"id\":\"mw-reference-text-cite_note-NewScientist-25\"}}'><a
        href=\"#cite_note-NewScientist-25\" id=\"mw_A\"><span class=\"mw-reflink-text\"
        id=\"mw_Q\"><span class=\"cite-bracket\" id=\"mw_g\">[</span>25<span class=\"cite-bracket\"
        id=\"mw_w\">]</span></span></a></sup><sup about=\"#mwt120\" class=\"mw-ref
        reference\" id=\"cite_ref-Lau20210527_26-0\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Lau20210527\"}}'><a href=\"#cite_note-Lau20210527-26\"
        id=\"mwAQA\"><span class=\"mw-reflink-text\" id=\"mwAQE\"><span class=\"cite-bracket\"
        id=\"mwAQI\">[</span>26<span class=\"cite-bracket\" id=\"mwAQM\">]</span></span></a></sup>
        and some delays.<sup about=\"#mwt123\" class=\"mw-ref reference\" id=\"cite_ref-Lau20210527_26-1\"
        rel=\"dc:references\" typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"Lau20210527\"},\"body\":{\"id\":\"mw-reference-text-cite_note-Lau20210527-26\"}}'><a
        href=\"#cite_note-Lau20210527-26\" id=\"mwAQQ\"><span class=\"mw-reflink-text\"
        id=\"mwAQU\"><span class=\"cite-bracket\" id=\"mwAQY\">[</span>26<span class=\"cite-bracket\"
        id=\"mwAQc\">]</span></span></a></sup><sup about=\"#mwt126\" class=\"mw-ref
        reference\" id=\"cite_ref-27\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-27\"}}'><a
        href=\"#cite_note-27\" id=\"mwAQg\"><span class=\"mw-reflink-text\" id=\"mwAQk\"><span
        class=\"cite-bracket\" id=\"mwAQo\">[</span>27<span class=\"cite-bracket\"
        id=\"mwAQs\">]</span></span></a></sup></p>\n\n</section><section data-mw-section-id=\"14\"
        id=\"mwAQw\" aria-labelledby=\"Concerns\"><div class=\"mw-heading mw-heading2\"><h2
        id=\"Concerns\">Concerns</h2></div>\n\n<section data-mw-section-id=\"15\"
        id=\"mwAQ0\" aria-labelledby=\"Centralization\"><div class=\"mw-heading mw-heading3\"><h3
        id=\"Centralization\">Centralization</h3></div>\n<p id=\"mwAQ4\">Critics have
        argued that proof of stake may lead cryptocurrency blockchains to become more
        centralized than proof of work because the system favors users who hold larger
        amounts of cryptocurrency, which could give those users greater influence
        over the management and direction of the blockchain.<sup about=\"#mwt129\"
        class=\"mw-ref reference\" id=\"cite_ref-28\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-28\"}}'><a
        href=\"#cite_note-28\" id=\"mwAQ8\"><span class=\"mw-reflink-text\" id=\"mwARA\"><span
        class=\"cite-bracket\" id=\"mwARE\">[</span>28<span class=\"cite-bracket\"
        id=\"mwARI\">]</span></span></a></sup><sup about=\"#mwt132\" class=\"mw-ref
        reference\" id=\"cite_ref-29\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-29\"}}'><a
        href=\"#cite_note-29\" id=\"mwARM\"><span class=\"mw-reflink-text\" id=\"mwARQ\"><span
        class=\"cite-bracket\" id=\"mwARU\">[</span>29<span class=\"cite-bracket\"
        id=\"mwARY\">]</span></span></a></sup></p>\n\n</section><section data-mw-section-id=\"16\"
        id=\"mwARc\" aria-labelledby=\"Legal_status_in_US\"><div class=\"mw-heading
        mw-heading3\"><h3 id=\"Legal_status_in_US\">Legal status in US</h3></div>\n<p
        id=\"mwARg\">US regulators have argued over the legal status of the proof-of-stake
        model, with the <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/U.S._Securities_and_Exchange_Commission\"
        title=\"U.S. Securities and Exchange Commission\" class=\"mw-redirect\" id=\"mwARk\">Securities
        and Exchange Commission</a> claiming that staking rewards are the equivalent
        of interest, so coins such as ether and ada are financial <a rel=\"mw:WikiLink\"
        href=\"https://en.wikipedia.org/wiki/Security_(finance)\" title=\"Security
        (finance)\" id=\"mwARo\">securities</a>.<sup about=\"#mwt135\" class=\"mw-ref
        reference\" id=\"cite_ref-30\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-30\"}}'><a
        href=\"#cite_note-30\" id=\"mwARs\"><span class=\"mw-reflink-text\" id=\"mwARw\"><span
        class=\"cite-bracket\" id=\"mwAR0\">[</span>30<span class=\"cite-bracket\"
        id=\"mwAR4\">]</span></span></a></sup> However, in 2024, the SEC sidestepped
        the question by recognising <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Exchange-traded_fund#Cryptocurrency_ETFs\"
        title=\"Exchange-traded fund\" id=\"mwAR8\">Ethereum market funds</a> on condition
        that they did not stake their coins. The level of staking of ether at 27%
        of total supply was low compared with Cardano (66%) and Solana (63%). However,
        not staking their tokens meant that the funds were losing about 3% of potential
        returns a year.<sup about=\"#mwt138\" class=\"mw-ref reference\" id=\"cite_ref-31\"
        rel=\"dc:references\" typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-31\"}}'><a
        href=\"#cite_note-31\" id=\"mwASA\"><span class=\"mw-reflink-text\" id=\"mwASE\"><span
        class=\"cite-bracket\" id=\"mwASI\">[</span>31<span class=\"cite-bracket\"
        id=\"mwASM\">]</span></span></a></sup></p>\n\n</section></section><section
        data-mw-section-id=\"17\" id=\"mwASQ\" aria-labelledby=\"Energy_consumption\"><div
        class=\"mw-heading mw-heading2\"><h2 id=\"Energy_consumption\">Energy consumption</h2></div>\n<p
        id=\"mwASU\">In 2021, a study by the <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/University_of_London\"
        title=\"University of London\" id=\"mwASY\">University of London</a> found
        that in general the <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Energy_consumption\"
        title=\"Energy consumption\" id=\"mwASc\">energy consumption</a> of the proof-of-work-based
        <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Bitcoin\" title=\"Bitcoin\"
        id=\"mwASg\">Bitcoin</a> was about a thousand times higher than that of the
        highest-consuming proof-of-stake system that was studied even under the most
        favorable conditions and that most proof-of-stake systems cause less energy
        consumption in most configurations.<sup about=\"#mwt141\" class=\"mw-ref reference\"
        id=\"cite_ref-32\" rel=\"dc:references\" typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-32\"}}'><a
        href=\"#cite_note-32\" id=\"mwASk\"><span class=\"mw-reflink-text\" id=\"mwASo\"><span
        class=\"cite-bracket\" id=\"mwASs\">[</span>32<span class=\"cite-bracket\"
        id=\"mwASw\">]</span></span></a></sup></p>  \n\n<p id=\"mwAS0\">In January
        2022, <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Erik_Thed\xE9en\"
        title=\"Erik Thed\xE9en\" id=\"mwAS4\">Erik Thed\xE9en</a>, the vice-chair
        of the <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/European_Securities_and_Markets_Authority\"
        title=\"European Securities and Markets Authority\" id=\"mwAS8\">European
        Securities and Markets Authority</a>, called on the EU to ban the PoW model
        in favor of PoS because of the latter's lower energy consumption.<sup about=\"#mwt144\"
        class=\"mw-ref reference\" id=\"cite_ref-33\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-33\"}}'><a
        href=\"#cite_note-33\" id=\"mwATA\"><span class=\"mw-reflink-text\" id=\"mwATE\"><span
        class=\"cite-bracket\" id=\"mwATI\">[</span>33<span class=\"cite-bracket\"
        id=\"mwATM\">]</span></span></a></sup></p>\n\n<p id=\"mwATQ\">Ethereum's switch
        to proof-of-stake was estimated to have cut its energy use by over 99%.<sup
        about=\"#mwt147\" class=\"mw-ref reference\" id=\"cite_ref-34\" rel=\"dc:references\"
        typeof=\"mw:Extension/ref\" data-mw='{\"name\":\"ref\",\"attrs\":{},\"body\":{\"id\":\"mw-reference-text-cite_note-34\"}}'><a
        href=\"#cite_note-34\" id=\"mwATU\"><span class=\"mw-reflink-text\" id=\"mwATY\"><span
        class=\"cite-bracket\" id=\"mwATc\">[</span>34<span class=\"cite-bracket\"
        id=\"mwATg\">]</span></span></a></sup><sup about=\"#mwt150\" class=\"mw-ref
        reference\" id=\"cite_ref-EnergyRevamp_35-0\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"
        data-mw='{\"name\":\"ref\",\"attrs\":{\"name\":\"EnergyRevamp\"},\"body\":{\"id\":\"mw-reference-text-cite_note-EnergyRevamp-35\"}}'><a
        href=\"#cite_note-EnergyRevamp-35\" id=\"mwATk\"><span class=\"mw-reflink-text\"
        id=\"mwATo\"><span class=\"cite-bracket\" id=\"mwATs\">[</span>35<span class=\"cite-bracket\"
        id=\"mwATw\">]</span></span></a></sup></p>\n\n</section><section data-mw-section-id=\"18\"
        id=\"mwAT0\" aria-labelledby=\"References\"><div class=\"mw-heading mw-heading2\"><h2
