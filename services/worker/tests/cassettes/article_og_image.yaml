        lucide-maximize2 lucide-maximize-2 icon-noB79L\"><polyline points=\"15 3 21
        3 21 9\"></polyline><polyline points=\"9 21 3 21 3 15\"></polyline><line x1=\"21\"
        x2=\"14\" y1=\"3\" y2=\"10\"></line><line x1=\"3\" x2=\"10\" y1=\"21\" y2=\"14\"></line></svg></button></div></div></div></a></figure></div><p>A
        key lesson Netflix engineers learnt during this implementation was about scoping.
        If you feed an LLM a complete, raw stack trace without boundaries, it can
        get distracted. Often, the model spends a lot of reasoning tokens analyzing
        internal JVM garbage collection pauses, low-level Linux kernel syscalls, or
        even 3rd party open-source framework overhead.</p><p>Application developers
        don\u2019t have any control over such internal library concerns or OS routines.
        Therefore, you need to provide the agent with strict package prefix rules.
        This way, the model can ignore generic platform noise and focus on tracing
        only the specific application code.</p><h2 class=\"header-anchor-post\">The
        Problems Netflix Found in Production<div class=\"pencraft pc-display-flex
        pc-alignItems-center pc-position-absolute pc-reset header-anchor-parent\"><div
        class=\"pencraft pc-display-contents pc-reset pubTheme-yiXxQA\"><div class=\"pencraft
        pc-reset header-anchor offset-top\" id=\"\xA7the-problems-netflix-found-in-production\"></div><button
        class=\"pencraft pc-reset pencraft iconButton-mq_Et5 iconButtonBase-dJGHgN
        buttonBase-GK1x3M buttonStyle-r7yGCK size_sm-G3LciD priority_secondary-S63h9o\"
        tabindex=\"0\" type=\"button\" data-href=\"https://blog.bytebytego.com/i/222755655/the-problems-netflix-found-in-production\"><svg
        xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0
        0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"
        stroke-linejoin=\"round\" class=\"lucide lucide-link\"><path d=\"M10 13a5
        5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"></path><path d=\"M14
        11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"></path></svg></button></div></div></h2><p>When
        the Netflix engineering team deployed the profiling pipeline against its production
        service, the agent found 4 major categories of performance bugs.</p><p>First
        was an algorithmic bottleneck that wasted 8.8% of CPU resources. The agent
        found an aggregation method using Java Streams where an immutable map was
        updated inside a reduction step.</p><div class=\"pencraft pc-display-flex
        pc-flexDirection-column pc-gap-8 pc-padding-20 pc-reset bg-primary-j62Gac
        outline-detail-Yl5oYx pc-borderRadius-sm sizing-border-box-LGXObM container-KfNFl_\"><div
        class=\"pencraft pc-display-flex pc-flexDirection-column pc-reset overflow-auto-CUDsxo
        scrollBar-hidden-k6ztKz code-G_k53t\" data-line-numbers=\"true\"><pre><code>//
        Anti-pattern: O(N^2) accumulation inside stream reduction\nstream().reduce(ImmutableMap.of(),
        (acc, val) -&gt; {\n    return ImmutableMap.builder()\n        .putAll(acc)
        // Copies every existing entry on every single step\n        .put(val)\n        .build();\n});</code></pre></div></div><p>Since
        putAll(acc) copies every existing key-value pair on every step, you need to
        copy elements again and again to build a map of size N. This results in quadratic
        complexity.</p><p>The agent modified the quadratic builder reduction with
        a linear collection approach.</p><div class=\"pencraft pc-display-flex pc-flexDirection-column
        pc-gap-8 pc-padding-20 pc-reset bg-primary-j62Gac outline-detail-Yl5oYx pc-borderRadius-sm
        sizing-border-box-LGXObM container-KfNFl_\"><div class=\"pencraft pc-display-flex
        pc-flexDirection-column pc-reset overflow-auto-CUDsxo scrollBar-hidden-k6ztKz
        code-G_k53t\" data-line-numbers=\"true\"><pre><code>// Optimized: O(N) single-pass
        collection\nstream()\n    .flatMap(e -&gt; e.entrySet().stream())\n    .collect(toMap(Entry::getKey,
        Entry::getValue));</code></pre></div></div><p>The second category was about
        regular expressions on the hot path. In a service, the developer had to sanitize
        incoming request strings by modifying characters that weren\u2019t allowed.
        The earlier implementation ran a raw regular expression substitution on every
        request.</p><div class=\"pencraft pc-display-flex pc-flexDirection-column
        pc-gap-8 pc-padding-20 pc-reset bg-primary-j62Gac outline-detail-Yl5oYx pc-borderRadius-sm
        sizing-border-box-LGXObM container-KfNFl_\"><div class=\"pencraft pc-display-flex
        pc-flexDirection-column pc-reset overflow-auto-CUDsxo scrollBar-hidden-k6ztKz
        code-G_k53t\" data-line-numbers=\"true\"><pre><code>// Anti-pattern: Dynamic
        regex evaluation per request\nString sanitized = input.replaceAll(\u201D[^a-zA-Z0-9.-]\u201D,
        \u201C_\u201D);</code></pre></div></div><p>As you might know, evaluating regular
        expressions involves parsing and state-machine transitions. This logic on
        high-volume traffic used 46% of the service\u2019s CPU time.</p><p>The agent
        replaced the regex evaluation with a pre-computed lookup table that checked
        characters by index. The execution got 22 times faster.</p><p>The next category
        was related to unnecessary object allocation that caused OOM crashes. A service
        frequently checked whether incoming data payloads contained specific metadata
        fields. To perform the check, the code was creating a new, heavy HashSet on
        every incoming call.</p><p>However, the underlying data object already had
        an internal lookup method available. Also, instantiating millions of such
        objects consumed 47% of the service\u2019s total heap collections.</p><p>The
        agent fixed this issue by removing the redundant object instantiations and
        modified the code to reuse the cached method.</p><p>The next category was
        around library misuse. For example, the discovery involved metric telemetry
        instrumentation. One of the services tracked operations by looking up a counter
        from a metric registry on every single call.</p><div class=\"pencraft pc-display-flex
        pc-flexDirection-column pc-gap-8 pc-padding-20 pc-reset bg-primary-j62Gac
        outline-detail-Yl5oYx pc-borderRadius-sm sizing-border-box-LGXObM container-KfNFl_\"><div
        class=\"pencraft pc-display-flex pc-flexDirection-column pc-reset overflow-auto-CUDsxo
        scrollBar-hidden-k6ztKz code-G_k53t\" data-line-numbers=\"true\"><pre><code>//
        Anti-pattern: Looking up metric instances on every function execution\nMetrics.counter(\u201Drequest.count\u201D).increment();</code></pre></div></div><p>When
        the query was sent to the registry, it needed dictionary lookups and internal
        synchronization locks. The profiler showed that the work consumed 66% of the
        CPU, whereas the actual business logic used only 0.3%.</p><p>The agent fixed
        it by caching the metric counter reference at the time of class initialization.
        Also, it found that the same issue was happening across three independent
        services.</p><h2 class=\"header-anchor-post\">Safety, Verification, and Trust
        Architecture<div class=\"pencraft pc-display-flex pc-alignItems-center pc-position-absolute
        pc-reset header-anchor-parent\"><div class=\"pencraft pc-display-contents
        pc-reset pubTheme-yiXxQA\"><div class=\"pencraft pc-reset header-anchor offset-top\"
        id=\"\xA7safety-verification-and-trust-architecture\"></div><button class=\"pencraft
        pc-reset pencraft iconButton-mq_Et5 iconButtonBase-dJGHgN buttonBase-GK1x3M
        buttonStyle-r7yGCK size_sm-G3LciD priority_secondary-S63h9o\" tabindex=\"0\"
        type=\"button\" data-href=\"https://blog.bytebytego.com/i/222755655/safety-verification-and-trust-architecture\"><svg
        xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0
        0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"
        stroke-linejoin=\"round\" class=\"lucide lucide-link\"><path d=\"M10 13a5
        5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"></path><path d=\"M14
        11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"></path></svg></button></div></div></h2><p>If
        you have an AI agent that can optimize code, it\u2019s quite dangerous if
        the changes are applied without automatic verification. If the agent makes
        a change that breaks business logic, it\u2019s worse than inefficient code.</p><p>To
        prevent regressions, the agentic pipeline uses the standard SDLC.</p><p>In
        stage 1, you verify the logic. Before you move any code, the agent\u2019s
        branch must pass all existing unit, integration, and contract tests. This
        is to make sure that the changes made by the change don\u2019t alter basic
        inputs, outputs, or handling of edge cases.</p><p>In stage 2, you have the
        canary deployment. If the tests pass, the pipeline spins up a canary deployment
        in production. The canary instance gets a portion of the traffic. It runs
        side-by-side with an identical baseline instance that runs the original code.</p><p>Stage
        3 is about generating the observability report. The platform collects hard
        telemetry metrics over a big enough window. Some metrics are relative CPU
        utilization, median latency, P99 latency, and memory allocation rates. They
        also don\u2019t use any AI model to check the canary results.</p><p>In stage
        4, you have the final engineering decision. When the canary version shows
        a good level of performance improvement with zero increase in error rates,
        the system opens a PR. This PR goes for human review. It includes the code
        change, the original flame graph, and the canary report. The final decision
        on deploying the change to production is taken by the human developer.</p><h2
        class=\"header-anchor-post\">Shifting Left<div class=\"pencraft pc-display-flex
        pc-alignItems-center pc-position-absolute pc-reset header-anchor-parent\"><div
        class=\"pencraft pc-display-contents pc-reset pubTheme-yiXxQA\"><div class=\"pencraft
        pc-reset header-anchor offset-top\" id=\"\xA7shifting-left\"></div><button
        class=\"pencraft pc-reset pencraft iconButton-mq_Et5 iconButtonBase-dJGHgN
        buttonBase-GK1x3M buttonStyle-r7yGCK size_sm-G3LciD priority_secondary-S63h9o\"
        tabindex=\"0\" type=\"button\" data-href=\"https://blog.bytebytego.com/i/222755655/shifting-left\"><svg
        xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0
        0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"
        stroke-linejoin=\"round\" class=\"lucide lucide-link\"><path d=\"M10 13a5
        5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"></path><path d=\"M14
        11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"></path></svg></button></div></div></h2><p>Automated
        production profiling is quite effective. But if you just rely on it, you end
        up exposing several limitations.</p><p>By the time an agent finds an anti-pattern
        in production, you\u2019ve already paid for days or weeks of wasted compute
        capacity.</p><p>Second, developers are anyway cautious about changing a running
        service. If you have a service that handles production traffic without crashing,
        the developers hesitate to just make changes for the sake of optimization.</p><p>Lastly,
        multiple teams often make the exact same mistakes when it comes to patterns.
        If you run a super-expensive agent on 10 different services just to find the
        same problem, it\u2019s not very efficient.</p><p>These limitations led to
        Netflix making the decision to shift performance checks left into the early
        development cycle. Also, they wanted the agents to share their findings across
        the entire engineering organization.</p><p>However, as you might know, language
        models are stateless. Every time you send a prompt to an LLM, it starts with
        a clean slate. It might no retain any memory of the bug it found some time
        back in another service. The Netflix engineering team built a Pattern Catalog
        to make the models achieve persistence. This was done by pairing a stateless
        LLM with a stateful catalog. Or a shared memory across the fleet.</p><p>The
        Pattern Catalog was built around 4 key principles.</p><ul><li><p>First, it
        has to be centralized and serve as the single source of truth for all engineering
        teams. This way, no two teams end up debugging the same issues.</p></li><li><p>The
        second principle is that the same catalog entries should work across distinct
        environments. For example, offline profiling, CI/CD pull request checks, and
        local development tools.</p></li><li><p>Third, you need to format entries
        so that an automation script can easily inject them into an LLM\u2019s system
        prompt.</p></li><li><p>Lastly, the contents of the catalog should be reviewable
        by human developers.</p></li></ul><p>To implement the Pattern Catalog, the
        Netflix engineering team used a simple Git repository filled with plain Markdown
        files. They didn\u2019t use vector databases or complex knowledge stores.
        The idea was borrowed from the \u201CLLM-wiki\u201D concept popularized by
        Andrej Karpathy.</p><p>By using a standard Git repository, the developers
        got several advantages. For one, developers can diff changes, open pull requests,
        and use git features to find out why an entry was created. It also scales
        well to 100s of detailed performance rules without the need for complex search
        infrastructure. Lastly, plain Markdown is easy for both humans and language
        models to read without translation layers.</p><h2 class=\"header-anchor-post\">How
        Netflix Catches Problems Early<div class=\"pencraft pc-display-flex pc-alignItems-center
        pc-position-absolute pc-reset header-anchor-parent\"><div class=\"pencraft
        pc-display-contents pc-reset pubTheme-yiXxQA\"><div class=\"pencraft pc-reset
        header-anchor offset-top\" id=\"\xA7how-netflix-catches-problems-early\"></div><button
        class=\"pencraft pc-reset pencraft iconButton-mq_Et5 iconButtonBase-dJGHgN
        buttonBase-GK1x3M buttonStyle-r7yGCK size_sm-G3LciD priority_secondary-S63h9o\"
        tabindex=\"0\" type=\"button\" data-href=\"https://blog.bytebytego.com/i/222755655/how-netflix-catches-problems-early\"><svg
        xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0
        0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"
        stroke-linejoin=\"round\" class=\"lucide lucide-link\"><path d=\"M10 13a5
        5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"></path><path d=\"M14
        11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"></path></svg></button></div></div></h2><p>With
        the Pattern Catalog in place, Netflix can handle performance engineering via
        two paths. Reactive and Proactive.</p><div class=\"captioned-image-container\"><figure><a
        class=\"image-link image2 is-viewable-img can-restack\" target=\"_blank\"
        href=\"https://substackcdn.com/image/fetch/$s_!zz8C!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7b9b4997-595e-4a9f-9b67-fffaba0aca9c_3592x2272.png\"
        data-component-name=\"Image2ToDOM\"><div class=\"image2-inset\"><picture><source
