[project]
name = "archie-api"
version = "0.1.0"
description = "The HTTP API the Archie phone app syncs with."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "archie-shared",
  "archie-db",
]

[project.scripts]
archie-launch = "archie_api.launch:main"

[tool.uv.sources]
archie-shared = { workspace = true }
archie-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archie_api"]
