        class=\\\"icon-noB79L\\\">\\u003cg>\\u003cpath d=\\\"M2.53001 7.81595C3.49179
        4.73911 6.43281 2.5 9.91173 2.5C13.1684 2.5 15.9537 4.46214 17.0852 7.23684L17.6179
        8.67647M17.6179 8.67647L18.5002 4.26471M17.6179 8.67647L13.6473 6.91176M17.4995
        12.1841C16.5378 15.2609 13.5967 17.5 10.1178 17.5C6.86118 17.5 4.07589 15.5379
        2.94432 12.7632L2.41165 11.3235M2.41165 11.3235L1.5293 15.7353M2.41165 11.3235L6.38224
        13.0882\\\">\\u003c/path>\\u003c/g>\\u003c/svg>\\u003c/button>\\u003cbutton
        tabindex=\\\"0\\\" type=\\\"button\\\" class=\\\"pencraft pc-reset pencraft
        icon-container view-image buttonBase-GK1x3M\\\">\\u003csvg xmlns=\\\"http://www.w3.org/2000/svg\\\"
        width=\\\"20\\\" height=\\\"20\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\"
        stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\"
        stroke-linejoin=\\\"round\\\" class=\\\"lucide lucide-maximize2 lucide-maximize-2
        icon-noB79L\\\">\\u003cpolyline points=\\\"15 3 21 3 21 9\\\">\\u003c/polyline>\\u003cpolyline
        points=\\\"9 21 3 21 3 15\\\">\\u003c/polyline>\\u003cline x1=\\\"21\\\" x2=\\\"14\\\"
        y1=\\\"3\\\" y2=\\\"10\\\">\\u003c/line>\\u003cline x1=\\\"3\\\" x2=\\\"10\\\"
        y1=\\\"21\\\" y2=\\\"14\\\">\\u003c/line>\\u003c/svg>\\u003c/button>\\u003c/div>\\u003c/div>\\u003c/div>\\u003c/a>\\u003c/figure>\\u003c/div>\\u003cp>A
        key lesson Netflix engineers learnt during this implementation was about scoping.
        If you feed an LLM a complete, raw stack trace without boundaries, it can
        get distracted. Often, the model spends a lot of reasoning tokens analyzing
        internal JVM garbage collection pauses, low-level Linux kernel syscalls, or
        even 3rd party open-source framework overhead.\\u003c/p>\\u003cp>Application
        developers don\u2019t have any control over such internal library concerns
        or OS routines. Therefore, you need to provide the agent with strict package
        prefix rules. This way, the model can ignore generic platform noise and focus
        on tracing only the specific application code.\\u003c/p>\\u003ch2>The Problems
        Netflix Found in Production\\u003c/h2>\\u003cp>When the Netflix engineering
        team deployed the profiling pipeline against its production service, the agent
        found 4 major categories of performance bugs.\\u003c/p>\\u003cp>First was
        an algorithmic bottleneck that wasted 8.8% of CPU resources. The agent found
        an aggregation method using Java Streams where an immutable map was updated
        inside a reduction step.\\u003c/p>\\u003cdiv class=\\\"highlighted_code_block\\\"
        data-attrs=\\\"{&quot;language&quot;:&quot;plaintext&quot;,&quot;nodeId&quot;:&quot;d63f2803-e9e6-4387-8704-107f424e97ce&quot;}\\\"
        data-component-name=\\\"HighlightedCodeBlockToDOM\\\">\\u003cpre class=\\\"shiki\\\">\\u003ccode
        class=\\\"language-plaintext\\\">// Anti-pattern: O(N^2) accumulation inside
        stream reduction\\nstream().reduce(ImmutableMap.of(), (acc, val) -&gt; {\\n
        \   return ImmutableMap.builder()\\n        .putAll(acc) // Copies every existing
        entry on every single step\\n        .put(val)\\n        .build();\\n});\\u003c/code>\\u003c/pre>\\u003c/div>\\u003cp>Since
        putAll(acc) copies every existing key-value pair on every step, you need to
        copy elements again and again to build a map of size N. This results in quadratic
        complexity.\\u003c/p>\\u003cp>The agent modified the quadratic builder reduction
        with a linear collection approach.\\u003c/p>\\u003cdiv class=\\\"highlighted_code_block\\\"
        data-attrs=\\\"{&quot;language&quot;:&quot;plaintext&quot;,&quot;nodeId&quot;:&quot;8b69c361-428c-4324-a99a-462ed700093f&quot;}\\\"
        data-component-name=\\\"HighlightedCodeBlockToDOM\\\">\\u003cpre class=\\\"shiki\\\">\\u003ccode
        class=\\\"language-plaintext\\\">// Optimized: O(N) single-pass collection\\nstream()\\n
        \   .flatMap(e -&gt; e.entrySet().stream())\\n    .collect(toMap(Entry::getKey,
        Entry::getValue));\\u003c/code>\\u003c/pre>\\u003c/div>\\u003cp>The second
        category was about regular expressions on the hot path. In a service, the
        developer had to sanitize incoming request strings by modifying characters
        that weren\u2019t allowed. The earlier implementation ran a raw regular expression
        substitution on every request.\\u003c/p>\\u003cdiv class=\\\"highlighted_code_block\\\"
        data-attrs=\\\"{&quot;language&quot;:&quot;plaintext&quot;,&quot;nodeId&quot;:&quot;875d0767-aa20-4bf2-a681-1095943ac5ae&quot;}\\\"
        data-component-name=\\\"HighlightedCodeBlockToDOM\\\">\\u003cpre class=\\\"shiki\\\">\\u003ccode
        class=\\\"language-plaintext\\\">// Anti-pattern: Dynamic regex evaluation
        per request\\nString sanitized = input.replaceAll(\u201D[^a-zA-Z0-9.-]\u201D,
        \u201C_\u201D);\\u003c/code>\\u003c/pre>\\u003c/div>\\u003cp>As you might
        know, evaluating regular expressions involves parsing and state-machine transitions.
        This logic on high-volume traffic used 46% of the service\u2019s CPU time.\\u003c/p>\\u003cp>The
        agent replaced the regex evaluation with a pre-computed lookup table that
        checked characters by index. The execution got 22 times faster.\\u003c/p>\\u003cp>The
        next category was related to unnecessary object allocation that caused OOM
        crashes. A service frequently checked whether incoming data payloads contained
        specific metadata fields. To perform the check, the code was creating a new,
        heavy HashSet on every incoming call.\\u003c/p>\\u003cp>However, the underlying
        data object already had an internal lookup method available. Also, instantiating
        millions of such objects consumed 47% of the service\u2019s total heap collections.\\u003c/p>\\u003cp>The
        agent fixed this issue by removing the redundant object instantiations and
        modified the code to reuse the cached method.\\u003c/p>\\u003cp>The next category
        was around library misuse. For example, the discovery involved metric telemetry
        instrumentation. One of the services tracked operations by looking up a counter
        from a metric registry on every single call.\\u003c/p>\\u003cdiv class=\\\"highlighted_code_block\\\"
        data-attrs=\\\"{&quot;language&quot;:&quot;plaintext&quot;,&quot;nodeId&quot;:&quot;be7bea9a-ecba-4bfb-9c79-25372495862f&quot;}\\\"
        data-component-name=\\\"HighlightedCodeBlockToDOM\\\">\\u003cpre class=\\\"shiki\\\">\\u003ccode
        class=\\\"language-plaintext\\\">// Anti-pattern: Looking up metric instances
        on every function execution\\nMetrics.counter(\u201Drequest.count\u201D).increment();\\u003c/code>\\u003c/pre>\\u003c/div>\\u003cp>When
        the query was sent to the registry, it needed dictionary lookups and internal
        synchronization locks. The profiler showed that the work consumed 66% of the
        CPU, whereas the actual business logic used only 0.3%.\\u003c/p>\\u003cp>The
        agent fixed it by caching the metric counter reference at the time of class
        initialization. Also, it found that the same issue was happening across three
        independent services.\\u003c/p>\\u003ch2>Safety, Verification, and Trust Architecture\\u003c/h2>\\u003cp>If
        you have an AI agent that can optimize code, it\u2019s quite dangerous if
        the changes are applied without automatic verification. If the agent makes
        a change that breaks business logic, it\u2019s worse than inefficient code.\\u003c/p>\\u003cp>To
        prevent regressions, the agentic pipeline uses the standard SDLC.\\u003c/p>\\u003cp>In
        stage 1, you verify the logic. Before you move any code, the agent\u2019s
        branch must pass all existing unit, integration, and contract tests. This
        is to make sure that the changes made by the change don\u2019t alter basic
        inputs, outputs, or handling of edge cases.\\u003c/p>\\u003cp>In stage 2,
        you have the canary deployment. If the tests pass, the pipeline spins up a
        canary deployment in production. The canary instance gets a portion of the
        traffic. It runs side-by-side with an identical baseline instance that runs
        the original code.\\u003c/p>\\u003cp>Stage 3 is about generating the observability
        report. The platform collects hard telemetry metrics over a big enough window.
        Some metrics are relative CPU utilization, median latency, P99 latency, and
        memory allocation rates. They also don\u2019t use any AI model to check the
        canary results.\\u003c/p>\\u003cp>In stage 4, you have the final engineering
        decision. When the canary version shows a good level of performance improvement
        with zero increase in error rates, the system opens a PR. This PR goes for
        human review. It includes the code change, the original flame graph, and the
        canary report. The final decision on deploying the change to production is
        taken by the human developer.\\u003c/p>\\u003ch2>Shifting Left\\u003c/h2>\\u003cp>Automated
        production profiling is quite effective. But if you just rely on it, you end
        up exposing several limitations.\\u003c/p>\\u003cp>By the time an agent finds
        an anti-pattern in production, you\u2019ve already paid for days or weeks
        of wasted compute capacity.\\u003c/p>\\u003cp>Second, developers are anyway
        cautious about changing a running service. If you have a service that handles
        production traffic without crashing, the developers hesitate to just make
        changes for the sake of optimization.\\u003c/p>\\u003cp>Lastly, multiple teams
        often make the exact same mistakes when it comes to patterns. If you run a
        super-expensive agent on 10 different services just to find the same problem,
        it\u2019s not very efficient.\\u003c/p>\\u003cp>These limitations led to Netflix
        making the decision to shift performance checks left into the early development
        cycle. Also, they wanted the agents to share their findings across the entire
        engineering organization.\\u003c/p>\\u003cp>However, as you might know, language
        models are stateless. Every time you send a prompt to an LLM, it starts with
        a clean slate. It might no retain any memory of the bug it found some time
        back in another service. The Netflix engineering team built a Pattern Catalog
        to make the models achieve persistence. This was done by pairing a stateless
        LLM with a stateful catalog. Or a shared memory across the fleet.\\u003c/p>\\u003cp>The
        Pattern Catalog was built around 4 key principles.\\u003c/p>\\u003cul>\\u003cli>\\u003cp>First,
        it has to be centralized and serve as the single source of truth for all engineering
        teams. This way, no two teams end up debugging the same issues.\\u003c/p>\\u003c/li>\\u003cli>\\u003cp>The
        second principle is that the same catalog entries should work across distinct
        environments. For example, offline profiling, CI/CD pull request checks, and
        local development tools.\\u003c/p>\\u003c/li>\\u003cli>\\u003cp>Third, you
        need to format entries so that an automation script can easily inject them
        into an LLM\u2019s system prompt.\\u003c/p>\\u003c/li>\\u003cli>\\u003cp>Lastly,
        the contents of the catalog should be reviewable by human developers.\\u003c/p>\\u003c/li>\\u003c/ul>\\u003cp>To
        implement the Pattern Catalog, the Netflix engineering team used a simple
        Git repository filled with plain Markdown files. They didn\u2019t use vector
        databases or complex knowledge stores. The idea was borrowed from the \u201CLLM-wiki\u201D
        concept popularized by Andrej Karpathy.\\u003c/p>\\u003cp>By using a standard
        Git repository, the developers got several advantages. For one, developers
        can diff changes, open pull requests, and use git features to find out why
        an entry was created. It also scales well to 100s of detailed performance
        rules without the need for complex search infrastructure. Lastly, plain Markdown
        is easy for both humans and language models to read without translation layers.\\u003c/p>\\u003ch2>How
        Netflix Catches Problems Early\\u003c/h2>\\u003cp>With the Pattern Catalog
        in place, Netflix can handle performance engineering via two paths. Reactive
        and Proactive.\\u003c/p>\\u003cdiv class=\\\"captioned-image-container\\\">\\u003cfigure>\\u003ca
        class=\\\"image-link image2 is-viewable-img\\\" target=\\\"_blank\\\" href=\\\"https://substackcdn.com/image/fetch/$s_!zz8C!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7b9b4997-595e-4a9f-9b67-fffaba0aca9c_3592x2272.png\\\"
        data-component-name=\\\"Image2ToDOM\\\">\\u003cdiv class=\\\"image2-inset\\\">\\u003cpicture>\\u003csource
