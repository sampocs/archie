<title>Archie Chat Edits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: a wall of numbered phone mocks (wrapping to one column on a phone), each with a short caption under it. */
:root {
  --page: #E9E6DE; --pink: #1C1B18; --pink2: #5E5B54;
  --bg: #F4F2EC; --surface: #FFFFFF; --ink: #0E0E0C; --ink2: #55534D; --ink3: #9A978F; --line: #E8E6DF; --press: #EFEDE6;
  --chrome: #1C1B18; --onChrome: #FFFFFF; --macro: #3F7262; --ai: #6A5A9C; --history: #8E5468; --web: #3D6690;
  --sans: "Geist", -apple-system, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #121110; --pink: #F1EFE9; --pink2: #A9A59B; color-scheme: dark } }
:root[data-theme="dark"] { --page: #121110; --pink: #F1EFE9; --pink2: #A9A59B; color-scheme: dark }
body { background: var(--page); color: var(--pink); font-family: var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
header { max-width: 1280px; margin: 0 auto 26px; display: grid; gap: 6px; }
h1 { font-size: 28px; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--pink2); max-width: 70ch; line-height: 1.5; font-size: 15px; }
.row { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px 26px; }
figure { margin: 0; display: grid; gap: 12px; align-content: start; }
figcaption { display: grid; gap: 4px; min-width: 0; }
figcaption b { font-size: 15px; }
figcaption span { color: var(--pink2); font-size: 13.5px; line-height: 1.45; }
.n { font: 500 11px var(--mono); letter-spacing: .08em; color: var(--pink2); }
.phone { width: 100%; max-width: 300px; aspect-ratio: 300 / 640; background: var(--bg); color: var(--ink); border-radius: 38px; border: 8px solid #0b0b0a;
  position: relative; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.18); font-size: 13px; }
.screen { position: absolute; inset: 0; padding: 38px 14px 84px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.big { font-size: 28px; font-weight: 700; letter-spacing: -.03em; }
.nav { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink2); }
.nav b { color: var(--ink); font-size: 14px; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { background: var(--press); border-radius: 12px; padding: 9px 12px; color: var(--ink); }
.search i { color: var(--ink3); font-style: normal; }
.card { background: var(--surface); border-radius: 16px; overflow: hidden; }
.item { padding: 11px 12px; display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 10px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.tile { width: 36px; height: 36px; border-radius: 9px; color: #fff; display: grid; place-items: center; font-weight: 600; }
.k { font: 600 9.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.t { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.s { color: var(--ink3); font-size: 11.5px; }
.q { color: var(--ink2); font-size: 12px; line-height: 1.4; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.q mark { background: color-mix(in srgb, var(--macro) 16%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.ts { font: 500 10.5px var(--mono); color: var(--ink2); background: var(--press); border-radius: 6px; padding: 1px 5px; }
.chat { padding: 11px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 3px; }
.chat:last-child { border-bottom: 0; }
.chat .top { display: flex; justify-content: space-between; gap: 8px; }
.chat .when { color: var(--ink3); font-size: 11px; white-space: nowrap; }
.composer { position: absolute; left: 10px; right: 10px; bottom: 84px; background: var(--surface); border-radius: 22px; padding: 8px 8px 8px 14px;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.05); }
.composer .ph { flex: 1; color: var(--ink3); }
.globe { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--press); color: var(--ink2); font-size: 14px; }
.globe.on { background: var(--web); color: #fff; }
.send { width: 30px; height: 30px; border-radius: 50%; background: var(--chrome); color: var(--onChrome); display: grid; place-items: center; font-weight: 700; }
.mine { align-self: flex-end; max-width: 82%; background: var(--press); border-radius: 16px 16px 4px 16px; padding: 9px 12px; line-height: 1.4; }
.answer { display: grid; gap: 12px; }
.sec { display: grid; gap: 5px; }
.lab { font: 600 9.5px var(--sans); letter-spacing: .09em; text-transform: uppercase; }
.lab.lib { color: var(--macro); } .lab.bg { color: var(--ink3); } .lab.web { color: var(--web); }
.sec p { margin: 0; line-height: 1.5; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font-size: 11px; color: var(--ink2); white-space: nowrap; }
.chip.web { color: var(--web); }
.acts { display: flex; gap: 8px; }
.btn2 { background: var(--press); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 12px; color: var(--ink); }
.searching { color: var(--ink3); font-size: 12px; }
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; border-top: 1px solid var(--line); background: var(--bg);
  display: grid; grid-template-columns: repeat(5, 1fr); padding-top: 9px; font-size: 9.5px; color: var(--ink3); text-align: center; }
.tabbar .on { color: var(--ink); font-weight: 600; }
.dot { width: 22px; height: 22px; margin: 0 auto 3px; border-radius: 6px; border: 1.6px solid currentColor; }
.on .dot { background: currentColor; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 16px 28px;
  display: grid; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,.18); }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 4px; }
.field { display: grid; gap: 4px; }
.field label { font: 500 10px var(--mono); letter-spacing: .07em; color: var(--ink3); text-transform: uppercase; }
.field div { background: var(--bg); border-radius: 10px; padding: 9px 11px; line-height: 1.4; }
.primary { background: var(--chrome); color: var(--onChrome); border-radius: 14px; padding: 11px; text-align: center; font-weight: 600; }
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.28); }
.about { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; color: var(--ink2); }
.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 132px; background: var(--chrome); color: var(--onChrome); border-radius: 999px; padding: 7px 14px; font-size: 12px; white-space: nowrap; }
.read { line-height: 1.55; color: var(--ink); }
.read h4 { margin: 0 0 4px; font: 600 9.5px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); }
</style>
<style>
:root { --got: #3F7262; --missed: #B04A3C; }
.prop { background: var(--surface); border-radius: 14px; padding: 11px 12px; display: grid; gap: 7px; box-shadow: 0 0 0 1px var(--line); }
.prop .kick { font: 600 9.5px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); }
.prop .tt { font-weight: 600; font-size: 13px; }
.prop .desc { color: var(--ink2); font-size: 12px; }
.diff { background: var(--bg); border-radius: 9px; padding: 8px 9px; display: grid; gap: 3px; font-size: 11.5px; line-height: 1.4; }
.diff .h { font: 600 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); margin-top: 3px; }
.diff .del { color: var(--missed); text-decoration: line-through; }
.diff .add { color: var(--got); }
.diff .fold { color: var(--ink3); font-style: italic; }
.btns { display: flex; gap: 8px; align-items: center; }
.btnp { background: var(--chrome); color: var(--onChrome); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 12px; }
.state { color: var(--got); font-weight: 600; font-size: 12px; }
.link { color: var(--ink2); font-weight: 600; font-size: 12px; text-decoration: underline; }
.vrow { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.vrow:last-child { border-bottom: 0; }
.vrow .top { display: flex; justify-content: space-between; }
.cur { font: 600 9.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--got); }
.menu .chat { font-size: 13.5px; }
</style>
<header>
  <span class="n">ARCHIE · EDITS THROUGH CHAT</span>
  <h1>Edit through chat</h1>
  <p>Ask Archie to change a summary, primer, take or card. It proposes the change in the chat; nothing changes until you tap Apply, and every change is a new version you can undo or restore.</p>
</header>
<div class="row">
  <figure>
    <div class="phone"><div class="screen">
      <div class="nav"><span>‹ Ask</span><b>Trim the Fed summary</b><span></span></div>
      <div class="mine">Remove the bullet about the 2022 balance sheet from that summary</div>
      <div class="answer"><div class="sec"><span class="lab bg">Background</span><p>Here's the change. The other three ideas stay as they are.</p></div>
      <div class="prop"><span class="kick">Edit · Summary</span><span class="tt">How the Fed Actually Creates Money ›</span><span class="desc">Remove the key idea about the 2022 balance sheet</span>
        <div class="diff"><span class="h">Key ideas</span><span>The Fed creates reserves when it buys bonds.</span><span class="del">− The balance sheet peaked near $9T in 2022.</span><span class="fold">⋯ 2 unchanged</span></div>
        <div class="btns"><span class="btnp">Apply</span><span class="btn2">Discard</span></div></div></div>
    </div>
    <div class="composer"><span class="ph">Ask a follow-up</span><span class="globe">🌐</span><span class="send">↑</span></div>
    <nav class="tabbar"><span><span class="dot"></span>Library</span><span><span class="dot"></span>Review</span><span><span class="dot"></span>Today</span><span class="on"><span class="dot"></span>Ask</span><span><span class="dot"></span>Settings</span></nav></div>
    <figcaption><span class="n">01 · A PROPOSED EDIT</span><b>Shown as a change, not applied yet</b><span>Removed lines are struck through in red, added lines in green, untouched parts folded. Tap the title to open the item.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen">
      <div class="nav"><span>‹ Ask</span><b>Trim the Fed summary</b><span></span></div>
      <div class="mine">Remove the bullet about the 2022 balance sheet from that summary</div>
      <div class="answer"><div class="prop"><span class="kick">Edit · Summary</span><span class="tt">How the Fed Actually Creates Money ›</span><span class="desc">Remove the key idea about the 2022 balance sheet</span>
        <div class="diff"><span class="h">Key ideas</span><span>The Fed creates reserves when it buys bonds.</span><span class="del">− The balance sheet peaked near $9T in 2022.</span><span class="fold">⋯ 2 unchanged</span></div>
        <div class="btns"><span class="state">✓ Applied</span><span class="link">Undo</span></div></div></div>
    </div>
    <div class="composer"><span class="ph">Ask a follow-up</span><span class="globe">🌐</span><span class="send">↑</span></div>
    <div class="toast">Summary updated</div>
    <nav class="tabbar"><span><span class="dot"></span>Library</span><span><span class="dot"></span>Review</span><span><span class="dot"></span>Today</span><span class="on"><span class="dot"></span>Ask</span><span><span class="dot"></span>Settings</span></nav></div>
    <figcaption><span class="n">02 · APPLIED</span><b>Applied, with Undo right there</b><span>Undo puts the previous version back (as a new version). Other end states: "Undone", "Discarded", "Replaced by a newer suggestion", or "Changed since you asked. Ask again to redo it."</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen">
      <div class="nav"><span>‹ Ask</span><b>Fix the QE card</b><span></span></div>
      <div class="mine">The QE card's answer is too long, make it one line</div>
      <div class="answer"><div class="prop"><span class="kick">Edit · Card</span><span class="tt">What does QE do to bank reserves? ›</span><span class="desc">Shorten the answer to one line</span>
        <div class="diff"><span>Question: What does QE do to bank reserves?</span><span class="del">− Answer: When the Fed buys bonds from banks it pays with newly created reserves, so reserves rise; the bonds sit on its balance sheet until they mature or are sold.</span><span class="add">+ Answer: It raises them: the Fed pays for bonds with new reserves.</span></div>
        <div class="btns"><span class="btnp">Apply</span><span class="btn2">Discard</span></div></div></div>
    </div>
    <div class="composer"><span class="ph">Ask a follow-up</span><span class="globe">🌐</span><span class="send">↑</span></div>
    <nav class="tabbar"><span><span class="dot"></span>Library</span><span><span class="dot"></span>Review</span><span><span class="dot"></span>Today</span><span class="on"><span class="dot"></span>Ask</span><span><span class="dot"></span>Settings</span></nav></div>
    <figcaption><span class="n">03 · A CARD EDIT</span><b>Cards work the same way</b><span>Archie finds the card from what you're talking about. Applying keeps the card's review schedule; the old wording stays in its versions.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen">
      <div class="nav"><span>‹ Library</span><span>☆ ···</span></div>
      <div class="k" style="color:var(--macro)">Macro · Podcast</div>
      <div class="t" style="font-size:20px">How the Fed Actually Creates Money</div>
      <div class="s">Odd Lots · 48m</div>
      <div class="read"><h4>Gist</h4>The Fed doesn't print money; it creates reserves…</div>
    </div>
    <div class="dim"></div>
    <div class="sheet"><div class="grab"></div>
      <div class="card menu" style="background:var(--bg)">
        <div class="chat"><span>Ask about this</span></div>
        <div class="chat"><span class="t">Summary versions</span></div>
        <div class="chat"><span>Primer versions</span></div>
        <div class="chat"><span>Make review cards</span></div>
        <div class="chat"><span style="color:#B04A3C">Delete</span></div>
      </div></div>
    </div>
    <figcaption><span class="n">04 · WHERE VERSIONS LIVE</span><b>In the item's ••• menu</b><span>"Summary versions" and "Primer versions" appear only once there's more than one. Topic pages get "Primer versions"; card rows get a Versions swipe and " · Edited" in their subtitle. Takes keep their Earlier versions.</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen">
      <div class="nav"><span>‹ Library</span><span>☆ ···</span></div>
      <div class="t" style="font-size:20px">How the Fed Actually Creates Money</div>
    </div>
    <div class="dim"></div>
    <div class="sheet"><div class="grab"></div><b style="font-size:15px">Summary versions</b>
      <div class="card" style="background:var(--bg)">
        <div class="vrow"><div class="top"><span class="t">Version 3 · 8 Nov</span><span class="cur">Current</span></div><span class="s">Edited in Ask · Remove the key idea about the 2022 balance sheet</span></div>
        <div class="vrow"><div class="top"><span class="t">Version 2 · 6 Nov</span></div><span class="s">Archie · regenerated (kept aside: your edit stayed current)</span></div>
        <div class="vrow"><div class="top"><span class="t">Version 1 · 5 Nov</span></div><span class="s">Archie</span></div>
      </div></div>
    </div>
    <figcaption><span class="n">05 · VERSION LIST</span><b>Newest first, how each was made</b><span>Archie, Edited in Ask, Rewritten from your note, Restored, or You. If Archie regenerates something you edited, its new version is saved here but yours stays current (unless the source itself changed, e.g. "Wrong episode?").</span></figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen">
      <div class="t" style="font-size:20px">How the Fed Actually Creates Money</div>
    </div>
    <div class="dim"></div>
    <div class="sheet"><div class="grab"></div><span class="link" style="text-decoration:none">‹ Back</span><b style="font-size:15px">Version 1 · 5 Nov</b>
      <div class="read" style="font-size:12.5px"><h4>Key ideas</h4>• The Fed creates reserves when it buys bonds.<br>• The balance sheet peaked near $9T in 2022.<br>• …</div>
      <div class="primary">Restore this version</div></div>
    </div>
    <figcaption><span class="n">06 · RESTORE</span><b>Read an old version, restore it</b><span>Restoring copies it as the newest version (nothing is lost) and shows "Restored version 1". Needs a connection.</span></figcaption>
  </figure>
</div>
