        buttonBase-GK1x3M buttonStyle-r7yGCK size_sm-G3LciD priority_secondary-S63h9o\"
        tabindex=\"0\" type=\"button\" data-href=\"https://blog.bytebytego.com/i/222755655/the-agentic-profiling-pipeline\"><svg
        xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0
        0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"
        stroke-linejoin=\"round\" class=\"lucide lucide-link\"><path d=\"M10 13a5
        5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"></path><path d=\"M14
        11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"></path></svg></button></div></div></h2><p>Netflix
        built an automated performance system that wraps the LLM inside a well-defined
        pipeline.</p><div class=\"captioned-image-container\"><figure><a class=\"image-link
        image2 is-viewable-img can-restack\" target=\"_blank\" href=\"https://substackcdn.com/image/fetch/$s_!Fpfx!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F937b41ad-bfbf-411c-9061-fbd0fbfad501_3472x1934.png\"
