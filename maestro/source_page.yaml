appId: com.sampocs.archie
---
# Needs real keys: the worker calls Anthropic for this article (a few cents). Run it only against `make start-local`
# with ANTHROPIC_API_KEY in .env; there is no replay mode for the local backend yet (see maestro/README.md).
- runFlow: login.yaml
# Sign in again as the owner's user, so the worker pays for the summary with the owner's key.
- openLink: archie://dev/login?whitelisted=1
- extendedWaitUntil:
    visible: "Open"
    timeout: 5000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- tapOn:
    id: "library-add"
# The first tap right after login is sometimes swallowed while the screen settles.
- runFlow:
    when:
      notVisible:
        id: "add-url"
    commands:
      - tapOn:
          id: "library-add"
- extendedWaitUntil:
    visible:
      id: "add-url"
    timeout: 5000
- tapOn:
    id: "add-url"
# Not add_link's article: that one is saved by a non-owner first, and re-sharing it merges into its failed row.
- inputText: "https://paulgraham.com/ds.html"
# The reaction row pushes Save under the keyboard; tapping the screen's hint text dismisses it.
- tapOn: "Paste a link, or type a book's title."
- tapOn:
    id: "intent-finished"
- tapOn:
    id: "reaction-easy"
- tapOn:
    id: "add-save"
# Saving lands on Library; open the source (its card shows the URL until the worker's title replaces it).
- tapOn: ".*(paulgraham|Do Things that Don't Scale).*"
# One wait only (Maestro shares the timeout across consecutive waits): the header's "Processing…" goes away once
# both the summary and the primer have synced.
- extendedWaitUntil:
    notVisible: "Processing…"
    timeout: 180000
- assertVisible:
    id: "source-gist"
# A finished item keeps the primer button alone; opening the primer marks it read.
- tapOn: "◆ Primer · .* min"
- assertVisible:
    id: "primer-body"
- tapOn:
    id: "screen-back"
- assertVisible: "✓ Primed"
