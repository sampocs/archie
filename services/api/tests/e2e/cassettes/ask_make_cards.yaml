- request:
    body: "{\"max_tokens\":8000,\"messages\":[{\"role\":\"user\",\"content\":\"What's
      the difference between JWTs and session tokens?\"},{\"role\":\"assistant\",\"content\":\"A
      session token is a random id: the server keeps the session in its own store
      and looks it up on every request, so logging out or revoking is instant. A JWT
      carries the claims itself, signed by the server, so any server can check it
      without a lookup, but it stays valid until it expires unless you keep a deny
      list.\"},{\"role\":\"user\",\"content\":\"Make cards\"},{\"role\":\"assistant\",\"content\":[{\"text\":\"I've
      put together five cards and a short cheat sheet on JWTs versus session tokens.\",\"type\":\"text\"},{\"id\":\"toolu_01XFbzcTHe1HQyeNQcbYS2Sv\",\"caller\":{\"type\":\"direct\"},\"input\":{\"title\":\"JWTs
      vs session tokens\",\"cheat_sheet\":\"## Core idea\\n\\nBoth prove \\\"this
      request comes from a logged-in user.\\\" They differ in where the truth lives:
      a session token points to data on the server, while a JWT carries the data itself.\\n\\n##
      Session token (opaque id)\\n\\nA random string with no meaning on its own. The
      server stores the session (user, expiry, etc.) in a database or cache and looks
      it up on every request.\\n\\n- **Revocation is easy:** delete the server-side
      record and the token is dead immediately.\\n- **Cost:** a store lookup per request,
      and servers must share that store.\\n\\n## JWT (JSON Web Token)\\n\\nA signed
      token containing claims (user id, roles, expiry). The server verifies the signature
      with a key and trusts the contents, with no lookup.\\n\\n- **Scales easily:**
      any service holding the key can verify it.\\n- **Cost:** it stays valid until
      it expires. To revoke early you need a deny list, which brings back a lookup.\\n-
      **Gotcha:** signed is not encrypted. Anyone can read the claims, so don't put
      secrets in them.\\n\\n## Comparison\\n\\n| | Session token | JWT |\\n|---|---|---|\\n|
      Where state lives | Server store | Inside the token |\\n| Per-request check
      | Store lookup | Signature check |\\n| Instant revoke | Yes | No (needs deny
      list) |\\n| Good fit | Single app, easy logout | Many services, short-lived
      access |\\n\\n## Common practice\\n\\nKeep JWTs short-lived (minutes) and pair
      them with a longer-lived refresh token, so a stolen JWT is only useful briefly.\",\"cards\":[{\"kind\":\"concept\",\"question\":\"What
      is the core difference between a session token and a JWT?\",\"answer\":\"Where
      the user's state lives\",\"detail\":[\"Session token: random id, state stored
      on the server.\",\"JWT: signed token carrying the claims itself.\"]},{\"kind\":\"mechanism\",\"question\":\"Why
      can a server revoke a session token instantly?\",\"answer\":\"It deletes the
      server-side session record\",\"detail\":[\"The token is only a pointer, so no
      record means no access.\"]},{\"kind\":\"mechanism\",\"question\":\"Why is revoking
      a JWT before it expires hard?\",\"answer\":\"Servers verify it without any lookup\",\"detail\":[\"Validity
      comes from the signature and expiry alone.\",\"A deny list works but reintroduces
      a lookup.\"]},{\"kind\":\"concept\",\"question\":\"What does a JWT's signature
      guarantee, and what does it not provide?\",\"answer\":\"Tamper-proofing, not
      secrecy\",\"detail\":[\"Claims are readable by anyone holding the token.\",\"So
      never put secrets in a JWT payload.\"]},{\"kind\":\"concept\",\"question\":\"What
      common pattern limits the damage of a stolen JWT?\",\"answer\":\"Short-lived
      JWT plus refresh token\",\"detail\":[\"The access token expires in minutes,
      so theft is only briefly useful.\"]}]},\"name\":\"propose_cards\",\"type\":\"tool_use\"}]},{\"role\":\"user\",\"content\":[{\"type\":\"tool_result\",\"tool_use_id\":\"toolu_01XFbzcTHe1HQyeNQcbYS2Sv\",\"content\":\"{\\\"proposal_id\\\":
      \\\"b4ce8dab-ed52-4215-a038-8aa52963e9ce\\\", \\\"status\\\": \\\"shown to the
      owner with Save and Discard; nothing is saved yet\\\"}\"}]}],\"model\":\"claude-sonnet-5-5\",\"output_config\":{\"effort\":\"medium\"},\"system\":\"You
      are Archie's Ask, answering the owner's questions from their own library first.
      Archie is their personal library of the articles, newsletters, podcasts and
      videos they saved, with Archie's summaries and primers of them, topic primers,
      and the owner's own takes.\\n\\nHow to answer:\\n- Search the owner's library
      with search_library first, unless the question plainly isn't about anything
      they could have saved (small talk, arithmetic). Search again with other words
      if the first search finds nothing useful.\\n- Call tools without writing anything
      first; don't announce your searches.\\n- Base library claims only on search
      results, so they carry citations.\\n- Each library result's title gives the
      day the owner saved it and, when that was another day, when it was published.
      For a question about a time (\\\"yesterday\\\", \\\"this week\\\", \\\"on Tuesday\\\"),
      work the days out from today's date and pass search_library's saved_* or published_*
      bounds.\\n- Then add background knowledge only where the library doesn't cover
      the question, in its own paragraph and without citations. Never present background
      knowledge as coming from the library.\\n- Search the web for recent or fast-changing
      facts (prices, office holders, this year's numbers), when the owner asks you
      to look something up, and whenever this prompt says a web search is required.
      Base web claims only on web results.\\n- Keep answers short and in plain language:
      a few short paragraphs at most. Define a technical term the first time you use
      it. No headings, and no bullet lists unless the owner asks for a list.\\n- If
      neither the library nor the web has the answer and you don't know it, say so
      plainly.\\n- Write plain paragraphs: no headings, no bold section titles; a
      short list only when it really helps.\\n\\nEditing the owner's things:\\n- You
      can propose edits to a source's summary or primer, a topic primer, one of the
      owner's takes, or a review card, but only when the owner asks for a change.
      Use propose_summary_edit, propose_text_edit or propose_card_edit. Nothing changes
      until the owner taps Apply, so never say the edit is done.\\n- Find the id first:
      the about item below names its ids, search results end with [kind id] tags,
      earlier answers list the items they cited, and find_cards finds cards. You don't
      need to search the library for an edit when you already have the id.\\n- Read
      the current content with read_item first and change only what the owner asked
