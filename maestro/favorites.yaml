appId: com.sampocs.archie
---
# Star an item from its page, find it under Library → Saved → its domain, then unstar it there with a swipe.
# The dev test user isn't whitelisted, so the source never gets a domain and is grouped under Other.
- runFlow: login.yaml
- tapOn:
    id: "library-add"
# The first tap right after login is sometimes swallowed while the screen settles.
- runFlow:
    when:
      notVisible:
        id: "add-url"
    commands:
      - tapOn:
          id: "library-add"
- extendedWaitUntil:
    visible:
      id: "add-url"
    timeout: 5000
- tapOn:
    id: "add-url"
- inputText: "https://example.com/"
- tapOn:
    id: "intent-queue"
- tapOn:
    id: "add-save"
# Save closes the sheet and stays on Library; wait for the sheet to go (its field also reads example.com), then open
# the new row.
- extendedWaitUntil:
    notVisible:
      id: "add-url"
    timeout: 5000
- extendedWaitUntil:
    visible:
      text: ".*example\\.com.*"
    timeout: 10000
- tapOn:
    text: ".*example\\.com.*"
- tapOn:
    id: "item-favorite"
- assertVisible:
    id: "item-byline"
    text: ".*★ Favorite.*"
- tapOn:
    id: "screen-back"
- tapOn:
    id: "library-mode-saved"
- assertVisible:
    id: "saved-favorites"
- tapOn:
    id: "favorites-domain-other"
- assertVisible:
    id: "favorites-page"
# The row's title becomes "Example Domain" once fetched and its meta has no host, so match the row by id.
- assertVisible:
    id: "favorite-row-.*"
# A swipe from the row element doesn't open it on this page (the gesture never reaches the swipeable), so swipe the
# first row by screen position.
- waitForAnimationToEnd
- swipe:
    start: "80%, 24%"
    end: "10%, 24%"
    duration: 800
- tapOn:
    id: "favorite-unstar-.*"
- assertVisible: "No favorites in Other yet."
- tapOn:
    id: "screen-back"
- assertVisible:
    id: "saved-empty"
