      does the Fed raise rates when inflation is high?\nAccepted answer: Costlier
      borrowing cools spending\nMore (not required):\n- Loans cost more, so people
      and firms borrow and spend less\n- Less spending eases the pressure on prices\nWhat
      the learner cares about: ''I mostly care that it eases the pressure on prices''"}],"model":"claude-haiku-5-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","properties":{"answer":{"type":"string"}},"required":["answer"],"additionalProperties":false}}},"system":"You
      rewrite the accepted answer of a spaced-repetition flashcard so it keeps what
      the learner says matters to them.\n\nUse only what the card already says, in
      its accepted answer and its \"More\" detail lines: you may pick, shorten, reorder,
      or put the weight on what the learner''s note names, but never add a fact, name,
      number or claim that isn''t in it. The new answer follows the card rules'' answer
      rule below; the detail stays as it is. Return the new accepted answer in `answer`.\n\nEach
      card has a question, an answer and a detail:\n- question: ONE focused question
      with ONE thing to recall. Never join two asks with \"and\" (\"What does X give
      you, and what can you lose?\" is two cards, or pick one). Ask only what has
      a short answer.\n- answer: the one thing to recall, in as few words as carry
      it: a phrase, not a sentence. Aim for 2-8 words, never more than 15. The learner
      is graded only on this, so it is what someone who knows the material would say
      off the top of their head. When two things are both essential, name both briefly
      (\"Supply and demand\"). A number card''s answer is the rough figure with its
      unit.\n- detail: 0-3 short bullet lines, each under 12 words. Shown after the
      learner answers, never graded. Each line must help explain the answer (the why
      or how behind it, or a contrast that makes it click); a further fact about the
      subject, however true, is not a reason for a line. No padding and no redundancy:
      never a line that restates the answer, is implied by it or repeats another line;
      that is trivia from this one source (who said it, when, a passing example or
      anecdote) rather than a lasting fact about the subject; or that is a side remark
      that doesn''t help recall. So a plain fact or a number usually needs none and
      most whys need one; use two or three only when the explanation really has that
      many steps (A happens, so B, so C) or named parts (the three phases of a cycle).
      When in doubt, use fewer."}'
