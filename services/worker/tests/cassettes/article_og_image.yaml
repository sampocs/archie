        points=\\\"9 21 3 21 3 15\\\">\\u003c/polyline>\\u003cline x1=\\\"21\\\" x2=\\\"14\\\"
        y1=\\\"3\\\" y2=\\\"10\\\">\\u003c/line>\\u003cline x1=\\\"3\\\" x2=\\\"10\\\"
        y1=\\\"21\\\" y2=\\\"14\\\">\\u003c/line>\\u003c/svg>\\u003c/button>\\u003c/div>\\u003c/div>\\u003c/div>\\u003c/a>\\u003c/figure>\\u003c/div>\\u003cp>First,
        you trigger profiling for an application. A developer tries to detect high
        latency or increased resource usage by triggering a profiler on a live production
        server.\\u003c/p>\\u003cp>In the second step, the profiler outputs raw trace
        data or flame graphs. The developer downloads these details to their local
        machine.\\u003c/p>\\u003cp>Third, the developer spends time looking at complex,
        color-coded flame graphs. They try to spot wide stack frames that might show
        signs of higher-than-normal CPU or memory consumption.\\u003c/p>\\u003cp>Next,
        the developer goes through the codebase looking for cryptic method names found
        in the flame graph. They try to make sense of the surrounding application
        logic to figure things out.\\u003c/p>\\u003cp>Fifth, the developer traces
        the execution path and identifies the inefficient operation. They write a
        proposed patch to fix the operation.\\u003c/p>\\u003cp>Moving further, the
        developers deploy the patch to an environment where any change in performance
        levels can be measured.\\u003c/p>\\u003cp>At the end, when new code paths
        are deployed in production, the developer starts the manual process once again.\\u003c/p>\\u003cp>As
        you may have noticed, this workflow doesn\u2019t scale. Everything depends
        on a few domain experts who have a deep sense of understanding about low-level
        execution stacks. Since human attention is a scarce resource, you can investigate
        performance issues only for major incidents or obvious system slowdowns. Smaller
        but steady resource drains go unnoticed.\\u003c/p>\\u003cdiv>\\u003chr>\\u003c/div>\\u003ch2>\\u003ca
