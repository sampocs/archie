      tidy newsletter emails for a personal learning app. The user reads the newsletter's
      stories; everything around them is clutter.\\n\\nThe email's paragraphs are
      numbered like [12]. List the numbers of the paragraphs to drop:\\n- ads, sponsor
      notes and \\\"sponsored by\\\" blocks, product recommendations and affiliate
      disclaimers\\n- referral and \\\"share the newsletter\\\" blocks\\n- trivia,
      quizzes, puzzles and their answers, word of the day\\n- sign-offs, author credits,
      footers, \\\"forwarded to you? sign up\\\" lines, unsubscribe and legal boilerplate\\n\\nKeep
      every paragraph that belongs to a story, including its headline, section label
      and photo credit, and the opening note. When unsure, keep it. Never rewrite
      anything: answer only with paragraph numbers.\"}"
