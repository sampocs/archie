appId: com.sampocs.archie
---
# Run after run_brief.sh has delivered the two newsletters (Morning Brew as news, ByteByteGo as an essay). Needs real keys
# (a few cents: Haiku to clean and analyze, then Sonnet to write the brief).
# The worker cleans, analyzes and files both before it writes the brief, so this is one long wait.
# Login lands on Library; the brief preview lives on Today.
- tapOn:
    id: "tab-today"
- extendedWaitUntil:
    visible:
      id: "today-brief"
    timeout: 300000
- waitForAnimationToEnd
# The whole card opens the brief (its inner link is grouped into the card for accessibility).
- tapOn:
    id: "today-brief"
- waitForAnimationToEnd
- assertVisible:
    id: "brief-screen"
# A story's sources open its page, which lists the newsletters that covered it.
- tapOn:
    id: "brief-story-0-sources"
- waitForAnimationToEnd
- assertVisible:
    id: "story-covered-by"
- tapOn:
    id: "screen-back"
- waitForAnimationToEnd
# The essay's id isn't known in advance, so match its queue link by pattern.
- scrollUntilVisible:
    element:
      id: "brief-essay-.*-queue"
    timeout: 30000
- tapOn:
    id: "brief-essay-.*-queue"
- scrollUntilVisible:
    element:
      id: "brief-done"
    timeout: 30000
- tapOn:
    id: "brief-done"
- waitForAnimationToEnd
# Done marks the shown newsletters briefed, so nothing is left to brief and the preview gives way to a done row
# (or, with nothing else waiting today, to "Today's done").
- assertNotVisible:
    id: "today-brief"
- assertVisible:
    id: "today-brief-done|today-done"
