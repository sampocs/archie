- request:
    body: "{\"max_tokens\":8000,\"messages\":[{\"role\":\"user\",\"content\":\"Today:
      2026-11-08\\nTitle: Proof of stake\\nTags: crypto, ethereum\\nLast edited: 2024-03-02\\n\\n<note>\\n#
      Proof of stake\\n\\n## Basics\\n- Validators stake 32 ETH, chosen to propose
      blocks\\n- Misbehave \u2192 slashed\\n- Rewards ~4%/yr?\\n\\n## Links\\n- [PoS
      on Wikipedia](https://en.wikipedia.org/wiki/Proof_of_stake)\\n- https://open.spotify.com/episode/4rOoJ6Egrf8K2IrywzwOMk\\n\\n</note>\\n\\n<reference
      url=\\\"https://en.wikipedia.org/wiki/Proof_of_stake\\\" title=\\\"Proof of
      stake - Wikipedia\\\" kind=\\\"page\\\">\\nProof of stake\\nProof-of-stake (PoS)
      protocols are a class of consensus mechanisms for blockchains that work by selecting
      validators in proportion to their quantity of holdings in the associated cryptocurrency.
      This is done to avoid the computational cost of proof-of-work (PoW) schemes.
      The first functioning use of PoS for cryptocurrency was Peercoin in 2012, although
      its scheme, on the surface, still resembled a PoW.[1]\\nDescription\\nFor a
      blockchain transaction to be recognized, it must be appended to the blockchain.
      In a proof-of-stake blockchain, the appending entities are named minters or
      validators (in proof-of-work blockchains, this task is carried out by the miners);[2]
      in most protocols, the validators receive a reward for doing so.[3] For the
      blockchain to remain secure, it must have a mechanism to prevent a malicious
      user or group from taking over a majority of validation. PoS accomplishes this
      by requiring that validators have some quantity of blockchain tokens, requiring
      potential attackers to acquire a large fraction of the tokens on the blockchain
      to mount an attack.[4]\\nProof-of-work (PoW), another commonly used consensus
      mechanism, uses a validation of computational prowess to verify transactions,
      requiring a potential attacker to acquire a large fraction of the computational
      power of the validator network.[4] This incentivizes consuming huge quantities
      of energy. PoS is more energy-efficient.[5]\\nRiposo and Gupta[6] showed that
      a formal PoS mathematical model can derive a metric for the expected gain of
      a staker. They introduced a forward-method model that computes staking rewards
      as the staking return per block-validation period and proved that the resulting
      interest equals the ratio of the average staking gain to the total staked coins.
      The model incorporates PoS-specific factors such as slashing (penalties for
      misbehavior) and Maximal Extractable Value (MEV), showing that slashing reduces
      expected rewards and that MEV links transaction-fee extraction to the average
      staking gain. In addition, the authors illustrated the model using Ethereum
      2.0, and presented an analogous derivation for PoW consensus.\\nEarly PoS implementations
      were plagued by a number of new attacks that exploited the unique vulnerabilities
      of the PoS protocols. Eventually, two dominant designs emerged: Byzantine-fault-tolerance-based
      and chain-based approaches.[7] Bashir identifies three more types of PoS:[8]\\n-
      committee-based PoS (a.k.a. nominated PoS, NPoS);\\n- delegated proof of stake
      (DPoS);\\n- liquid proof of stake (LPoS).\\nAttacks\\nThe additional vulnerabilities
      of PoS schemes are directly related to their advantage: a relatively low amount
      of calculations required when constructing a blockchain.[9]\\nLong-range attacks\\nThe
      low amount of computing power involved allows a class of attacks that replace
      a non-negligible portion of the main blockchain with a hijacked version. These
      attacks are called in literature by different names, including Long-Range, Alternative
      History, Alternate History, and History Revision, and are unfeasible in the
      PoW schemes due to the sheer volume of calculations required.[10] The early
      stages of a blockchain are much more malleable for rewriting, as they likely
      have much smaller group of stakeholders involved, simplifying the collusion.
      If the per-block and per-transaction rewards are offered, then the malicious
      group can, for example, redo the entire history and collect these rewards.[11]\\nThe
      classic \\\"Short-Range\\\" attack (bribery attack) that rewrites just a small
      tail portion of the chain is also possible.[10]\\nNothing at stake\\nSince validators
      do not need to spend a considerable amount of computing power (and thus money)
      on the process, they are prone to the Nothing-at-Stake attack: the participation
      in a successful validation increases the validator's earnings, so there is a
      built-in incentive for the validators to accept all chain forks submitted to
      them, thus increasing the chances of earning the validation fee. The PoS schemes
      enable low-cost creation of blockchain alternatives starting at any point in
      history (costless simulation); submitting these forks to eager validators endangers
      the stability of the system.[9] If this situation persists, it can allow double-spending,
      where a digital token can be spent more than once.[11] This can be mitigated
      through penalizing validators who validate conflicting chains[11] (\\\"economic
      finality\\\"[12]) or by structuring the rewards so that there is no economic
      incentive to create conflicts.[3] Byzantine-fault-tolerance-based PoS are generally
      considered robust against this threat (see below).[13]\\nBribery attack\\nBribery
      attack, where the attackers financially induce some validators to approve their
      fork of blockchain, is enhanced in PoS, as rewriting a large portion of history
      might enable the collusion of once-rich stakeholders that no longer hold significant
      amounts at stake to claim a necessary majority at some point back in time, and
      grow the alternative blockchain from there, an operation made possible by the
      low computing cost of adding blocks in the PoS scheme.[11]\\nVariants\\nChain-based
      PoS\\nThis is essentially a modification of the PoW scheme, where the competition
      is based not on applying brute force to solving the identical puzzle in the
      smallest amount of time, but instead on varying the difficulty of the puzzle
      depending on the stake of the participant; the puzzle is solved if on a tick
      of the clock (|| is concatenation):\\nThe smaller amount of calculations required
      for solving the puzzle for high-value stakeholders helps to avoid excessive
      hardware.[14]\\nNominated PoS (NPoS)\\nAlso known as \\\"committee-based\\\",
      this scheme involves an election of a committee of validators using a verifiable
      random function with probabilities of being elected higher with higher stake.
      Validators then randomly take turns producing blocks. NPoS is utilized by Ouroboros
      Praos and BABE[15].\\nIn addition, Polkadot uses a deterministic variant of
      NPoS, where the validators are elected using a variant of Phragmen's voting
      rule.[16]\\nBFT-based PoS\\nThe outline of the BFT PoS \\\"epoch\\\" (adding
      a block to the chain) is as follows:[17]\\n- A \\\"proposer\\\" with a \\\"proposed
      block\\\" is randomly selected by adding it to the temporary pool used to select
      just one consensual block;\\n- The other participants, validators, obtain the
      pool, validate, and vote for one;\\n- The BFT consensus is used to finalize
      the most-voted block.\\nThe scheme works as long as no more than a third of
      validators are dishonest. BFT schemes are used in Tendermint and Casper FFG.[17]\\nDelegated
      proof of stake (DPoS)\\nProof of stake delegated systems use a two-stage process:
      first,[18] the stakeholders elect a validation committee,[19] a.k.a. witnesses,
      by voting proportionally to their stakes, then the witnesses take turns in a
      round-robin fashion to propose new blocks that are then voted upon by the witnesses,
      usually in the BFT-like fashion. Since there are fewer validators in the DPoS
      than in many other PoS schemes, the consensus can be established faster. The
      scheme is used in many chains, including EOS, Lisk, Tron.[18]\\nLiquid proof
      of stake (LPoS)\\nIn the liquid PoS anyone with a stake can declare themselves
      a validator, but for the small holders it makes sense to delegate their voting
      rights instead to larger players in exchange for some benefits (like periodic
      payouts). A market is established where the validators compete on the fees,
      reputation, and other factors. Token holders are free to switch their support
      to another validator at any time. LPoS is used in Tezos.[20]\\n'Stake' definition\\nThe
      exact definition of \\\"stake\\\" varies from implementation to implementation.
      For instance, some cryptocurrencies use the concept of \\\"coin age\\\", the
      product of the number of tokens with the amount of time that a single user has
      held them, rather than merely the number of tokens, to define a validator's
      stake.[4][14]\\nImplementations\\nThe first functioning implementation of a
      proof-of-stake cryptocurrency was Peercoin, introduced in 2012.[3] Other cryptocurrencies,
      such as Blackcoin, Nxt, Cardano, and Algorand followed.[3] However, as of 2017[update],
      PoS cryptocurrencies were still not as widely used as proof-of-work cryptocurrencies.[21][22][23]\\nIn
      September 2022, Ethereum, the second-largest cryptocurrency, switched from PoW
      to a PoS consensus mechanism,[24] after several proposals[25][26] and some delays.[26][27]\\nConcerns\\nCentralization\\nCritics
      have argued that proof of stake may lead cryptocurrency blockchains to become
      more centralized than proof of work because the system favors users who hold
      larger amounts of cryptocurrency, which could give those users greater influence
      over the management and direction of the blockchain.[28][29]\\nLegal status
      in US\\nUS regulators have argued over the legal status of the proof-of-stake
      model, with the Securities and Exchange Commission claiming that staking rewards
      are the equivalent of interest, so coins such as ether and ada are financial
      securities.[30] However, in 2024, the SEC sidestepped the question by recognising
      Ethereum market funds on condition that they did not stake their coins. The
      level of staking of ether at 27% of total supply was low compared with Cardano
      (66%) and Solana (63%). However, not staking their tokens meant that the funds
      were losing about 3% of potential returns a year.[31]\\nEnergy consumption\\nIn
      2021, a study by the University of London found that in general the energy consumption
      of the proof-of-work-based Bitcoin was about a thousand times higher than that
      of the highest-consuming proof-of-stake system that was studied even under the
      most favorable conditions and that most proof-of-stake systems cause less energy
      consumption in most configurations.[32]\\nIn January 2022, Erik Thed\xE9en,
      the vice-chair of the European Securities and Markets Authority, called on the
      EU to ban the PoW model in favor of PoS because of the latter's lower energy
      consumption.[33]\\nEthereum's switch to proof-of-stake was estimated to have
      cut its energy use by over 99%.[34][35]\\nReferences\\n- \u2191 Zhao, Wenbing;
      Yang, Shunkun; Luo, Xiong; Zhou, Jiong (26 March 2021). \\\"On PeerCoin Proof
      of Stake for Blockchain Consensus\\\". ICBCT'21: The 3rd International Conference
      on Blockchain Technology. ACM. pp. 129\u2013134. doi:10.1145/3460537.3460547.\\n-
      \u2191 Deirmentzoglou, Papakyriakopoulos & Patsakis 2019, p. 28714.\\n- 1 2
      3 4 Saleh, Fahad (2021-03-01). \\\"Blockchain without Waste: Proof-of-Stake\\\".
      The Review of Financial Studies. 34 (3): 1156\u20131190. doi:10.1093/rfs/hhaa075.
      ISSN 0893-9454.\\n- 1 2 3 Tasca, Paolo; Tessone, Claudio J. (2019-02-15). \\\"A
      Taxonomy of Blockchain Technologies: Principles of Identification and Classification\\\".
      Ledger. 4. arXiv:1708.04872. doi:10.5195/ledger.2019.140. ISSN 2379-5980. Archived
      from the original on 2022-04-22. Retrieved 2021-04-26.\\n- \u2191 Zhang, Rong;
      Chan, Wai Kin (Victor) (2020). \\\"Evaluation of Energy Consumption in Block-Chains
      with Proof of Work and Proof of Stake\\\". Journal of Physics: Conference Series.
      1584 (1) 012023. Bibcode:2020JPhCS1584a2023Z. doi:10.1088/1742-6596/1584/1/012023.
      ISSN 1742-6596.\\n- \u2191 Riposo, Julien; Gupta, Maneesh (2024-02-15). \\\"A
