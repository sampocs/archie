[project]
name = "archie-shared"
version = "0.1.0"
description = "Config, logging, and money helpers shared by every Archie service."
requires-python = ">=3.13"
dependencies = [
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archie_shared"]
