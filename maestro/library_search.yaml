appId: com.sampocs.archie
---
# Free to run: the dev test user isn't whitelisted, so the source fails at analyze but keeps its fetched title.
# Search finds it (the server's matching passage shows as a quote under the row) and shows the empty state for a
# query nothing matches.
- runFlow: login.yaml
- tapOn:
    id: "library-add"
# The first tap right after login is sometimes swallowed while the screen settles.
- runFlow:
    when:
      notVisible:
        id: "add-url"
    commands:
      - tapOn:
          id: "library-add"
- extendedWaitUntil:
    visible:
      id: "add-url"
    timeout: 5000
- tapOn:
    id: "add-url"
- inputText: "https://paulgraham.com/hwh.html"
- tapOn:
    id: "intent-queue"
- tapOn:
    id: "add-save"
# Saving lands on Library; the worker's title replaces the URL. (example.com no longer yields readable text, so its title never arrives.)
- extendedWaitUntil:
    visible: ".*How to Work Hard.*"
    timeout: 60000
- tapOn:
    id: "library-search"
- inputText: "work hard"
# Keyword search runs on the server once typing stops; the passage that matched shows under the row.
- extendedWaitUntil:
    visible:
      id: "search-quote-.*"
    timeout: 15000
    optional: true
# The embed job may not have run yet: type the query again to search once more.
- runFlow:
    when:
      notVisible:
        id: "search-quote-.*"
    commands:
      - eraseText
      - inputText: "work hard"
      - extendedWaitUntil:
          visible:
            id: "search-quote-.*"
          timeout: 15000
- assertVisible: ".*How to Work Hard.*"
- eraseText
- inputText: "zzqx nothing"
- extendedWaitUntil:
    visible:
      id: "library-search-empty"
    timeout: 10000
