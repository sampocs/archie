    body: "{\"max_tokens\":8000,\"messages\":[{\"role\":\"user\",\"content\":\"Source
      kind: newsletter\\nTitle: How Netflix Uses AI Agents for Performance Engineering\\nURL:
      https://blog.bytebytego.com/p/how-netflix-uses-ai-agents-for-performance\\n\\n<text>\\nHow
      does full-stack observability impact engineering speed, incident response, and
      cost control?\\nIn this eBook from Datadog, you\u2019ll learn how real teams
      across industries are using observability to:\\nReduce mean time to resolution
      (MTTR)\\nCut tooling costs and improve team efficiency\\nAlign business and
      engineering KPIs\\nSee how unifying your stack leads to faster troubleshooting
      and long-term operational gains.\\nPerformance engineering is the discipline
      in which you design, analyze, and optimize software systems so that they run
      quickly. Also, they should use resources efficiently. In distributed architectures,
      the focus of any performance engineering activity is on shaving milliseconds
      off response times. Or locating execution bottlenecks in CPU or memory. Or making
      sure infrastructure costs are kept under control.\\nHistorically, performance
      engineering work has been slow. And manual. You often depend on a small group
      of really skilled developers. However, with the rise of AI-assisted software
      development, there\u2019s a contradiction. Developers can write and ship code
      faster than ever. No matter what their skill level may be. But that code often
      introduces subtle performance problems.\\nTo solve this problem, the Netflix
      engineering team has developed an autonomous performance agent system. In this
      article, we\u2019ll be learning more about it. Here\u2019s what we will cover:\\nBottlenecks
      for traditional performance work\\nThe problem with AI-Generated code\\nCan
      LLMs handle profile data\\nThe agentic profiling pipeline\\nThe problems Netflix
      found in production\\nSafety, verification, and trust architecture\\nShifting
      left\\nDisclaimer: This post is based on publicly shared details from various
      sources. References at the end. Please comment if you notice any inaccuracies.\\nTraditional
      performance engineering work at Netflix was built on a highly iterative loop
      that is pretty much manual in nature.\\nFirst, you trigger profiling for an
      application. A developer tries to detect high latency or increased resource
      usage by triggering a profiler on a live production server.\\nIn the second
      step, the profiler outputs raw trace data or flame graphs. The developer downloads
      these details to their local machine.\\nThird, the developer spends time looking
      at complex, color-coded flame graphs. They try to spot wide stack frames that
      might show signs of higher-than-normal CPU or memory consumption.\\nNext, the
      developer goes through the codebase looking for cryptic method names found in
      the flame graph. They try to make sense of the surrounding application logic
      to figure things out.\\nFifth, the developer traces the execution path and identifies
      the inefficient operation. They write a proposed patch to fix the operation.\\nMoving
      further, the developers deploy the patch to an environment where any change
      in performance levels can be measured.\\nAt the end, when new code paths are
      deployed in production, the developer starts the manual process once again.\\nAs
      you may have noticed, this workflow doesn\u2019t scale. Everything depends on
      a few domain experts who have a deep sense of understanding about low-level
      execution stacks. Since human attention is a scarce resource, you can investigate
      performance issues only for major incidents or obvious system slowdowns. Smaller
      but steady resource drains go unnoticed.\\nFast-moving teams ship more code
      than ever, and AI tools add even more. Their CI has to keep up without the bill
      getting out of hand.\\nThat is why teams at Braintrust, Raycast, OpenRouter,
      Comcast and Jane Street run GitHub Actions on WarpBuild:\\nTwice as fast at
      half the cost\\nLinux, macOS and Windows on x86-64 and ARM64\\nUnlimited macOS
      concurrency\\nOne line change to runs-on\\nUse code START50 for $50 in free
      credits.\\nThe use of AI coding assistants has increased performance problems.
      There are two main reasons for this. The speed trap and the context gap.\\nDevelopers
      who are using AI tools can generate and ship code up to 10 times faster than
      before. No matter their skill level or knowledge of the system. But you cannot
      guarantee that code that is fast to generate also performs well. While your
      average developer might be able to write 10K lines of code in a few minutes,
      the team might have to spend years debugging regressions. Or dealing with code
      bloat. Or handling other architecture-related problems.\\nAlso, if you\u2019ve
      noticed, LLMs are great at syntax and local-level logic. If you ask an LLM to
      write a function or an API endpoint, it writes code that compiles successfully
      and runs without any obvious errors. It might also pass standard unit tests.
      However, the LLM has no idea about the host platform\u2019s runtime environment.\\nFor
      example, you can\u2019t expect the LLM to know that a particular utility function
      being used in your code might run 10 million times per second on a critical
      request path. It cannot see the overall call stack. Neither can it understand
      memory allocation challenges that might exist inside a container running at
      peak load within your platform. Therefore, the code you write might appear good
      enough in isolation. But it can still waste a huge amount of resources when
      you run it at scale.\\nNetflix wanted to test whether automation could remove
      these issues. They set up an experiment to find out if an LLM can read and make
      sense of raw profiling data directly.\\nDifferent languages have different profilers.
      But they use a shared language and store the same core information. For example,
      JVM\u2019s async-profiler or Java Flight Recorder operates at 100 Hz sampling
      to capture execution traces, memory allocation rates, and thread lock contention.
      Python\u2019s py-spy provides low-overhead, async stack sampling of live production
      processes. Go has pprof, which generates goroutine profiles, heap snapshots,
      and block contention data.\\nEach one of these profilers breaks down execution
      into call stacks. They track two main metrics. First, you have the inclusive
      time. This is the total time spent executing a function. It includes every child
      function and the subroutines called by this function. Second, you have the Self
      (CPU) Time. It\u2019s the time spent running code purely inside the function
      itself. No external calls are involved.\\nWith this exercise, the Netflix engineering
      team came to the conclusion that a single analytical pipeline could understand
      data from almost any programming runtime.\\nAnother advantage of LLMs is that
      they don\u2019t have to guess how an algorithm works from scratch. Since LLMs
      have been broadly trained on many software repositories, they are mostly familiar
      with classic programming anti-patterns. For example, they know that quadratic
      loops where a hot method is called again and again for each item in a collection
      aren\u2019t a good idea. Also, loop invariants where you compute a calculation
      for every iteration of the loop instead of making the calculation once at the
      beginning. Other patterns include excessive object allocation on hot execution
      paths and \u201CN+1\u201D query patterns.\\nDue to this knowledge base of LLMs,
      you don\u2019t need to ask an AI model to guess why an application might be
      performing poorly. You can build a workflow that asks the model to pattern-match
      known performance bugs against actual call stacks.\\nNetflix built an automated
      performance system that wraps the LLM inside a well-defined pipeline.\\nA key
      lesson Netflix engineers learnt during this implementation was about scoping.
      If you feed an LLM a complete, raw stack trace without boundaries, it can get
      distracted. Often, the model spends a lot of reasoning tokens analyzing internal
      JVM garbage collection pauses, low-level Linux kernel syscalls, or even 3rd
      party open-source framework overhead.\\nApplication developers don\u2019t have
      any control over such internal library concerns or OS routines. Therefore, you
      need to provide the agent with strict package prefix rules. This way, the model
      can ignore generic platform noise and focus on tracing only the specific application
      code.\\nWhen the Netflix engineering team deployed the profiling pipeline against
      its production service, the agent found 4 major categories of performance bugs.\\nFirst
      was an algorithmic bottleneck that wasted 8.8% of CPU resources. The agent found
      an aggregation method using Java Streams where an immutable map was updated
      inside a reduction step.\\n// Anti-pattern: O(N^2) accumulation inside stream
      reduction\\nstream().reduce(ImmutableMap.of(), (acc, val) -> {\\nreturn ImmutableMap.builder()\\n.putAll(acc)
      // Copies every existing entry on every single step\\n.put(val)\\n.build();\\n});\\nSince
      putAll(acc) copies every existing key-value pair on every step, you need to
      copy elements again and again to build a map of size N. This results in quadratic
      complexity.\\nThe agent modified the quadratic builder reduction with a linear
      collection approach.\\n// Optimized: O(N) single-pass collection\\nstream()\\n.flatMap(e
      -> e.entrySet().stream())\\n.collect(toMap(Entry::getKey, Entry::getValue));\\nThe
      second category was about regular expressions on the hot path. In a service,
      the developer had to sanitize incoming request strings by modifying characters
      that weren\u2019t allowed. The earlier implementation ran a raw regular expression
      substitution on every request.\\n// Anti-pattern: Dynamic regex evaluation per
      request\\nString sanitized = input.replaceAll(\u201D[^a-zA-Z0-9.-]\u201D, \u201C_\u201D);\\nAs
      you might know, evaluating regular expressions involves parsing and state-machine
      transitions. This logic on high-volume traffic used 46% of the service\u2019s
      CPU time.\\nThe agent replaced the regex evaluation with a pre-computed lookup
      table that checked characters by index. The execution got 22 times faster.\\nThe
      next category was related to unnecessary object allocation that caused OOM crashes.
      A service frequently checked whether incoming data payloads contained specific
      metadata fields. To perform the check, the code was creating a new, heavy HashSet
      on every incoming call.\\nHowever, the underlying data object already had an
      internal lookup method available. Also, instantiating millions of such objects
      consumed 47% of the service\u2019s total heap collections.\\nThe agent fixed
      this issue by removing the redundant object instantiations and modified the
      code to reuse the cached method.\\nThe next category was around library misuse.
      For example, the discovery involved metric telemetry instrumentation. One of
      the services tracked operations by looking up a counter from a metric registry
      on every single call.\\n// Anti-pattern: Looking up metric instances on every
      function execution\\nMetrics.counter(\u201Drequest.count\u201D).increment();\\nWhen
      the query was sent to the registry, it needed dictionary lookups and internal
      synchronization locks. The profiler showed that the work consumed 66% of the
      CPU, whereas the actual business logic used only 0.3%.\\nThe agent fixed it
      by caching the metric counter reference at the time of class initialization.
      Also, it found that the same issue was happening across three independent services.\\nIf
      you have an AI agent that can optimize code, it\u2019s quite dangerous if the
      changes are applied without automatic verification. If the agent makes a change
      that breaks business logic, it\u2019s worse than inefficient code.\\nTo prevent
      regressions, the agentic pipeline uses the standard SDLC.\\nIn stage 1, you
      verify the logic. Before you move any code, the agent\u2019s branch must pass
      all existing unit, integration, and contract tests. This is to make sure that
      the changes made by the change don\u2019t alter basic inputs, outputs, or handling
      of edge cases.\\nIn stage 2, you have the canary deployment. If the tests pass,
      the pipeline spins up a canary deployment in production. The canary instance
      gets a portion of the traffic. It runs side-by-side with an identical baseline
      instance that runs the original code.\\nStage 3 is about generating the observability
      report. The platform collects hard telemetry metrics over a big enough window.
      Some metrics are relative CPU utilization, median latency, P99 latency, and
      memory allocation rates. They also don\u2019t use any AI model to check the
      canary results.\\nIn stage 4, you have the final engineering decision. When
      the canary version shows a good level of performance improvement with zero increase
      in error rates, the system opens a PR. This PR goes for human review. It includes
      the code change, the original flame graph, and the canary report. The final
      decision on deploying the change to production is taken by the human developer.\\nAutomated
      production profiling is quite effective. But if you just rely on it, you end
      up exposing several limitations.\\nBy the time an agent finds an anti-pattern
      in production, you\u2019ve already paid for days or weeks of wasted compute
      capacity.\\nSecond, developers are anyway cautious about changing a running
      service. If you have a service that handles production traffic without crashing,
      the developers hesitate to just make changes for the sake of optimization.\\nLastly,
      multiple teams often make the exact same mistakes when it comes to patterns.
      If you run a super-expensive agent on 10 different services just to find the
      same problem, it\u2019s not very efficient.\\nThese limitations led to Netflix
      making the decision to shift performance checks left into the early development
      cycle. Also, they wanted the agents to share their findings across the entire
      engineering organization.\\nHowever, as you might know, language models are
      stateless. Every time you send a prompt to an LLM, it starts with a clean slate.
      It might no retain any memory of the bug it found some time back in another
      service. The Netflix engineering team built a Pattern Catalog to make the models
      achieve persistence. This was done by pairing a stateless LLM with a stateful
      catalog. Or a shared memory across the fleet.\\nThe Pattern Catalog was built
      around 4 key principles.\\nFirst, it has to be centralized and serve as the
      single source of truth for all engineering teams. This way, no two teams end
      up debugging the same issues.\\nThe second principle is that the same catalog
      entries should work across distinct environments. For example, offline profiling,
      CI/CD pull request checks, and local development tools.\\nThird, you need to
      format entries so that an automation script can easily inject them into an LLM\u2019s
      system prompt.\\nLastly, the contents of the catalog should be reviewable by
      human developers.\\nTo implement the Pattern Catalog, the Netflix engineering
      team used a simple Git repository filled with plain Markdown files. They didn\u2019t
      use vector databases or complex knowledge stores. The idea was borrowed from
      the \u201CLLM-wiki\u201D concept popularized by Andrej Karpathy.\\nBy using
      a standard Git repository, the developers got several advantages. For one, developers
      can diff changes, open pull requests, and use git features to find out why an
      entry was created. It also scales well to 100s of detailed performance rules
      without the need for complex search infrastructure. Lastly, plain Markdown is
      easy for both humans and language models to read without translation layers.\\nWith
      the Pattern Catalog in place, Netflix can handle performance engineering via
      two paths. Reactive and Proactive.\\nIn the reactive path, your system profiles
      production services on a recurring schedule or on demand. When the agent finds
      a new bottleneck, it tests the fix on a canary instance. If everything goes
      fine, the patch is merged, and the agent documents the new finding in the Pattern
      Catalog.\\nIn the proactive path, the process starts when a developer creates
      a new PR. CI tooling performs a fast regex or symbol match against the Pattern
      Catalog index. If the code in the PR matches known anti-patterns, the CI bot
      calls an LLM and provides it with the pull request diff. The LLM checks the
      context and leaves an inline comment that explains the inefficiency. It shows
      the resource impact and suggests a fix. All this happens before the code ever
      merges to the main branch.\\nThe key learning from the Netflix engineering experience
      is that automating performance engineering work is not an all-or-nothing game.
      You can have organizations adopt workflows along a four-level maturity spectrum.\\nLevel
      0 is the manual situation. This is the level where machine learning is not used.
      Human developers manually capture traces, interpret flame graphs, and trace
      code paths.\\nLevel 1 is the assist approach. This is the entry point for AI
      adoption. The LLM acts as an analytical copilot. A developer initiates the profiling
      process. But they don\u2019t spend time studying flame graphs. Instead, they
      feed the stack dump to the model. The model finds the hot execution path.\\nLevel
      2 is the orchestration level. This is the current state at Netflix. A lot of
      proactive scanning happens. Also, they use the Pattern Catalog.\\nLevel 3 is
      the fully autonomous level. This is the long-term vision at Netflix for performance
      agents. At Level 3, the agents will create their own optimization strategies.
      They will explore multiple alternative implementations. Or run automated benchmarks.\\nReferences:\\n</text>\"}],\"model\":\"claude-haiku-5-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"summary\":{\"type\":\"object\",\"properties\":{\"gist\":{\"type\":\"string\"},\"key_ideas\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"timestamp\":{\"type\":[\"string\",\"null\"]},\"idea\":{\"type\":\"string\"}},\"required\":[\"timestamp\",\"idea\"],\"additionalProperties\":false}},\"numbers\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"timestamp\":{\"type\":[\"string\",\"null\"]},\"fact\":{\"type\":\"string\"}},\"required\":[\"timestamp\",\"fact\"],\"additionalProperties\":false}}},\"required\":[\"gist\",\"key_ideas\",\"numbers\"],\"additionalProperties\":false},\"domain\":{\"type\":\"string\",\"enum\":[\"AI\",\"Macro\",\"Crypto\",\"Startups\",\"Finance\",\"Tech\",\"History\",\"Security\",\"Sports\",\"Other\"]},\"topic\":{\"type\":\"string\"},\"tags\":{\"type\":\"array\",\"items\":{\"type\":\"string\"}},\"concepts\":{\"type\":\"array\",\"items\":{\"type\":\"string\"}},\"is_educational\":{\"type\":\"boolean\"},\"cards\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"kind\":{\"type\":\"string\",\"enum\":[\"concept\",\"mechanism\",\"number\"]},\"question\":{\"type\":\"string\"},\"answer\":{\"type\":\"string\"}},\"required\":[\"kind\",\"question\",\"answer\"],\"additionalProperties\":false}}},\"required\":[\"summary\",\"domain\",\"topic\",\"tags\",\"concepts\",\"is_educational\",\"cards\"],\"additionalProperties\":false}}},\"system\":\"You
      process sources for a personal learning app. A source is an article, an X post
      or thread, or an episode (podcast or video) that the user consumed or plans
      to. A newsletter is an email digest; summarize its main stories. The user wants
      \\\"level 2\\\" knowledge of its subject: enough to hold a real conversation
      about it, including the vocabulary, how things work, the key players, rough
      numbers, and the current debates.\\n\\nFrom the text, produce:\\n- summary:
      the gist in 2-3 sentences, the key ideas, and the numbers worth remembering.
      The text of an episode may carry markers like [12:14] or [1:02:03] at roughly
      one-minute intervals; give each key idea and number the marker nearest before
      where it comes up, copied exactly, and null when the text has no markers. Skip
      ads and sponsor reads.\\n- domain: the one broad domain the source belongs to.\\n-
      topic: a short, reusable topic name under that domain (e.g. \\\"Stablecoins\\\",
      \\\"Fed policy\\\", \\\"NFL quarterbacks\\\").\\n- tags: 3-8 short tags.\\n-
      concepts: the key concepts the source relies on or teaches, as short noun phrases.\\n-
      is_educational: true when the source teaches something worth remembering (how
      things work, history, ideas, numbers). false for pure entertainment such as
      banter, sports chat, jokes or gossip. A mostly entertaining source with real
      teaching in it (e.g. how a contract works, why a play scheme succeeds) is still
      true.\\n- cards: when is_educational is true, 3-5 open-recall review cards of
      kind concept, mechanism (\\\"why does X cause Y\\\") or number (a rough figure
      worth knowing). Each card asks ONE focused question, never a compound one with
      several parts. Each answer is what a good response would cover in 1-3 sentences.
      Avoid trivia that only matters to this one source. Cards come only from the
      educational stretches of a source: a mostly entertaining show with one educational
      segment gets cards for that segment; still 3-5. When is_educational is false,
      cards is an empty list.\\n\\nWrite in plain, conversational English for a smart
      reader who is new to the subject. Short sentences. Define any jargon the first
      time it appears. Prefer concrete examples and rough numbers (\\\"~1 GW\\\",
      not \\\"1.07 GW\\\").\"}"
