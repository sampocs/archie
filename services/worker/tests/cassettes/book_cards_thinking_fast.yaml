    body: "{\"max_tokens\":6000,\"messages\":[{\"role\":\"user\",\"content\":\"Book:
      Thinking, Fast and Slow\\nAuthor: Daniel Kahneman\\n\\n<thoughts>\\nAnchoring
      stuck with me most, and how confident System 1 feels even when it is wrong.\\n</thoughts>\\n\\n<refresher>\\nKahneman
      describes two modes of thought: fast, intuitive System 1 and slow, effortful
      System 2.\\n\\nKey ideas:\\n- **Two systems.** System 1 is automatic; System
      2 is deliberate and lazy.\\n- **Anchoring.** An arbitrary number shifts later
      estimates toward it.\\n- **Loss aversion.** Losses weigh about twice as much
      as equal gains.\\n- **WYSIATI.** System 1 builds a story only from the evidence
      at hand.\\n- **Availability.** What comes to mind easily feels more common.\\n-
      **Planning fallacy.** Plans ignore base rates and run over.\\n\\nNumbers:\\n-
      Losses feel roughly twice as strong as gains of the same size.\\n</refresher>\"}],\"model\":\"claude-sonnet-5-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"book_kind\":{\"type\":\"string\",\"enum\":[\"how_to\",\"idea\",\"textbook\"]},\"cards\":{\"type\":\"array\",\"items\":{\"type\":\"object\",\"properties\":{\"kind\":{\"type\":\"string\",\"enum\":[\"concept\",\"mechanism\",\"number\"]},\"question\":{\"type\":\"string\"},\"answer\":{\"type\":\"string\"},\"detail\":{\"type\":\"array\",\"items\":{\"type\":\"string\"}}},\"required\":[\"kind\",\"question\",\"answer\",\"detail\"],\"additionalProperties\":false}}},\"required\":[\"book_kind\",\"cards\"],\"additionalProperties\":false}}},\"system\":\"You
      write review cards for a book the user read, so they remember what it teaches.
      You get the user's notes or thoughts on the book (if any) and a refresher of
      it.\\n\\nFirst decide what kind of book it is, in book_kind; that sets how many
      cards it gets, however long the book or the notes are:\\n- how_to: a how-to
      or beginner's guide (to a game, a tool, a process): 4-6 cards.\\n- idea: an
      idea book (one argument or field, told through stories and studies): 6-10 cards.\\n-
      textbook: a dense textbook or reference covering many separate systems or ideas:
      10-15 cards.\\nStay inside the range: choose the ideas that matter most. Order
      the cards from most to least important.\\n\\nWhat to card: one card per core
      idea, never one per fact: its key concepts, how its mechanisms work (\\\"why
      does X cause Y\\\"), and a few rough numbers worth knowing. What the user's
      thoughts or notes dwell on is a strong candidate and comes first; fill with
      the book's own main ideas. Prefer a contrast between two things (\\\"declarative
      vs imperative\\\") over a card that asks to recite a list. When recognizing
      the items of a list is itself worth remembering, ask for some of them (\\\"Name
      three\u2026\\\") and give the whole list as the answer. Never card a chapter-by-chapter
      walk-through, an anecdote (who did what, when, where), a name or date that only
      matters inside the book, or a single study's details: a study gets a card only
      when it is the evidence for one of the book's core ideas, and then the card
      asks what it showed. A number card is a lasting figure about the subject, never
      a detail of one person's story or one experiment.\\n\\nEach card is of kind
      concept, mechanism or number, worded from the refresher. Never mention the notes,
      the thoughts, the refresher or the user in a card.\\n\\nEach card has a question,
      an answer and a detail:\\n- question: ONE focused question with ONE thing to
      recall. Never join two asks with \\\"and\\\" (\\\"What does X give you, and
      what can you lose?\\\" is two cards, or pick one). Ask only what has a short
      answer.\\n- answer: the one thing to recall, in as few words as carry it: a
      phrase, not a sentence. Aim for 2-8 words, never more than 15. The learner is
      graded only on this, so it is what someone who knows the material would say
      off the top of their head. When two things are both essential, name both briefly
      (\\\"Supply and demand\\\"). A number card's answer is the rough figure with
      its unit.\\n- detail: 0-3 short bullet lines, each under 12 words. Shown after
      the learner answers, never graded. Each line must help explain the answer (the
      why or how behind it, or a contrast that makes it click); a further fact about
      the subject, however true, is not a reason for a line. No padding and no redundancy:
      never a line that restates the answer, is implied by it or repeats another line;
      that is trivia from this one source (who said it, when, a passing example or
      anecdote) rather than a lasting fact about the subject; or that is a side remark
      that doesn't help recall. So a plain fact or a number usually needs none and
      most whys need one; use two or three only when the explanation really has that
      many steps (A happens, so B, so C) or named parts (the three phases of a cycle).
      When in doubt, use fewer.\"}"
