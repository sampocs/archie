        1456w\" sizes=\"auto, 100vw\" loading=\"lazy\"/></picture><div class=\"image-link-expand\"><div
        class=\"pencraft pc-display-flex pc-gap-8 pc-reset\"><button tabindex=\"0\"
        type=\"button\" class=\"pencraft pc-reset pencraft icon-container restack-image
        buttonBase-GK1x3M\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0
        0 20 20\" fill=\"none\" stroke-width=\"1.5\" stroke=\"var(--color-fg-primary)\"
        stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"
        class=\"icon-noB79L\"><g><path d=\"M2.53001 7.81595C3.49179 4.73911 6.43281
        2.5 9.91173 2.5C13.1684 2.5 15.9537 4.46214 17.0852 7.23684L17.6179 8.67647M17.6179
        8.67647L18.5002 4.26471M17.6179 8.67647L13.6473 6.91176M17.4995 12.1841C16.5378
        15.2609 13.5967 17.5 10.1178 17.5C6.86118 17.5 4.07589 15.5379 2.94432 12.7632L2.41165
        11.3235M2.41165 11.3235L1.5293 15.7353M2.41165 11.3235L6.38224 13.0882\"></path></g></svg></button><button
        tabindex=\"0\" type=\"button\" class=\"pencraft pc-reset pencraft icon-container
        view-image buttonBase-GK1x3M\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\"
        height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"
        stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide
        lucide-maximize2 lucide-maximize-2 icon-noB79L\"><polyline points=\"15 3 21
        3 21 9\"></polyline><polyline points=\"9 21 3 21 3 15\"></polyline><line x1=\"21\"
        x2=\"14\" y1=\"3\" y2=\"10\"></line><line x1=\"3\" x2=\"10\" y1=\"21\" y2=\"14\"></line></svg></button></div></div></div></a></figure></div><p>In
        the reactive path, your system profiles production services on a recurring
        schedule or on demand. When the agent finds a new bottleneck, it tests the
        fix on a canary instance. If everything goes fine, the patch is merged, and
        the agent documents the new finding in the Pattern Catalog.</p><p>In the proactive
        path, the process starts when a developer creates a new PR. CI tooling performs
        a fast regex or symbol match against the Pattern Catalog index. If the code
        in the PR matches known anti-patterns, the CI bot calls an LLM and provides
        it with the pull request diff. The LLM checks the context and leaves an inline
        comment that explains the inefficiency. It shows the resource impact and suggests
        a fix. All this happens before the code ever merges to the main branch.</p><h2
        class=\"header-anchor-post\">Conclusion<div class=\"pencraft pc-display-flex
        pc-alignItems-center pc-position-absolute pc-reset header-anchor-parent\"><div
        class=\"pencraft pc-display-contents pc-reset pubTheme-yiXxQA\"><div class=\"pencraft
        pc-reset header-anchor offset-top\" id=\"\xA7conclusion\"></div><button class=\"pencraft
        pc-reset pencraft iconButton-mq_Et5 iconButtonBase-dJGHgN buttonBase-GK1x3M
        buttonStyle-r7yGCK size_sm-G3LciD priority_secondary-S63h9o\" tabindex=\"0\"
        type=\"button\" data-href=\"https://blog.bytebytego.com/i/222755655/conclusion\"><svg
        xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0
        0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"
        stroke-linejoin=\"round\" class=\"lucide lucide-link\"><path d=\"M10 13a5
        5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"></path><path d=\"M14
        11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"></path></svg></button></div></div></h2><p>The
        key learning from the Netflix engineering experience is that automating performance
        engineering work is not an all-or-nothing game. You can have organizations
        adopt workflows along a four-level maturity spectrum.</p><p>Level 0 is the
        manual situation. This is the level where machine learning is not used. Human
        developers manually capture traces, interpret flame graphs, and trace code
        paths.</p><p>Level 1 is the assist approach. This is the entry point for AI
        adoption. The LLM acts as an analytical copilot. A developer initiates the
        profiling process. But they don\u2019t spend time studying flame graphs. Instead,
        they feed the stack dump to the model. The model finds the hot execution path.</p><p>Level
        2 is the orchestration level. This is the current state at Netflix. A lot
        of proactive scanning happens. Also, they use the Pattern Catalog.</p><p>Level
        3 is the fully autonomous level. This is the long-term vision at Netflix for
        performance agents. At Level 3, the agents will create their own optimization
        strategies. They will explore multiple alternative implementations. Or run
        automated benchmarks.</p><p><strong>References:</strong></p><ul><li><p><a
        href=\"https://p99conf.io/session/the-autonomous-performance-agent-a-netflix-production-story/\">A
        Netflix Production Story - P99 Conference</a></p></li></ul></div></div><div
        class=\"visibility-check\"></div></div><div class=\"post-footer\"><div class=\"pencraft
        pc-display-flex pc-gap-16 pc-paddingY-16 pc-justifyContent-space-between pc-alignItems-center
