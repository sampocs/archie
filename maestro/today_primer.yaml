appId: com.sampocs.archie
---
# A queued primer, end to end: finish an article with "Parts lost me", its primer lands in Up next, open it, Mark
# as done. Needs the owner's keys: the worker calls Anthropic for this article (a few cents). Run it only against
# `make start-local` with ANTHROPIC_API_KEY in .env (local backend only).
- runFlow: login.yaml
- openLink: archie://dev/login?whitelisted=1
- extendedWaitUntil:
    visible: "Open"
    timeout: 5000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- tapOn:
    id: "library-add"
# The first tap right after login is sometimes swallowed while the screen settles.
- runFlow:
    when:
      notVisible:
        id: "add-url"
    commands:
      - tapOn:
          id: "library-add"
- extendedWaitUntil:
    visible:
      id: "add-url"
    timeout: 5000
- tapOn:
    id: "add-url"
- inputText: "https://paulgraham.com/hwh.html"
# The keyboard hides Save; tapping the screen's hint text dismisses it.
- tapOn: "Paste a link, or type a book's title."
- tapOn:
    id: "intent-queue"
- tapOn:
    id: "add-save"
# Saving lands on Library; open the queued article once the worker's title is on its row. The row's whole label is
# matched: the meta line alone ("Article · paulgraham.com") also matches a paulgraham pattern and doesn't open it.
- extendedWaitUntil:
    visible: ".*How to Work Hard, Article.*"
    timeout: 30000
- tapOn: ".*How to Work Hard, Article.*"
# One wait only (Maestro shares the timeout across consecutive waits): the primer button shows its reading time once
# the primer has synced.
- extendedWaitUntil:
    visible: "◆ Primer · .* min"
    timeout: 240000
- tapOn:
    id: "item-finish"
- tapOn:
    id: "finish-lost"
# "Parts lost me" offers to queue the primer, ticked by default.
- assertVisible:
    id: "finish-queue-primer"
- assertVisible: "✓, Queue the primer, .*"
- tapOn:
    id: "finish-save"
- tapOn:
    id: "screen-back"
- tapOn:
    id: "tab-today"
# The queued primer is the top of the queue, as its own row.
- assertVisible:
    id: "up-next-0"
- assertVisible: ".*Primer: How to Work Hard.*"
- tapOn:
    id: "up-next-0"
- assertVisible:
    id: "primer-for"
- assertVisible:
    id: "primer-body"
- tapOn:
    id: "primer-done"
# Mark as done takes it off the queue (other flows' queued items may still be in Up next).
- assertNotVisible: ".*Primer: How to Work Hard.*"
