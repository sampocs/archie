appId: com.sampocs.archie
---
# Free: no summary is needed, only a queued link to finish.
- runFlow: login.yaml
- tapOn:
    id: "library-add"
- runFlow:
    when:
      notVisible:
        id: "add-url"
    commands:
      - tapOn:
          id: "library-add"
- extendedWaitUntil:
    visible:
      id: "add-url"
    timeout: 5000
- tapOn:
    id: "add-url"
- inputText: "https://example.net/"
# The reaction row can push Save under the keyboard; tapping the screen's hint text dismisses it.
- tapOn: "Paste a link, or type a book's title."
- tapOn:
    id: "intent-queue"
- tapOn:
    id: "add-save"
# Saving lands on Library; open the queued source.
- tapOn: ".*example\\.net.*"
# example.net can't be read, so the item fails within seconds and its error line pushes the buttons down; wait for
# that to settle so the tap doesn't land where the button used to be.
- extendedWaitUntil:
    visible: "Retry"
    timeout: 30000
- tapOn:
    id: "item-finish"
- tapOn:
    id: "finish-mostly"
- tapOn:
    id: "finish-save"
- assertNotVisible:
    id: "item-finish"
- assertVisible: "Mostly followed"
- tapOn:
    id: "screen-back"
- tapOn:
    id: "filter-done"
- assertVisible: ".*example\\.net.*"
